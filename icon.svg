<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ShelfLife. One continuous line loops into an S (for Shelf) built
       from three stacked shelf-bars — the "infinite freshness loop".
       Fresh green throughout: this app is about keeping food alive. -->
  <rect width="512" height="512" fill="#0E1512"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BE07E"/>
      <stop offset="1" stop-color="#159A55"/>
    </linearGradient>
  </defs>
  <path d="M321 188 H191 A34 34 0 0 0 191 256 H321 A34 34 0 0 1 321 324 H191"
        fill="none" stroke="url(#g)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
