<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ShelfLife. Green + white: a single fresh leaf, the simplest possible
       mark for "keep food fresh." Full-bleed green so it reads as one clean
       shape on the home screen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17AC57"/>
      <stop offset="1" stop-color="#0C7D3C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- leaf body -->
  <path d="M256 92 C150 150 126 300 256 420 C386 300 362 150 256 92 Z" fill="#FFFFFF"/>
  <!-- midrib + veins, cut back to the green so the leaf reads -->
  <path d="M256 132 L256 400" stroke="#12A150" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 220 L196 182 M256 220 L316 182 M256 288 L188 250 M256 288 L324 250"
        stroke="#12A150" stroke-width="11" stroke-linecap="round" fill="none"/>
</svg>
