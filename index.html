<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfLife">
<title>ShelfLife</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS uses this PNG for the Add-to-Home-Screen icon; it ignores the SVG in the manifest. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ============================================================
   SHELFLIFE — design tokens
   Light, plain, easy to scan. Warm off-white surfaces, near-black
   text, and one fresh-green accent for anything you tap. Green is
   also "fresh/good", which is on-brand: the whole app is freshness,
   so the accent and the good-state share a colour on purpose.
   The rest of the freshness signal stays a simple traffic light:
   green = fresh, amber = eat soon, red = past its date.
   Colour is never decoration here — it means "act on me".
   ============================================================ */
:root{
  --void:#FBFAF7;      /* app background — warm off-white */
  --shelf:#FFFFFF;     /* card surface — white */
  --rime:#ECE7DE;      /* dividers, borders */
  --rime-hi:#D9D2C5;   /* raised border */
  --frost:#1C1813;     /* primary text — warm near-black */
  --vapor:#726A5C;     /* secondary text */
  --vapor-dim:#A69C8B; /* tertiary */

  --cold:#159A55;      /* accent — fresh green (buttons, active tab, focus) */
  --chill:#159A55;     /* good — green (success, nothing-missing) */
  --thaw:#DD7A1E;      /* eat soon — amber */
  --spoil:#D6453F;     /* past date — red */
  --fresh:#2E8B57;     /* fresh — calm green */

  --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono','Roboto Mono',Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --pad:16px;
  --r:10px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--frost);font-family:var(--sans);overscroll-behavior-y:contain}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:var(--mono);font-size:16px;background:var(--void);color:var(--frost);border:1px solid var(--rime-hi);border-radius:8px;padding:11px 12px;width:100%}
input:focus,select,textarea:focus,button:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
::placeholder{color:var(--vapor-dim)}

/* ---- structural type: the manifest voice ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--vapor-dim)}
.code{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;margin:0;color:var(--vapor)}

/* ---- chrome ---- */
header{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rime);padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:12px}
header .who{display:flex;align-items:center;gap:6px;font-size:18px;
  background:var(--shelf);border:1px solid var(--rime-hi);border-radius:999px;padding:4px 10px}
header #searchBtn{margin-left:auto;font-size:15px;background:var(--shelf);border:1px solid var(--rime-hi);
  border-radius:999px;width:38px;height:34px;display:grid;place-items:center}
header #cartBtn{font-size:15px;background:var(--shelf);border:1px solid var(--rime-hi);
  border-radius:999px;width:38px;height:34px;display:grid;place-items:center}
main{padding:var(--pad);max-width:640px;margin:0 auto}

nav{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(251,250,247,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--rime);display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--vapor-dim);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button[aria-current="page"]{color:var(--cold)}

/* ---- the signature: freshness rail + inkjet date code ---- */
.item{position:relative;display:flex;align-items:center;gap:11px;background:var(--shelf);
  border:1px solid var(--rime);border-radius:var(--r);padding:10px 11px 10px 17px;margin-bottom:8px;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rail,var(--vapor-dim))}
/* product thumbnail — real photo when we have one, first-letter tile when we don't */
.item .thumb{width:44px;height:44px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--void);
  border:1px solid var(--rime);display:grid;place-items:center}
.item .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item .thumb .ph{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--vapor-dim);text-transform:uppercase}
.item .thumb .emoji{font-size:25px;line-height:1}
.item .body{flex:1;min-width:0}
.item .nm{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;gap:8px;align-items:baseline;margin-top:3px}
/* inkjet date stamp, lifted straight off real packaging */
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--rail,var(--vapor));
  opacity:.9;text-transform:uppercase}
.qty{font-family:var(--mono);font-size:11px;color:var(--vapor);white-space:nowrap}
.item .act{display:flex;gap:5px;flex-shrink:0}
.item .act button{width:33px;height:33px;border:1px solid var(--rime-hi);border-radius:8px;
  display:grid;place-items:center;color:var(--vapor);font-family:var(--mono);font-size:16px;line-height:1}
.item .act button:active{background:var(--rime)}
.item .act button.plus{color:var(--fresh);border-color:var(--fresh)}

/* level pips for bulk goods */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:5px;height:11px;border-radius:1px;background:var(--rime-hi)}
.pips i.on{background:var(--rail,var(--cold))}

.card{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{background:var(--frost);color:var(--void);border-radius:9px;padding:13px 16px;font-family:var(--mono);
  font-size:13px;font-weight:600;letter-spacing:.03em;width:100%;display:block}
.btn.ghost{background:none;color:var(--frost);border:1px solid var(--rime-hi)}
.btn.cold{background:var(--cold);color:var(--void)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}
label{display:block;margin-bottom:14px}
label .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--vapor);display:block;margin-bottom:6px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 12px;border-radius:999px;
  border:1px solid var(--rime-hi);color:var(--vapor);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--frost);color:var(--void);border-color:var(--frost)}

.empty{text-align:center;padding:56px 20px;color:var(--vapor-dim)}
.empty .big{font-family:var(--mono);font-size:13px;color:var(--vapor);margin-bottom:6px}
.empty .sub{font-size:13px;line-height:1.5;max-width:34ch;margin:0 auto}

/* scanner */
#scanwrap{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;margin-bottom:12px}
#video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:16% 10%;border:1px solid rgba(21,154,85,.6);border-radius:6px;pointer-events:none}
.reticle::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--cold);
  box-shadow:0 0 10px var(--cold);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{top:6%}50%{top:94%}}
/* scan confirmation flash — on iOS this and the beep ARE the feedback (no vibration) */
.reticle{transition:background .12s ease,border-color .12s ease}
.reticle.hit{border-color:var(--chill);background:rgba(63,155,103,.18)}
.reticle.miss{border-color:var(--spoil);background:rgba(214,69,63,.18)}
/* torch toggle, only revealed when the camera track actually supports it */
.torchbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;
  background:rgba(10,14,19,.55);border:1px solid var(--rime-hi);display:grid;place-items:center;
  font-size:18px;backdrop-filter:blur(6px);z-index:2}
.torchbtn[aria-pressed="true"]{background:var(--frost)}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none}*{transition:none!important}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);z-index:60;
  background:var(--frost);color:var(--void);font-family:var(--mono);font-size:12px;font-weight:600;
  padding:11px 16px;border-radius:999px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  box-shadow:0 8px 30px rgba(28,24,19,.22)}
.toast button{color:var(--cold);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  background:var(--void);padding:5px 9px;border-radius:6px}

dialog{border:none;background:var(--shelf);color:var(--frost);border:1px solid var(--rime-hi);border-radius:14px;
  padding:18px;width:min(460px,calc(100vw - 28px));max-height:86dvh;overflow:auto;box-shadow:0 24px 70px rgba(28,24,19,.28)}
dialog::backdrop{background:rgba(28,24,19,.42);backdrop-filter:blur(3px)}

.recipe{border-left:4px solid var(--rail,var(--rime-hi));background:var(--shelf);border-radius:var(--r);
  padding:13px 13px 13px 15px;margin-bottom:9px;border-top:1px solid var(--rime);
  border-right:1px solid var(--rime);border-bottom:1px solid var(--rime)}
.recipe h3{font-family:var(--mono);font-size:14px;margin:0 0 5px;font-weight:600}
.gap{font-family:var(--mono);font-size:11px;color:var(--thaw)}
.gap.none{color:var(--chill)}
.tag{font-family:var(--mono);font-size:10px;color:var(--vapor-dim);letter-spacing:.06em}
.spin{width:15px;height:15px;border:2px solid var(--rime-hi);border-top-color:var(--cold);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.note{font-size:12px;color:var(--vapor);line-height:1.55}
.warn{border-left:3px solid var(--thaw);padding-left:10px;color:var(--thaw);font-size:12px;line-height:1.5}
</style>
</head>
<body>

<header>
  <h1 id="title">ShelfLife</h1>
  <button id="searchBtn" class="hide" aria-label="Search everything you have">🔎</button>
  <button id="cartBtn" class="hide" aria-label="Shopping list">🛒</button>
</header>

<main id="app"></main>

<nav id="nav"></nav>

<dialog id="dlg"></dialog>

<script>
/* ================================================================
   COLD ROOM — household food inventory
   Local-first. Works offline (your basement freezer has bad wifi).
   Optional cloud sync is a drop-in, not a dependency.
   ================================================================ */

/* ---------------- storage: tiny IndexedDB wrapper ---------------- */
const DB = (() => {
  let db;
  const STORES = ['items','catalog','recipes','meta','log','shopping'];
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('coldroom', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode = 'readonly') => db.transaction(store, mode).objectStore(store);
  const p = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
  return {
    async init() { await open(); },
    get: (s, id) => p(tx(s).get(id)),
    all: (s) => p(tx(s).getAll()),
    put: (s, v) => p(tx(s, 'readwrite').put(v)),
    del: (s, id) => p(tx(s, 'readwrite').delete(id)),
  };
})();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 86400000;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };

/* ---------------- shelf life: category x location-kind ----------------
   The whole point: you never type an expiry date. Ever.
   Days are deliberately conservative-but-real, not the printed
   "best by" date, which is a marketing artifact, not a safety line. */
const SHELF = {
  //                      fridge  freezer  pantry
  'dairy-milk':          [   7,     90,      0 ],
  'dairy-cheese-hard':   [  35,    180,      0 ],
  'dairy-cheese-soft':   [  10,     60,      0 ],
  'dairy-yogurt':        [  21,     60,      0 ],
  'dairy-butter':        [  60,    270,      0 ],
  'eggs':                [  28,      0,      0 ],
  'meat-raw':            [   2,    180,      0 ],
  'poultry-raw':         [   2,    270,      0 ],
  'fish-raw':            [   2,    180,      0 ],
  'deli-meat':           [   5,     60,      0 ],
  'leftovers':           [   4,     90,      0 ],
  'produce-leafy':       [   6,     30,      2 ],
  'produce-berry':       [   5,    300,      1 ],
  'produce-hardy':       [  21,    240,     10 ],
  'produce-root':        [  40,    300,     60 ],
  'produce-citrus':      [  28,    120,     10 ],
  'produce-banana':      [   7,     90,      4 ],
  'produce-avocado':     [   7,     90,      3 ],
  'herbs-fresh':         [   7,    120,      0 ],
  'bread':               [  10,     90,      4 ],
  'tortilla':            [  30,    180,      7 ],
  'frozen-meal':         [   0,    240,      0 ],
  'frozen-veg':          [   0,    300,      0 ],
  'ice-cream':           [   0,     90,      0 ],
  'canned':              [ 400,      0,    730 ],
  'jarred-sauce':        [  10,      0,    540 ],
  'condiment':           [ 180,      0,    365 ],
  'dry-pasta-rice':      [   0,      0,    720 ],
  'dry-grain-flour':     [ 365,    365,    240 ],
  'snack':               [   0,      0,     90 ],
  'cereal':              [   0,      0,    180 ],
  'baking':              [   0,      0,    540 ],
  'oil-vinegar':         [   0,      0,    365 ],
  'coffee-tea':          [   0,      0,    240 ],
  'juice-drink':         [  10,    180,    270 ],
  'nuts-seeds':          [ 180,    365,     90 ],
  'spice':               [   0,      0,   1000 ],
  'other':               [  14,    180,    180 ],
};
const KIND_IDX = { fridge: 0, freezer: 1, pantry: 2 };

/* Once opened, the clock changes completely. Unopened sour cream
   lasts weeks; opened lasts ten days. This is where most waste hides. */
const OPENED_DAYS = {
  'dairy-milk':7,'dairy-cheese-hard':21,'dairy-cheese-soft':7,'dairy-yogurt':7,
  'deli-meat':4,'jarred-sauce':7,'juice-drink':7,'condiment':120,'canned':3,
  'bread':7,'produce-leafy':3,'nuts-seeds':60,'coffee-tea':30,
};

/* count = discrete things you can literally count.
   level = bulk things nobody weighs (milk, flour, oil).
   pack  = Costco's fault. A container holding N units. */
const UNIT_MODE = {
  'dairy-milk':'level','oil-vinegar':'level','dry-grain-flour':'level','dry-pasta-rice':'level',
  'condiment':'level','jarred-sauce':'level','juice-drink':'level','coffee-tea':'level',
  'cereal':'level','baking':'level','spice':'level','nuts-seeds':'level',
  'produce-leafy':'level','herbs-fresh':'level','dry-grain':'level',
};
const unitModeFor = cat => UNIT_MODE[cat] || 'count';

/* Map Open Food Facts' sprawling category tags onto our small vocabulary.
   Order matters — first hit wins, so specific before general. */
const OFF_MAP = [
  [/ice-?cream|frozen-desserts/,'ice-cream'],
  [/frozen-vegetab|frozen-fruit/,'frozen-veg'],
  [/frozen-meals|pizza|ready-meal/,'frozen-meal'],
  [/milks?$|milk-|dairy-drink/,'dairy-milk'],
  [/yogh?urt|yaourt/,'dairy-yogurt'],
  [/butter|margarin/,'dairy-butter'],
  [/hard-cheese|parmes|cheddar|gouda/,'dairy-cheese-hard'],
  [/cheese|fromage/,'dairy-cheese-soft'],
  [/eggs?$/,'eggs'],
  [/poultry|chicken|turkey/,'poultry-raw'],
  [/fish|seafood|salmon|tuna|shrimp/,'fish-raw'],
  [/deli|charcuter|ham$|salami|bacon/,'deli-meat'],
  [/meats?$|beef|pork|lamb/,'meat-raw'],
  [/breads?|baguette|bagel|bun/,'bread'],
  [/tortilla|wrap/,'tortilla'],
  [/canned|tinned|preserve/,'canned'],
  [/sauce|salsa|pesto|ketchup/,'jarred-sauce'],
  [/condiment|mustard|mayonn|dressing/,'condiment'],
  [/pastas?|rice|noodle|couscous/,'dry-pasta-rice'],
  [/flour|baking/,'baking'],
  [/cereal|granola|oat/,'cereal'],
  [/oils?$|vinegar|olive-oil/,'oil-vinegar'],
  [/coffee|teas?$|infusion/,'coffee-tea'],
  [/juice|soda|water|beverage|drink/,'juice-drink'],
  [/nuts|seeds|almond|peanut/,'nuts-seeds'],
  [/spice|herb|seasoning/,'spice'],
  [/snack|chips|crisps|biscuit|cookie|candy|chocolate|bar/,'snack'],
  [/salad|lettuce|spinach|greens|kale/,'produce-leafy'],
  [/berr|strawb|blueb|raspb/,'produce-berry'],
  [/banana/,'produce-banana'],
  [/avocado/,'produce-avocado'],
  [/citrus|orange|lemon|lime|grapefruit/,'produce-citrus'],
  [/potato|onion|carrot|garlic|root/,'produce-root'],
  [/vegetab|fruits?$|produce/,'produce-hardy'],
];
/* Test each tag separately, not the joined blob — otherwise an
   $-anchored pattern like /milks?$/ never fires, because the string
   it's handed is "en:milks,en:dairies" and only the last tag can win.
   Patterns loop outer so the specific-before-general ordering holds. */
const mapCat = tags => {
  const list = String(tags || '').toLowerCase()
    .split(/[,\s]+/).map(t => t.replace(/^[a-z]{2}:/, '')).filter(Boolean);
  for (const [re, cat] of OFF_MAP) if (list.some(t => re.test(t))) return cat;
  return 'other';
};

const CATS = Object.keys(SHELF);

/* ---------------- state ---------------- */
let S = { items: [], catalog: [], recipes: [], shopping: [], household: null, cfg: {}, view: 'soon', loc: 'all', who: null, q: '', cq: '', open: new Set() };

const kindOf = id => (S.household?.locations.find(l => l.id === id)?.kind) || 'pantry';

function baseDays(cat, kind) {
  let d = (SHELF[cat] || SHELF.other)[KIND_IDX[kind]];
  if (!d) d = (SHELF[cat] || SHELF.other)[2] || 14;   // wrong-shelf fallback
  return d;
}
/* Per-store learning: a bounded offset per category, learned from the real
   dates the family confirms, shared across phones via the household record. */
const learnedOffset = cat => { const v = S.household?.learn?.[cat]; return typeof v === 'number' ? Math.max(-14, Math.min(30, v)) : 0; };
function estimateExpiry(cat, locId, opened) {
  const kind = kindOf(locId);
  let d = Math.max(1, baseDays(cat, kind) + learnedOffset(cat));
  if (opened && OPENED_DAYS[cat]) d = Math.min(d, OPENED_DAYS[cat]);
  return today() + d * DAY;
}
/* Learn from a genuinely-confirmed date (typed, scanned, or read off a
   photo) — never from a relative "still good" bump. Heavily clamped so a
   bad reading can't corrupt the estimates. */
async function learnFromDate(it) {
  if (!it || !it.dateConfirmed || !S.household) return;
  const base = baseDays(it.cat, kindOf(it.loc));
  const observed = Math.round((it.expires - (it.added || today())) / DAY);
  if (observed < 0 || observed > 1200) return;
  const delta = observed - base;
  if (Math.abs(delta) > 60) return;                   // ignore wild outliers
  const learn = S.household.learn || (S.household.learn = {});
  learn[it.cat] = Math.max(-14, Math.min(30, Math.round(0.5 * (learn[it.cat] || 0) + 0.5 * delta)));
  await saveHousehold();
}

/* The few categories where the PRINTED date really matters and the guess
   can be badly wrong (milk bought today might be 4 days or 14). These are
   the only items we ever nudge the user to verify — everything else, the
   category estimate is plenty. */
const HIGH_RISK = new Set(['dairy-milk','dairy-cheese-soft','dairy-yogurt','meat-raw','poultry-raw','fish-raw','deli-meat','produce-leafy','produce-berry','leftovers']);
const isHighRisk = cat => HIGH_RISK.has(cat);

/* Parse a date the vision model spotted on a package ("2026-08-12"), and
   only trust it if it lands in a sane window — guards against misreads. */
function parseExpiry(s) {
  if (!s) return null;
  const t = Date.parse(String(s).trim());
  if (isNaN(t)) return null;
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const now = today();
  if (d.getTime() < now - 7 * DAY || d.getTime() > now + 1095 * DAY) return null;
  return d.getTime();
}

/* ---------------- free on-device date OCR (Tesseract) ----------------
   "Video for the expiration dates" — read the printed date with ZERO API
   calls, offline, unlimited. Vendored + lazy-loaded (~a few MB, cached
   after first use). Its sweet spot is exactly this: digits and dates. */
const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
function ymd(y, mo, d) {
  mo = +mo; d = +d; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return parseExpiry(`${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
}
/* Pull a date out of OCR'd (or any) text across the formats packages use. */
function extractDate(text) {
  const t = String(text || '').toUpperCase().replace(/[^\w\/.\-: ]/g, ' ');
  let m;
  if ((m = t.match(/\b(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/))) return ymd(m[1], m[2], m[3]);          // YYYY-MM-DD
  if ((m = t.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return ymd(y, m[1], m[2]); } // MM/DD/YYYY (US)
  if ((m = t.match(/\b(\d{1,2})\s*([A-Z]{3})[A-Z]*\s*(20\d{2}|\d{2})\b/))) { const mo = MONTHS[m[2].toLowerCase()]; if (mo) return ymd(m[3].length === 2 ? '20' + m[3] : m[3], mo, m[1]); } // DD MON YYYY
  if ((m = t.match(/\b([A-Z]{3})[A-Z]*\s*(\d{1,2})\s*,?\s*(20\d{2}|\d{2})\b/))) { const mo = MONTHS[m[1].toLowerCase()]; if (mo) return ymd(m[3].length === 2 ? '20' + m[3] : m[3], mo, m[2]); } // MON DD YYYY
  return null;
}
const tessUrl = p => new URL('tess/' + p, location.href).href;
let tessWorker = null, tessLibLoading = null;
function loadTessLib() {
  if (window.Tesseract) return Promise.resolve();
  if (tessLibLoading) return tessLibLoading;
  tessLibLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = tessUrl('tesseract.min.js');
    s.onload = () => res(); s.onerror = () => { tessLibLoading = null; rej(new Error('date reader failed to load')); };
    document.head.appendChild(s);
  });
  return tessLibLoading;
}
async function getTessWorker() {
  await loadTessLib();
  if (!tessWorker) {
    tessWorker = await Tesseract.createWorker('eng', 1, {
      workerPath: tessUrl('worker.min.js'),
      corePath: tessUrl(''),
      langPath: tessUrl(''),
      gzip: true,
    });
    await tessWorker.setParameters({ tessedit_char_whitelist: '0123456789/.:- ABCDEFGHIJKLMNOPQRSTUVWXYZ' });
  }
  return tessWorker;
}
async function ocrDate(imageUrl) {
  const w = await getTessWorker();
  const { data } = await w.recognize(imageUrl);
  return { text: data.text || '', date: extractDate(data.text) };
}
async function scanDateForItem(it, file) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<h1 style="margin:0 0 12px"><span class="spin"></span> Reading the date…</h1>
    <p class="note">On-device — no internet, no AI limits. The first scan loads the reader (a few MB, cached after).</p>`;
  dlg.showModal();
  try {
    const { b64, mime } = await toB64(file);
    const { date, text } = await ocrDate(`data:${mime};base64,${b64}`);
    if (date) {
      it.expires = date; it.dateConfirmed = true; await saveItem(it); learnFromDate(it);
      dlg.close(); render();
      toast(`${it.name} — good until ${fmtDate(date).replace('EXP ', '')}`);
    } else {
      dlg.innerHTML = `<h1 style="margin:0 0 10px">Couldn't find a date</h1>
        <p class="note" style="margin-bottom:12px">Read: "${esc((text || '').trim().slice(0, 80))}". Try a closer, flatter shot of just the date — or type it.</p>
        <button class="btn ghost" data-a="type">Type the date</button>
        <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Close</button>`;
      dlg.querySelector('[data-a=type]').onclick = () => { dlg.close(); dateSheet(it); };
      dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
    }
  } catch (e) {
    dlg.innerHTML = `<h1 style="margin:0 0 10px">Scanner didn't load</h1>
      <div class="warn" style="margin-bottom:12px">${esc(e.message)}. If this is your first time offline, open the app once with signal so it caches.</div>
      <button class="btn ghost" onclick="document.getElementById('dlg').close()">Close</button>`;
  }
}

/* Freshness as temperature. Fresh things are cold. Dying things warm up.
   This is the single idea the whole interface is built on. */
function freshness(item) {
  const left = Math.round((item.expires - today()) / DAY);
  const span = Math.max(1, Math.round((item.expires - item.added) / DAY));
  const frac = left / span;
  let rail, label;
  if (left < 0)        { rail = 'var(--spoil)'; label = `EXPIRED ${-left}D`; }
  else if (left === 0) { rail = 'var(--spoil)'; label = 'TODAY'; }
  else if (left <= 2)  { rail = 'var(--spoil)'; label = `${left}D LEFT`; }
  else if (left <= 5 || frac < .18) { rail = 'var(--thaw)'; label = `${left}D LEFT`; }
  else                 { rail = 'var(--fresh)'; label = fmtDate(item.expires); }  // fresh stays quiet
  return { left, rail, label };
}
const fmtDate = ts => { const d = new Date(ts); return `EXP ${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; };
const LEVELS = ['out','low','half','most','full'];

/* ---------------- toast + undo ----------------
   Nothing destructive is ever one tap. A kid will nuke the freezer
   by accident on day three; this is the seatbelt. */
let toastT;
function toast(msg, undo) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span></span>`;
  el.firstChild.textContent = msg;
  if (undo) {
    const b = document.createElement('button');
    b.textContent = 'UNDO';
    b.onclick = async () => { await undo(); el.remove(); render(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), undo ? 8000 : 2800);   // longer window to catch an accidental tap
}

async function logAction(action, detail) {
  await DB.put('log', { id: uid(), ts: Date.now(), who: S.who?.name || '?', action, detail });
}

/* ---------------- item mutations ---------------- */
async function saveItem(it) {
  it.updatedAt = Date.now();
  await DB.put('items', it);
  const i = S.items.findIndex(x => x.id === it.id);
  if (i > -1) S.items[i] = it; else S.items.push(it);
  SYNC.push('items', it.id, it);
}

/* Shopping list — a synced store of its own. */
async function saveShopping(it) {
  it.updatedAt = Date.now();
  await DB.put('shopping', it);
  const i = S.shopping.findIndex(x => x.id === it.id);
  if (i > -1) S.shopping[i] = it; else S.shopping.push(it);
  SYNC.push('shopping', it.id, it);
}
async function saveHousehold() {
  S.household.id = 'household';
  S.household.updatedAt = Date.now();
  await DB.put('meta', S.household);
  SYNC.push('meta', 'household', S.household);
}

/* how many of this (by fuzzy name) are actually in the house right now —
   powers the shopping list's "you already have it" guard. */
function itemInStock(name) {
  const q = norm(name);
  return S.items.filter(i => !i.deleted && (norm(i.name).includes(q) || q.includes(norm(i.name)))).length;
}
async function addToList(name, qty) {
  const ex = S.shopping.find(s => !s.deleted && !s.done && norm(s.name) === norm(name));
  if (ex) { toast(`${name} is already on the list`); return ex; }
  const it = { id: uid(), name: String(name).trim(), qty: qty || '', by: S.who?.name || '', done: false, deleted: false };
  await saveShopping(it);
  return it;
}

async function addItem({ name, cat, loc, qty = 1, barcode = null, packSize = null, brand = '', image = null, expires = null, dateConfirmed = false }) {
  const mode = packSize ? 'pack' : unitModeFor(cat);
  const it = {
    id: uid(), name, brand, cat, loc, barcode, image,
    mode,
    qty: mode === 'level' ? null : qty,
    level: mode === 'level' ? 4 : null,
    packSize, unitsLeft: packSize || null,
    opened: false, added: today(),
    expires: expires || estimateExpiry(cat, loc, false),
    dateConfirmed: !!expires || dateConfirmed,   // real printed date -> trusted, not a guess
    by: S.who?.name || '?', deleted: false,
  };
  await saveItem(it);
  await logAction('add', name);
  if (it.dateConfirmed) learnFromDate(it);   // a real printed date was read at add time
  return it;
}

/* Depletion, the make-or-break. Every path funnels here. */
async function deplete(it, why = 'used') {
  const before = JSON.parse(JSON.stringify(it));
  const undo = async () => { await saveItem(before); };
  if (it.mode === 'level') {
    it.level = Math.max(0, it.level - 1);
    if (it.level === 0) it.deleted = true;
  } else if (it.mode === 'pack') {
    it.unitsLeft = Math.max(0, (it.unitsLeft ?? it.packSize) - 1);
    if (it.unitsLeft === 0) { it.qty -= 1; it.unitsLeft = it.qty > 0 ? it.packSize : 0; }
    if (it.qty <= 0) it.deleted = true;
  } else {
    it.qty -= 1;
    if (it.qty <= 0) it.deleted = true;
  }
  await saveItem(it);
  await logAction(why, it.name);
  toast(`${it.name} — ${it.deleted ? 'all gone' : 'one less'}`, undo);
  return undo;
}

async function markOpened(it) {
  const before = JSON.parse(JSON.stringify(it));
  it.opened = true;
  it.expires = Math.min(it.expires, estimateExpiry(it.cat, it.loc, true));
  await saveItem(it);
  toast(`Opened — clock reset to ${fmtDate(it.expires).replace('EXP ', '')}`, async () => { await saveItem(before); });
}

/* The waste log. The only feature here that saves money instead of
   just organising. Six months of this and you know exactly which
   good intentions you keep throwing away. */
async function tossItem(it) {
  const before = JSON.parse(JSON.stringify(it));
  it.deleted = true; it.wasted = true; it.wastedAt = Date.now();
  await saveItem(it);
  await logAction('wasted', it.name);
  toast(`${it.name} logged as wasted`, async () => { await saveItem(before); });
}

/* ---------------- lookups ---------------- */
async function lookupBarcode(code) {
  const mine = S.catalog.find(c => c.id === code);
  if (mine) return { ...mine, source: 'yours' };
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,categories_tags,quantity,image_front_small_url,image_small_url,image_thumb_url`, { signal: AbortSignal.timeout(6000) });
    const j = await r.json();
    if (j.status === 1 && j.product?.product_name) {
      return { id: code, name: j.product.product_name, brand: (j.product.brands || '').split(',')[0].trim(),
               cat: mapCat((j.product.categories_tags || []).join(' ')),
               image: j.product.image_front_small_url || j.product.image_small_url || j.product.image_thumb_url || null,
               source: 'off' };
    }
  } catch (e) { /* offline or miss — fall through to the ask-once path */ }
  return null;
}

async function learnProduct(p) {
  const rec = { id: p.id, name: p.name, brand: p.brand || '', cat: p.cat, packSize: p.packSize || null, image: p.image || null, lastLoc: p.lastLoc || null, learned: Date.now(), updatedAt: Date.now() };
  await DB.put('catalog', rec);
  const i = S.catalog.findIndex(c => c.id === rec.id);
  if (i > -1) S.catalog[i] = rec; else S.catalog.push(rec);
  SYNC.push('catalog', rec.id, rec);
}

/* ---------------- AI ----------------
   No model name is hardcoded — Google keeps killing free models (2.0-flash
   went to limit:0). We ask the key what it can do and pick the newest live
   one. Provider-agnostic: Gemini natively, or any OpenAI-compatible endpoint
   (OpenRouter's free models are the no-Google fallback). Same gen(parts,
   schema) signature everywhere; only the internals branch. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const verNum = id => { const m = String(id).match(/(\d+\.\d+)/); return m ? parseFloat(m[1]) : 0; };
const retryDelayMs = msg => { const m = String(msg).match(/retry in ([\d.]+)\s*s/i) || String(msg).match(/retryDelay["'\s:=]+([\d.]+)s/i); return m ? Math.ceil(parseFloat(m[1]) * 1000) : null; };
const onlyJson = t => { const s = t.indexOf('{'), a = t.indexOf('['); const st = s < 0 ? a : (a < 0 ? s : Math.min(s, a)); if (st < 0) return t; const e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']')); return e > st ? t.slice(st, e + 1) : t.slice(st); };

const G = {
  provider: () => S.cfg.aiProvider || 'gemini',
  key: () => (G.provider() === 'openai' ? S.cfg.openaiKey : S.cfg.geminiKey) || '',
  model: () => (G.provider() === 'openai' ? S.cfg.openaiModel : S.cfg.geminiModel) || '',
  base: () => (S.cfg.openaiBase || 'https://openrouter.ai/api/v1').replace(/\/+$/, ''),
  setModel: async id => { if (G.provider() === 'openai') S.cfg.openaiModel = id; else S.cfg.geminiModel = id; await saveCfg(); },
  /* known-dead / not-free Gemini models to never auto-pick */
  _dead: id => /gemini-(2\.0-flash|1\.5|1\.0)|-exp-|deprecated|-tuning/i.test(String(id)),

  async models() {
    if (G.provider() === 'openai') {
      const r = await fetch(`${G.base()}/models`, { headers: { Authorization: `Bearer ${G.key()}` } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || `Key rejected (HTTP ${r.status})`);
      return ((await r.json()).data || []).map(m => ({ id: m.id, label: m.id }));
    }
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${G.key()}`);
    if (!r.ok) throw new Error((await r.json()).error?.message || 'Key rejected');
    return (await r.json()).models
      .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
      .filter(m => !/embedding|aqa|imagen|veo/i.test(m.name))
      .map(m => ({ id: m.name.replace('models/', ''), label: m.displayName }));
  },

  /* pick the best default: newest live Flash for Gemini; a free vision model for OpenRouter */
  pick(models) {
    if (G.provider() === 'openai') {
      return (models.find(m => /:free/i.test(m.id) && /(vision|-vl|gemini|llava|qwen.*vl|llama.*(vision|scout|maverick)|pixtral|gemma)/i.test(m.id))
        || models.find(m => /:free/i.test(m.id)) || models[0])?.id;
    }
    const flash = models.filter(m => /flash/i.test(m.id) && !/lite|image|preview|thinking|8b/i.test(m.id) && !G._dead(m.id));
    flash.sort((a, b) => verNum(b.id) - verNum(a.id));
    return (flash[0] || models.find(m => !G._dead(m.id)) || models[0])?.id;
  },

  /* heal a stale/dead saved Gemini model at boot without any user action */
  async ensureModel() {
    if (G.provider() !== 'gemini' || !G.key()) return;
    if (G.model() && !G._dead(G.model())) return;
    try { const id = G.pick(await G.models()); if (id) await G.setModel(id); } catch (e) {}
  },

  async gen(parts, jsonSchema) {
    if (!G.key()) throw new Error(`No API key. Setup → paste your ${G.provider() === 'openai' ? 'OpenRouter' : 'Gemini'} key.`);
    if (!G.model()) throw new Error('No model chosen. Setup → Fetch models, pick one.');
    return G.provider() === 'openai' ? G._openai(parts, jsonSchema) : G._gemini(parts, jsonSchema);
  },

  async _fetchRetry(call, tries = 2) {
    for (let i = 0; ; i++) {
      const r = await call();
      if (r.ok) return r.json();
      let j = {}; try { j = await r.json(); } catch (e) {}
      const msg = j.error?.message || `HTTP ${r.status}`;
      if (r.status === 429 && i < tries) {
        const wait = retryDelayMs(msg);
        if (wait && wait <= 6000) { await sleep(wait + 300); continue; }
      }
      if (r.status === 429) throw new Error(msg + '\n\nTip: your free quota is spent or the model is discontinued. Wait a bit, or Setup → pick another model / switch to OpenRouter.');
      throw new Error(msg);
    }
  },

  async _gemini(parts, jsonSchema) {
    const body = { contents: [{ parts }] };
    if (jsonSchema) body.generationConfig = { responseMimeType: 'application/json', responseSchema: jsonSchema };
    const j = await G._fetchRetry(() => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${G.model()}:generateContent?key=${G.key()}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }));
    const t = j.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!t) throw new Error('Empty response');
    return jsonSchema ? JSON.parse(t) : t;
  },

  async _openai(parts, jsonSchema) {
    const content = parts.map(p => p.text != null
      ? { type: 'text', text: p.text }
      : { type: 'image_url', image_url: { url: `data:${p.inline_data.mime_type};base64,${p.inline_data.data}` } });
    if (jsonSchema) content.push({ type: 'text', text: 'Respond with ONLY valid minified JSON — no prose, no code fences.' });
    const body = { model: G.model(), messages: [{ role: 'user', content }] };
    if (jsonSchema) body.response_format = { type: 'json_object' };
    const j = await G._fetchRetry(() => fetch(`${G.base()}/chat/completions`,
      { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${G.key()}`, 'HTTP-Referer': location.origin, 'X-Title': 'ShelfLife' }, body: JSON.stringify(body) }));
    const t = j.choices?.[0]?.message?.content;
    if (!t) throw new Error('Empty response');
    return jsonSchema ? JSON.parse(onlyJson(t)) : t;
  },
};

/* ---------------- family cloud sync (Supabase) ----------------
   Local IndexedDB stays the source of truth (works offline). On every
   write we upsert the record to a shared `sync` table keyed by a household
   code; on boot we pull + merge (last-write-wins by updatedAt) and
   subscribe to realtime changes. Nothing here runs until the household
   sets up their own free Supabase project. Keys/cfg stay device-local. */
let supaLoading = null;
function loadSupabase() {
  if (window.supabase) return Promise.resolve();
  if (supaLoading) return supaLoading;
  supaLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'supabase.min.js';
    s.onload = () => res(); s.onerror = () => { supaLoading = null; rej(new Error('sync-load-failed')); };
    document.head.appendChild(s);
  });
  return supaLoading;
}

const SYNC = {
  cli: null, chan: null,
  configured: () => !!(S.cfg.supaUrl && S.cfg.supaKey && S.cfg.householdCode),
  on: () => SYNC.configured() && !!window.supabase,
  code: () => S.cfg.householdCode,
  client() {
    if (!this.cli && S.cfg.supaUrl && S.cfg.supaKey && window.supabase)
      this.cli = window.supabase.createClient(S.cfg.supaUrl, S.cfg.supaKey, { auth: { persistSession: false } });
    return this.cli;
  },
  row(store, id, data) {
    return { household: SYNC.code(), store, id, data,
      updated_at: new Date(data?.updatedAt || Date.now()).toISOString(),
      deleted: !!(data && data.deleted && store === 'catalog') };
  },
  async push(store, id, data) {
    if (!SYNC.on()) return;
    const row = SYNC.row(store, id, data);
    try { const { error } = await SYNC.client().from('sync').upsert(row, { onConflict: 'household,store,id' }); if (error) throw error; }
    catch (e) { SYNC.queue(row); }
  },
  queue(row) {
    const q = S.cfg._syncq || (S.cfg._syncq = []);
    q.push(row); if (q.length > 800) q.splice(0, q.length - 800);
    saveCfg();
  },
  async flush() {
    if (!SYNC.on() || !(S.cfg._syncq || []).length) return;
    const q = S.cfg._syncq; S.cfg._syncq = []; await saveCfg();
    for (const row of q) { try { await SYNC.client().from('sync').upsert(row, { onConflict: 'household,store,id' }); } catch (e) { SYNC.queue(row); } }
  },
  /* apply a remote row locally, last-write-wins. Never calls saveItem/push
     (no echo loop) — writes straight to DB + S. */
  applyRow(r) {
    if (!r || !r.store) return;
    const ts = r.data?.updatedAt || Date.parse(r.updated_at) || 0;
    if (r.store === 'items') {
      const i = S.items.findIndex(x => x.id === r.id);
      if (i > -1 && (S.items[i].updatedAt || 0) >= ts) return;
      DB.put('items', r.data); if (i > -1) S.items[i] = r.data; else S.items.push(r.data);
    } else if (r.store === 'catalog') {
      const i = S.catalog.findIndex(x => x.id === r.id);
      if (r.deleted) { if (i > -1) { S.catalog.splice(i, 1); DB.del('catalog', r.id); } return; }
      if (i > -1 && (S.catalog[i].updatedAt || 0) >= ts) return;
      DB.put('catalog', r.data); if (i > -1) S.catalog[i] = r.data; else S.catalog.push(r.data);
    } else if (r.store === 'shopping') {
      const i = S.shopping.findIndex(x => x.id === r.id);
      if (i > -1 && (S.shopping[i].updatedAt || 0) >= ts) return;
      DB.put('shopping', r.data); if (i > -1) S.shopping[i] = r.data; else S.shopping.push(r.data);
    } else if (r.store === 'meta' && r.id === 'household') {
      if ((S.household?.updatedAt || 0) >= ts) return;
      S.household = r.data; DB.put('meta', r.data);
    }
  },
  async pull() {
    if (!SYNC.on()) return;
    try {
      const { data, error } = await SYNC.client().from('sync').select('*').eq('household', SYNC.code());
      if (error) throw error;
      (data || []).forEach(r => SYNC.applyRow(r));
      render();
    } catch (e) {}
  },
  subscribe() {
    if (!SYNC.on() || SYNC.chan) return;
    try {
      SYNC.chan = SYNC.client()
        .channel('cr-' + SYNC.code())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sync', filter: `household=eq.${SYNC.code()}` },
          p => { if (p.new && p.new.store) { SYNC.applyRow(p.new); render(); } })
        .subscribe();
    } catch (e) {}
  },
  async start() {
    if (!SYNC.configured()) return;
    try { await loadSupabase(); } catch (e) { return; }
    await SYNC.flush(); await SYNC.pull(); SYNC.subscribe();
  },
  /* push everything local up when first joining/creating a household */
  async pushAll() {
    if (!SYNC.on()) return;
    for (const it of S.items) await SYNC.push('items', it.id, it);
    for (const c of S.catalog) await SYNC.push('catalog', c.id, c);
    for (const s of S.shopping) await SYNC.push('shopping', s.id, s);

/* ---------------- push notifications (free, via the family's Edge Function) ----
   Any open app can trigger a family-wide ping (no server cron needed):
   whoever opens ShelfLife and sees something dying notifies the other
   phones. Advanced/optional — needs the notify function deployed once. */
function urlB64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s), arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
const PUSH = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  fnUrl: () => S.cfg.supaUrl ? S.cfg.supaUrl.replace(/\/+$/, '') + '/functions/v1/notify' : '',
  deviceId() { if (!S.cfg.deviceId) { S.cfg.deviceId = uid() + uid(); saveCfg(); } return S.cfg.deviceId; },
  async enable() {
    if (!PUSH.supported()) throw new Error("This device doesn't support web push.");
    if (!SYNC.on()) throw new Error('Turn on Family sync first.');
    if (!S.cfg.vapidPublic) throw new Error('Paste your VAPID public key first.');
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('Notifications were blocked.');
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(S.cfg.vapidPublic) });
    await SYNC.client().from('sync').upsert({ household: SYNC.code(), store: 'push', id: PUSH.deviceId(), data: sub.toJSON(), updated_at: new Date().toISOString(), deleted: false }, { onConflict: 'household,store,id' });
    S.cfg.pushOn = true; await saveCfg();
  },
  async disable() {
    try { const s = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch (e) {}
    try { if (SYNC.on()) await SYNC.client().from('sync').update({ deleted: true }).match({ household: SYNC.code(), store: 'push', id: PUSH.deviceId() }); } catch (e) {}
    S.cfg.pushOn = false; await saveCfg();
  },
  async notifyFamily(title, body, tag) {
    if (!SYNC.on() || !PUSH.fnUrl()) return;
    try {
      await fetch(PUSH.fnUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.cfg.supaKey, apikey: S.cfg.supaKey },
        body: JSON.stringify({ household: SYNC.code(), title, body, tag }) });
    } catch (e) {}
  },
  async dailyCheck() {
    if (!SYNC.on() || !S.cfg.pushOn) return;
    const key = new Date().toISOString().slice(0, 10);
    if (S.cfg.lastNotify === key) return;
    const dying = S.items.filter(i => !i.deleted && freshness(i).left <= 2);
    if (!dying.length) return;
    S.cfg.lastNotify = key; await saveCfg();
    const names = [...new Set(dying.map(i => i.name))].slice(0, 3).join(', ');
    await PUSH.notifyFamily('Eat me first', `${dying.length} item${dying.length > 1 ? 's' : ''} dying: ${names}`, 'expiring');
  },
};

/* THE KEY INSIGHT: this is not open-ended food recognition.
   We hand the model your actual inventory and ask "which of these
   do you see?" — constrained matching, not identification.
   Failure mode becomes "picked the wrong onion", not "hallucinated a mango". */
async function visionMatch(b64, mime, mode) {
  const live = S.items.filter(i => !i.deleted);
  const known = live.map(i => `${i.id}|${i.name}${i.brand ? ' (' + i.brand + ')' : ''}`).join('\n');
  const prompt = mode === 'deplete'
    ? `These are ingredients laid out on a counter, about to be cooked.\n\nMy inventory (id|name):\n${known}\n\nReturn ONLY items you can actually see. Match to inventory ids where possible. If you see something not in my inventory, set id to null and give the name. Estimate visible count.`
    : `Identify the food items in this photo (groceries just brought home).\n\nMy existing inventory, for matching known products:\n${known}\n\nFor anything new, name it plainly ("Roma tomatoes", "Ground beef 1lb") and pick the best category from:\n${CATS.join(', ')}\n\nCount what you see.\n\nIf a printed expiration / "best by" / "use by" / "sell by" date is clearly legible on an item, read it and return it in "expiry" as YYYY-MM-DD. If you can't read a date for an item, omit "expiry" — do NOT guess one.`;
  const schema = { type: 'OBJECT', properties: { found: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    id: { type: 'STRING' }, name: { type: 'STRING' }, cat: { type: 'STRING' }, count: { type: 'INTEGER' }, expiry: { type: 'STRING' }
  }, required: ['name', 'count'] } } }, required: ['found'] };
  const out = await G.gen([{ text: prompt }, { inline_data: { mime_type: mime, data: b64 } }], schema);
  return out.found || [];
}

/* Receipt import — the whole shopping trip in ONE model call, which is the
   most quota-friendly way to bulk-add. Expand the cryptic receipt shorthand
   into readable names and tag a category (which is what auto-sets the
   expiry date downstream — no dates ever get typed or photographed). */
async function visionReceipt(b64, mime) {
  const prompt = `This is a photo of a grocery store receipt. List only the actual food and grocery PRODUCTS purchased.

Expand common receipt abbreviations into clear names (e.g. "KS ORG WHL MLK" -> "Kirkland Organic Whole Milk", "BNLS CHKN BRST" -> "Boneless Chicken Breast", "GRND BF 93/7" -> "Ground Beef 93/7").

IGNORE everything that is not a purchasable food/household product: store name and address, phone, date/time, cashier, member number, subtotal, tax, total, tender, change, cash, card, savings, coupons, discounts, and bag fees.

For each product pick the best category from this list:
${CATS.join(', ')}

Give the quantity if the receipt shows one (else 1). If a printed expiration or "best by" date appears for an item, return it in "expiry" as YYYY-MM-DD; otherwise omit it (do not guess).`;
  const schema = { type: 'OBJECT', properties: { found: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    name: { type: 'STRING' }, cat: { type: 'STRING' }, count: { type: 'INTEGER' }, expiry: { type: 'STRING' }
  }, required: ['name', 'cat'] } } }, required: ['found'] };
  const out = await G.gen([{ text: prompt }, { inline_data: { mime_type: mime, data: b64 } }], schema);
  return out.found || [];
}

/* Upload / change a photo. Downscaled to a small JPEG data-URL so 500 of
   them stay tiny in storage and always show offline. */
function downscaleImage(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      try { res(cv.toDataURL('image/jpeg', 0.82)); } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); rej(new Error('Could not read that image')); };
    img.src = URL.createObjectURL(file);
  });
}

/* The inverse of deplete — "I didn't mean to" and "we got more". Mirrors
   deplete's per-mode maths and brings a fully-gone item back to life. */
async function addOne(it) {
  const before = JSON.parse(JSON.stringify(it));
  if (it.mode === 'level') {
    it.level = Math.min(4, (it.level || 0) + 1);
  } else if (it.mode === 'pack') {
    it.unitsLeft = (it.unitsLeft ?? 0) + 1;
    if (it.packSize && it.unitsLeft > it.packSize) { it.qty = (it.qty || 0) + 1; it.unitsLeft = 1; }
    else if (!it.qty || it.qty < 1) it.qty = 1;
  } else {
    it.qty = (it.qty || 0) + 1;
  }
  it.deleted = false; it.wasted = false;
  await saveItem(it);
  await logAction('added one', it.name);
  toast(`${it.name} — one more`, async () => { await saveItem(before); });

/* ---------------- view: inventory ---------------- */
const norm = s => String(s).toLowerCase().trim();

/* Restock hints, learned rather than assumed.
   The pantries hold DIFFERENT food — downstairs is not overflow of
   upstairs. So "you have it there, go get it" is only true for things
   that have genuinely lived on both shelves before. We keep depleted
   items forever, so that history is already here. Silent until it has
   evidence, which is the right cold-start behaviour. */
function restockHints(locId) {
  const live = S.items.filter(i => !i.deleted);
  const hereNow  = new Set(live.filter(i => i.loc === locId).map(i => norm(i.name)));
  const everHere = new Set(S.items.filter(i => i.loc === locId).map(i => norm(i.name)));
  const out = [], seen = new Set();
  for (const i of live) {
    const n = norm(i.name);
    if (i.loc === locId || hereNow.has(n) || seen.has(n)) continue;
    if (!everHere.has(n)) continue;   // never lived here — that's just different food
    seen.add(n); out.push(i);
  }
  return out;
}

const CAT_LABEL = c => c.replace(/-/g, ' ');

function viewInv(app) {
  const live = S.items.filter(i => !i.deleted);

  const chips = el(`<div class="chips"></div>`);
  const mk = (id, label) => {
    const b = el(`<button class="chip" aria-pressed="${S.loc === id}">${esc(label)}</button>`);
    b.onclick = () => { S.loc = id; S.q = ''; render(); };
    return b;
  };
  chips.appendChild(mk('all', `All (${live.length})`));
  S.household.locations.forEach(l =>
    chips.appendChild(mk(l.id, `${l.name} (${live.filter(i => i.loc === l.id).length})`)));
  app.appendChild(chips);

  /* At 500 items search isn't a nicety, it's the primary way in. */
  const sb = el(`<input id="q" placeholder="Search ${live.length} items…" value="${esc(S.q || '')}"
    style="margin-bottom:12px" autocomplete="off" enterkeyhint="search">`);
  sb.oninput = e => {
    S.q = e.target.value;
    const box = document.getElementById('results');
    if (box) paintList(box);
  };
  app.appendChild(sb);

  const box = el(`<div id="results"></div>`);
  app.appendChild(box);
  paintList(box);
  if (S.q || S.focusSearch) { sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
  S.focusSearch = false;
}

function paintList(box) {
  box.innerHTML = '';
  let live = S.items.filter(i => !i.deleted);
  if (S.loc !== 'all') live = live.filter(i => i.loc === S.loc);

  /* searching: flat, ranked, capped */
  if (S.q?.trim()) {
    const q = norm(S.q);
    const hits = live.filter(i => norm(i.name).includes(q) || norm(i.brand || '').includes(q))
                     .sort((a, b) => a.expires - b.expires);
    if (!hits.length) return box.appendChild(el(`<div class="empty">
      <div class="big">No match for "${esc(S.q)}"</div>
      <div class="sub">If it's really in the house and not in here, the inventory has drifted. Scan it in.</div></div>`));
    hits.slice(0, 60).forEach(i => box.appendChild(itemRow(i)));
    if (hits.length > 60) box.appendChild(el(`<div class="note" style="text-align:center;padding:10px">
      +${hits.length - 60} more — keep typing</div>`));
    return;
  }

  if (!live.length) return box.appendChild(el(`<div class="empty">
    <div class="big">Nothing on this shelf</div>
    <div class="sub">Scan tab → photograph the whole shelf at once. That's how you fill 500 slots without losing a weekend.</div></div>`));

  if (S.loc !== 'all') {
    const hints = restockHints(S.loc);
    if (hints.length) {
      const names = [...new Set(hints.map(i => i.name))].slice(0, 3);
      box.appendChild(el(`<div class="card" style="border-color:var(--rime-hi)">
        <div class="eyebrow" style="margin-bottom:5px">Usually lives here — currently elsewhere</div>
        <div class="note">${esc(names.join(' · '))}${hints.length > 3 ? ` +${hints.length - 3}` : ''}</div></div>`));
    }
  }

  /* Grouped, collapsed, and built only when opened. 500 rows of DOM
     rendered eagerly on every tap is what makes an app feel like mud. */
  const groups = {};
  const key = i => S.loc === 'all' ? i.loc : i.cat;
  live.forEach(i => (groups[key(i)] ||= []).push(i));
  const label = k => S.loc === 'all' ? locName(k) : CAT_LABEL(k);
  const openAll = live.length <= 25;
  const gkey = k => S.loc + ':' + k;

  Object.entries(groups)
    .sort((a, b) => Math.min(...a[1].map(i => i.expires)) - Math.min(...b[1].map(i => i.expires)))
    .forEach(([k, list]) => {
      list.sort((a, b) => a.expires - b.expires);
      const worst = freshness(list[0]);
      const urgent = list.filter(i => freshness(i).left <= 3).length;
      const d = el(`<details ${openAll || S.open.has(gkey(k)) ? 'open' : ''} style="margin-bottom:6px">
        <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
          padding:11px 12px;background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r)">
          <span style="width:4px;height:17px;border-radius:2px;background:${urgent ? worst.rail : 'var(--rime-hi)'}"></span>
          <span class="code" style="font-size:12px;flex:1">${esc(label(k))}</span>
          ${urgent ? `<span class="code" style="font-size:10px;color:${worst.rail}">${urgent} DYING</span>` : ''}
          <span class="code" style="font-size:11px;color:var(--vapor-dim)">${list.length}</span>
        </summary>
        <div class="grp" style="padding-top:6px"></div></details>`);
      const body = d.querySelector('.grp');
      const build = () => { if (d.dataset.built) return; list.forEach(i => body.appendChild(itemRow(i))); d.dataset.built = '1'; };
      d.addEventListener('toggle', () => {
        d.open ? S.open.add(gkey(k)) : S.open.delete(gkey(k));
        if (d.open) build();
      });
      if (d.open) build();
      box.appendChild(d);
    });
}

/* ---------------- view: expiring ---------------- */
/* ---------------- voice: trash / eat / add ----------------
   The hardest habit is REMOVING food as you eat it. A mic button lets
   anyone say "finished the milk" walking past the fridge. Free (Web
   Speech API). Graceful when unsupported (older iOS just won't show it). */
const cleanWords = s => String(s || '').toLowerCase().replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
const VOICE_STOP = new Set('threw throw thrown toss tossed tossing chuck chucked binned bin spoiled rotten rotted moldy mould expired trash bad old gross nasty away out the a an some our my your we i of is are was were all gone empty no more used up finished finish ate eaten eat eating using use drank drink drinking add need needs buy get got to on shopping list please can you just it that this and'.split(' '));
function parseVoice(text) {
  const raw = cleanWords(text);
  if (!raw) return null;
  const toss = /\b(threw|throw|thrown|toss|tossed|chucked?|binned|spoiled|rotten|rotted|moldy|mould|expired|trash)\b/.test(raw);
  const eat = /\b(finished|finish|ate|eaten|eat|used|drank|drink|gone|empty|no more|out of|used up)\b/.test(raw);
  const list = /\b(add|need|needs|buy|get|got)\b/.test(raw) && /\b(list|shopping|store)\b/.test(raw);
  const name = raw.split(' ').filter(w => w && !VOICE_STOP.has(w)).join(' ').trim();
  if (!name) return null;
  if (list) return { action: 'list', name };
  if (toss) return { action: 'toss', name };
  if (eat) return { action: 'eat', name };
  return null;   // no clear verb — don't guess a destructive action
}
async function handleVoice(text) {
  const p = parseVoice(text);
  if (!p) return toast(`Didn't catch that — try "finished the milk" or "add eggs to the list"`);
  if (p.action === 'list') { await addToList(p.name.replace(/\b\w/, c => c.toUpperCase())); render(); return; }
  const q = p.name;
  const hits = S.items.filter(i => !i.deleted && (norm(i.name).includes(q) || q.includes(norm(i.name))));
  if (!hits.length) return toast(`No "${p.name}" in the house`);
  const it = hits.sort((a, b) => a.expires - b.expires)[0];
  if (p.action === 'toss') await tossItem(it); else await deplete(it, 'voice');
  render();
}
function voiceButton() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const idle = '🎤 Say "finished the milk"';
  const b = el(`<button class="btn ghost" style="margin-bottom:12px">${idle}</button>`);
  b.onclick = () => {
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    b.textContent = '🎤 Listening…'; b.disabled = true;
    rec.onresult = e => { b.disabled = false; b.textContent = idle; handleVoice(e.results[0][0].transcript); };
    rec.onerror = () => { b.disabled = false; b.textContent = '🎤 mic blocked — tap to retry'; };
    rec.onend = () => { b.disabled = false; if (b.textContent === '🎤 Listening…') b.textContent = idle; };
    try { rec.start(); } catch (e) { b.disabled = false; }
  };
  return b;
}

function viewSoon(app) {
  const vb = voiceButton();
  if (vb) app.appendChild(vb);
  const live = S.items.filter(i => !i.deleted);
  const soon = live.filter(i => freshness(i).left <= 7).sort((a, b) => a.expires - b.expires);
  const wasted = S.items.filter(i => i.wasted);

  /* Food scorecard — the family motivator. Rescued = eaten/used before it
     went bad; wasted = logged as thrown out; streak = days since the last
     waste. All computed from the log we already keep. */
  const rescued = S.items.filter(i => i.deleted && !i.wasted).length;
  const wastedN = wasted.length;
  const rescuedPct = (rescued + wastedN) ? Math.round(rescued / (rescued + wastedN) * 100) : null;
  const lastWaste = wasted.reduce((m, i) => Math.max(m, i.wastedAt || 0), 0);
  const streak = lastWaste ? Math.floor((Date.now() - lastWaste) / DAY) : null;
  if (rescued + wastedN > 0) {
    app.appendChild(el(`<div class="card">
      <div class="eyebrow" style="margin-bottom:10px">Food scorecard</div>
      <div style="display:flex;text-align:center">
        <div style="flex:1"><div class="code" style="font-size:23px;color:var(--fresh)">${rescued}</div><div class="tag">RESCUED</div></div>
        <div style="flex:1"><div class="code" style="font-size:23px;color:var(--spoil)">${wastedN}</div><div class="tag">WASTED</div></div>
        <div style="flex:1"><div class="code" style="font-size:23px">${streak !== null ? '🔥' + streak : '✨'}</div><div class="tag">${streak !== null ? 'DAY STREAK' : 'ZERO WASTE'}</div></div>
      </div>
      ${rescuedPct !== null ? `<div class="note" style="text-align:center;margin-top:11px">You've eaten <b>${rescuedPct}%</b> of what came in before it went bad.</div>` : ''}
    </div>`));
  }

  if (!soon.length) {
    app.appendChild(el(`<div class="empty"><div class="big">Nothing dying</div>
      <div class="sub">Everything in the house has more than a week. Enjoy it.</div></div>`));
  } else {
    const dead = soon.filter(i => freshness(i).left < 0);
    if (dead.length) app.appendChild(el(`<div class="card" style="border-color:var(--spoil)">
      <div class="eyebrow" style="color:var(--spoil);margin-bottom:5px">Past date</div>
      <div class="note">${dead.length} item${dead.length > 1 ? 's' : ''}. Check them — the date is a guess, your nose isn't. Tap <b>⋯ → Threw it out</b> so the waste log learns.</div></div>`));
    app.appendChild(el(`<h2 style="margin:14px 0 8px">Eat me first</h2>`));
    soon.forEach(i => app.appendChild(itemRow(i)));
  }

  if (wasted.length) {
    const counts = {};
    wasted.forEach(i => counts[i.name] = (counts[i.name] || 0) + 1);
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    app.appendChild(el(`<h2 style="margin:26px 0 8px">Waste log · ${wasted.length} total</h2>`));
    app.appendChild(el(`<div class="card"><div class="note">${top.map(([n, c]) =>
      `${esc(n)} <span class="code" style="color:${c > 2 ? 'var(--spoil)' : 'var(--vapor-dim)'}">×${c}</span>`).join('<br>')}
      ${top.some(t => t[1] > 2) ? `<div class="warn" style="margin-top:12px">You keep buying things you don't eat. Buy half as much of the ×3s.</div>` : ''}
      </div></div>`));
  }
}

/* Auto-deduct on cook — but confirm first, because the recipe is
   theory and your counter is reality. You grabbed 3 peppers, not 2. */
function cookDeduct(r) {
  const live = S.items.filter(i => !i.deleted);

/* ---------------- view: scan ---------------- */
let stream = null, scanLoop = null, detector = null, zxingReader = null, zxingLoading = null;
let lastScan = { code: '', t: 0 };
let rapidLog = [];          // session-only: items added during the current rapid run
let audioCtx = null;

/* WebAudio, created inside the tab-tap gesture so iOS lets it make sound.
   No asset to load — the beep is synthesised, so it works offline too. */
function initAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(ok = true) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = ok ? 880 : 240;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.13);
  } catch (e) {}
}

/* Scan confirmation. iOS Safari has no Vibration API, so on iPhone the
   green reticle flash and the beep ARE the feedback — without them a scan
   on an iPhone is completely silent. Vibration still fires on Android. */
function scanFeedback(ok = true) {
  navigator.vibrate?.(ok ? 40 : [50, 40, 50]);
  beep(ok);
  const r = document.querySelector('.reticle');
  if (r) { r.classList.add(ok ? 'hit' : 'miss'); setTimeout(() => r.classList.remove('hit', 'miss'), 360); }
}

/* Torch/flashlight for dim shelves (the downstairs freezer). Only some
   cameras expose it — Android Chrome yes, iOS Safari doesn't support the
   web torch constraint — so the button stays hidden unless the live track
   reports the capability. Degrades to nothing where it's absent. */
function setupTorch() {
  const btn = document.getElementById('torch');
  const track = stream?.getVideoTracks?.()[0];
  if (!btn || !track) return;
  const caps = track.getCapabilities?.();
  if (!caps || !caps.torch) return;
  btn.classList.remove('hide');
  let on = false;
  btn.onclick = async () => {
    try { await track.applyConstraints({ advanced: [{ torch: !on }] }); on = !on; btn.setAttribute('aria-pressed', on); }
    catch (e) { toast('Flashlight not available on this camera'); }
  };
}

async function stopCam() {
  cancelAnimationFrame(scanLoop);
  try { zxingReader?.reset(); } catch (e) {}   // stops ZXing's decode loop + releases its camera
  zxingReader = null;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
}

/* ZXing is only needed where there's no native BarcodeDetector — iOS
   Safari, essentially. It's vendored (not a CDN) and pre-cached by the
   service worker, so barcode scanning still works in the basement with
   no signal. Loaded lazily: Android/desktop never pull the 330KB they
   don't need, but the service worker has it cached the moment they do. */
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingLoading) return zxingLoading;
  zxingLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'zxing.min.js';
    s.onload = () => res();
    s.onerror = () => { zxingLoading = null; rej(new Error('load-failed')); };
    document.head.appendChild(s);
  });
  return zxingLoading;
}

function viewScan(app) {
  const mode = S.cfg.scanMode || 'in';
  const rapid = mode === 'in' && !!S.cfg.rapid;
  const rapidLoc = S.cfg.rapidLoc || defaultLoc('other');

    </div>
    ${mode === 'in' ? `<div class="chips" style="padding-bottom:8px">
      <button class="chip" data-a="rapid" aria-pressed="${rapid}">⚡ Rapid add</button>
      ${rapid ? `<select id="rloc" style="width:auto;flex:1;min-width:0;font-size:11px;padding:7px 10px">${S.household.locations.map(l =>
        `<option value="${l.id}" ${l.id === rapidLoc ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>` : ''}
    </div>` : ''}
    <div id="scanwrap"><video id="video" playsinline muted></video><div class="reticle"></div>
      <button id="torch" class="torchbtn hide" aria-label="Toggle flashlight" aria-pressed="false">🔦</button></div>
    <div class="note" id="hint" style="text-align:center;margin-bottom:14px"></div>
