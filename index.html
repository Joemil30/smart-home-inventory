/* ---------------- meal planner ---------------- */
function viewPlan(app) {
  app.appendChild(el(`<p class="note" style="margin:0 0 14px">Plan the week, then send everything you're missing to the shopping list in one tap.</p>`));

  const planned = S.plan.filter(m => !m.deleted);
  const weekMissing = [...new Set(planned.flatMap(m => m.missing || []))].filter(x => !itemInStock(x));
  if (weekMissing.length) {
    const b = el(`<button class="btn cold" style="margin-bottom:14px">🛒 Add this week's ${weekMissing.length} missing ingredient${weekMissing.length > 1 ? 's' : ''} to the list</button>`);
    b.onclick = async () => { for (const m of weekMissing) await addToList(m); toast(`Added ${weekMissing.length} to your list`); render(); };
    app.appendChild(b);
  }

  const start = today();
  for (let i = 0; i < 7; i++) {
    const d = new Date(start + i * DAY);
    const key = dayKey(d);
    const meals = planned.filter(m => m.date === key);
    const card = el(`<div class="day ${i === 0 ? 'today' : ''}">
      <div class="dh"><div class="dw">${d.toLocaleDateString(undefined, { weekday: 'long' })}<small>${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</small></div>${i === 0 ? '<span class="badge">Today</span>' : ''}</div>
      <div class="meals"></div>
      <button class="addmeal">＋ Add a meal</button></div>`);
    const mbox = card.querySelector('.meals');
    if (meals.length) {
      const g = el(`<div class="tiles one" style="margin-bottom:4px"></div>`);
      meals.forEach(m => {
        const known = catalogMeal(m.name);
        const img = m.image || known?.image || null;
        g.appendChild(tileEl({
          name: m.name,
          meta: (known?.count ? `Made ${known.count}×` : 'First time') +
                ((m.missing || []).length ? ` · ${m.missing.length} to shop` : ''),
          image: img, emoji: m.emoji || foodEmoji(m.name, '') || '🍽️',
          checked: !!m.made,
          checkLabel: m.made ? 'Made it' : 'I made this',
          onCheck: async () => {
            m.made = !m.made; await savePlan(m);
            // Untoggling clears the flag but leaves the history alone — you
            // did cook it, and un-cooking it isn't a thing.
            if (m.made) await recordCatalog({ name: m.name, kind: CAT_MEAL, image: img, emoji: m.emoji }, {});
            render();
          },
          onTap: () => pickPhoto(known || { id: catId(m.name, null, CAT_MEAL), name: m.name, kind: CAT_MEAL },
            async url => { m.image = url; await savePlan(m); render(); }),
          onCorner: async () => { await removePlan(m.id); render(); },
        }));
      });
      mbox.appendChild(g);
    }
    else mbox.appendChild(el(`<div class="note" style="padding:2px 0 4px;color:var(--vapor-dim)">Nothing planned</div>`));
    card.querySelector('.addmeal').onclick = () => addMealDialog(key);
    app.appendChild(card);
  }
}

/* Planning a week is mostly re-cooking things you already cook. Leading with
   your own history — as photos, not a blank text box — is the difference
   between "what should we eat" and "oh right, that one". */
function addMealDialog(dateKey) {
  const dlg = document.getElementById('dlg');
  const hist = catalogList(CAT_MEAL).slice(0, 6);
  const picks = (recipeCache || []).slice(0, 6);
  dlg.innerHTML = `<div class="eyebrow">Add a meal</div><h1 style="margin:6px 0 14px">${new Date(dateKey + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}</h1>
    <label><span class="lbl">Meal</span><input id="mealnm" placeholder="Taco night, Leftovers, Salmon…" autocomplete="off"></label>
    <button class="btn cold" data-a="save">Add to plan</button>
    ${hist.length ? `<div class="sect"><h3>You've made these</h3><span class="n">tap to plan</span></div><div id="mh"></div>
      <button class="btn ghost" data-a="all" style="margin-top:2px">Search all your meals</button>` : ''}
    ${picks.length ? `<div class="sect"><h3>Suggested for what you have</h3></div><div style="margin-bottom:6px">${picks.map((r, i) => `<button class="chip" data-p="${i}" aria-pressed="false" style="margin:0 6px 8px 0">${esc(r.name)}</button>`).join('')}</div>` : ''}
    <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
  const input = dlg.querySelector('#mealnm');
  const plan = async (name, extra = {}) => {
    await planMeal(dateKey, { name, emoji: extra.emoji || foodEmoji(name, '') || '🍽️', ...extra });
    dlg.close(); render();
    toast(`${name} planned${(extra.missing || []).length ? ` · ${extra.missing.length} to shop` : ''}`);
  };

  const mh = dlg.querySelector('#mh');
  if (mh) {
    const g = el(`<div class="tiles"></div>`);
    hist.forEach(c => g.appendChild(tileEl({
      name: c.name, meta: `${c.count || 0}× made`,
      image: c.image, emoji: foodEmoji(c.name, '') || '🍽️',
      checkLabel: 'Plan it', onCheck: () => plan(c.name, { image: c.image }),
      onCorner: () => pickPhoto(c, () => addMealDialog(dateKey)), cornerIcon: '📷', cornerLabel: 'Set a photo for',
    })));
    mh.appendChild(g);
    // One day gets one meal, so this picker closes on the pick.
    dlg.querySelector('[data-a=all]').onclick = () =>
      catalogPicker({ kind: CAT_MEAL, multi: false, onPick: c => plan(c.name, { image: c.image }) });
  }
  dlg.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const r = picks[+b.dataset.p];
    plan(r.name, { uses: r.uses || [], missing: r.missing || [], image: r.image || null });
  });
  dlg.querySelector('[data-a=save]').onclick = () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    plan(name);
  };
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  dlg.showModal();
}

        <button class="btn ghost sm" data-a="plan">📅 Plan</button>

      <div class="eyebrow">${r.minutes} min</div><h1 style="margin:6px 0 6px">${esc(r.name)}</h1>

    ${days.map((d, i) => `<button class="btn ghost" data-d="${dayKey(d)}" style="margin-bottom:8px;text-align:left">${i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'long' })} · ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</button>`).join('')}
    <button class="btn ghost" data-a="c" style="margin-top:4px;border:none;color:var(--vapor)">Cancel</button>`;
  dlg.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    await planMeal(b.dataset.d, { name: r.name, emoji: foodEmoji(r.name, '') || '🍽️', uses: r.uses || [], missing: r.missing || [] });
    dlg.close(); toast(`${r.name} planned${(r.missing || []).length ? ` · ${r.missing.length} to shop` : ''}`);
  });
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();

}
function viewCook(app) {
  const live = S.items.filter(i => !i.deleted);
  const tab = S.cookTab || 'suggested';
  const savedN = S.saved.filter(s => !s.deleted).length;

  const seg = el(`<div class="chips" style="padding-bottom:14px">
    <button class="chip" data-t="suggested" aria-pressed="${tab === 'suggested'}">Suggested</button>
    <button class="chip" data-t="saved" aria-pressed="${tab === 'saved'}">★ Saved${savedN ? ` (${savedN})` : ''}</button>
  </div>`);
  seg.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.cookTab = b.dataset.t; render(); });
  app.appendChild(seg);

  if (tab === 'saved') {
    const saved = S.saved.filter(s => !s.deleted).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (!saved.length) {
      app.appendChild(el(`<div class="empty"><div class="big">No saved recipes yet</div>
        <div class="sub">Tap <b>☆ Save</b> on any suggestion to keep it here — with its photo, steps and ingredients. Each one re-checks your pantry before you cook.</div></div>`));
      return;
    }
    saved.forEach(s => app.appendChild(recipeCardEl(recomputeMissing(s))));
    return;
  }

  const btn = el(`<button class="btn cold" style="margin-bottom:16px">${recipeCache ? '↻ Suggest again' : '✨ Cook with what I have'}</button>`);
  const out = el(`<div></div>`);
  btn.onclick = async () => {
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Reading your shelves…`;
    try {
      recipeCache = await suggestRecipes();
      renderRecipes(out);
    } catch (e) {
      out.innerHTML = `<div class="card"><div class="warn">${esc(e.message)}</div></div>`;
    }
    btn.disabled = false; btn.textContent = '↻ Suggest again';
  };
  app.appendChild(btn);
  if (!live.length) app.appendChild(el(`<div class="card"><div class="note">Nothing in the inventory yet — there's nothing to cook with. Scan something in first.</div></div>`));
  else if (!recipeCache) app.appendChild(el(`<div class="note" style="margin:-4px 0 16px">Ranked so the ones you can make right now — using what's about to expire — come first.</div>`));
  app.appendChild(out);
  if (recipeCache) renderRecipes(out);
}

function renderRecipes(out) {
  out.innerHTML = '';
  if (!recipeCache?.length) return;
  [...recipeCache].sort((a, b) => a.missing.length - b.missing.length).forEach(r => out.appendChild(recipeCardEl(r)));
}

/* Auto-deduct on cook — but confirm first, because the recipe is
   theory and your counter is reality. You grabbed 3 peppers, not 2. */
function cookDeduct(r) {
  const live = S.items.filter(i => !i.deleted);
  const hits = live.filter(i => r.uses.some(u => {
    const a = u.toLowerCase(), b = i.name.toLowerCase();
    return a.includes(b) || b.includes(a);
  }));
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<div class="eyebrow">Made it</div><h1 style="margin:6px 0 6px">${esc(r.name)}</h1>
    <p class="note" style="margin:0 0 14px">Untick anything you didn't actually use up.</p>
    ${hits.map(i => `<label style="display:flex;gap:10px;align-items:center;margin-bottom:9px;font-family:var(--mono);font-size:13px">
      <input type="checkbox" checked data-id="${i.id}" style="width:19px;height:19px;flex:0 0 auto">${esc(i.name)}</label>`).join('') ||
      `<div class="note" style="margin-bottom:14px">Couldn't match anything to your inventory — nothing will change.</div>`}
    <button class="btn cold" data-a="go">Deduct these</button>
    <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
  dlg.querySelector('[data-a=go]').onclick = async () => {
    const ids = [...dlg.querySelectorAll('input:checked')].map(c => c.dataset.id);
    const undos = [];
    for (const id of ids) undos.push(await deplete(S.items.find(i => i.id === id), 'cooked'));
    // "I made this" is the only honest signal that a meal is really part of
    // the rotation — it's what makes Plan's history worth offering back.
    await recordCatalog({ name: r.name, kind: CAT_MEAL, image: r.image || null,
      emoji: foodEmoji(r.name, '') || '🍽️', uses: undefined }, {});
    dlg.close(); render();
    toast(`${r.name} — ${ids.length} deducted`, async () => { for (const u of undos) await u(); });
  };
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  dlg.showModal();
}

/* ---------------- view: scan ---------------- */
let stream = null, scanLoop = null, detector = null, zxingReader = null, zxingLoading = null;
let lastScan = { code: '', t: 0 };
let rapidLog = [];          // session-only: items added during the current rapid run
let audioCtx = null;

/* WebAudio, created inside the tab-tap gesture so iOS lets it make sound.
   No asset to load — the beep is synthesised, so it works offline too. */
function initAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(ok = true) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = ok ? 880 : 240;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.13);
  } catch (e) {}
}

/* Scan confirmation. iOS Safari has no Vibration API, so on iPhone the
   green reticle flash and the beep ARE the feedback — without them a scan
   on an iPhone is completely silent. Vibration still fires on Android. */
function scanFeedback(ok = true) {
  navigator.vibrate?.(ok ? 40 : [50, 40, 50]);
  beep(ok);
  const r = document.querySelector('.reticle');
  if (r) { r.classList.add(ok ? 'hit' : 'miss'); setTimeout(() => r.classList.remove('hit', 'miss'), 360); }
}

/* Torch/flashlight for dim shelves (the downstairs freezer). Only some
   cameras expose it — Android Chrome yes, iOS Safari doesn't support the
   web torch constraint — so the button stays hidden unless the live track
   reports the capability. Degrades to nothing where it's absent. */
function setupTorch() {
  const btn = document.getElementById('torch');
  const track = stream?.getVideoTracks?.()[0];
  if (!btn || !track) return;
  const caps = track.getCapabilities?.();
  if (!caps || !caps.torch) return;
  btn.classList.remove('hide');
  let on = false;
  btn.onclick = async () => {
    try { await track.applyConstraints({ advanced: [{ torch: !on }] }); on = !on; btn.setAttribute('aria-pressed', on); }
    catch (e) { toast('Flashlight not available on this camera'); }
  };
}

async function stopCam() {
  cancelAnimationFrame(scanLoop);
  try { zxingReader?.reset(); } catch (e) {}   // stops ZXing's decode loop + releases its camera
  zxingReader = null;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
}

/* ZXing is only needed where there's no native BarcodeDetector — iOS
   Safari, essentially. It's vendored (not a CDN) and pre-cached by the
   service worker, so barcode scanning still works in the basement with
   no signal. Loaded lazily: Android/desktop never pull the 330KB they
   don't need, but the service worker has it cached the moment they do. */
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingLoading) return zxingLoading;
  zxingLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'zxing.min.js';
    s.onload = () => res();
    s.onerror = () => { zxingLoading = null; rej(new Error('load-failed')); };
    document.head.appendChild(s);
  });
  return zxingLoading;
}

function viewScan(app) {
  const mode = S.cfg.scanMode || 'in';
  const rapid = mode === 'in' && !!S.cfg.rapid;
  const rapidLoc = S.cfg.rapidLoc || defaultLoc('other');
  const wrap = el(`<div>
    <div class="chips">
      <button class="chip" data-m="in" aria-pressed="${mode === 'in'}">Putting away</button>
      <button class="chip" data-m="out" aria-pressed="${mode === 'out'}">Trash / used up</button>
    </div>
    ${mode === 'in' ? `<div class="chips" style="padding-bottom:8px">
      <button class="chip" data-a="rapid" aria-pressed="${rapid}">⚡ Rapid add</button>
      ${rapid ? `<select id="rloc" style="width:auto;flex:1;min-width:0;font-size:11px;padding:7px 10px">${S.household.locations.map(l =>
        `<option value="${l.id}" ${l.id === rapidLoc ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>` : ''}
    </div>` : ''}
    <div id="scanwrap"><video id="video" playsinline muted></video><div class="reticle"></div>
      <button id="torch" class="torchbtn hide" aria-label="Toggle flashlight" aria-pressed="false">🔦</button></div>
    <div class="note" id="hint" style="text-align:center;margin-bottom:14px"></div>
    <div id="rapidlist"></div>
    <button class="btn cold" data-a="photo">📷 Shoot a whole shelf</button>
    <button class="btn ghost" data-a="receipt" style="margin-top:8px">🧾 Scan a receipt</button>
    <button class="btn ghost" data-a="manual" style="margin-top:8px">Type one in</button>
    <input type="file" accept="image/*" capture="environment" id="pick" class="hide">
    <input type="file" accept="image/*" id="rcpt" class="hide">
  </div>`);
  app.appendChild(wrap);

  wrap.querySelector('#hint').innerHTML = mode === 'in'
    ? (rapid
        ? `<b style="color:var(--cold)">Rapid on.</b> Scan → beep → it's on <b>${esc(locName(rapidLoc))}</b>. Unknown codes still ask once.`
        : `Barcode for packaged. <b>Photo for everything else</b> — one shot takes a whole shelf.`)
    : `<b style="color:var(--thaw)">Scan the empty wrapper as you bin it.</b> Same gesture, opposite direction.`;

  wrap.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.cfg.scanMode = b.dataset.m; saveCfg(); render(); });
  const rq = wrap.querySelector('[data-a=rapid]');
  if (rq) rq.onclick = () => { S.cfg.rapid = !S.cfg.rapid; saveCfg(); render(); };
  const rl = wrap.querySelector('#rloc');
  if (rl) rl.onchange = e => { S.cfg.rapidLoc = e.target.value; saveCfg(); render(); };
  wrap.querySelector('[data-a=manual]').onclick = () => manualSheet();
  wrap.querySelector('#pick').onchange = e => e.target.files[0] && photoFlow(e.target.files[0]);
  wrap.querySelector('[data-a=photo]').onclick = () => wrap.querySelector('#pick').click();
  wrap.querySelector('#rcpt').onchange = e => e.target.files[0] && receiptFlow(e.target.files[0]);
  wrap.querySelector('[data-a=receipt]').onclick = () => wrap.querySelector('#rcpt').click();

  paintRapidList(wrap.querySelector('#rapidlist'));
  initAudio();
  startCam(wrap.querySelector('#video'), mode);
}

/* The running tally of a rapid run — so a 20-item Costco bag reads as one
   list you can eyeball, not 20 dialogs you had to babysit. Session-only. */
function paintRapidList(box) {
  if (!box) return;
  box.innerHTML = '';
  if (!rapidLog.length) return;
  const card = el(`<div class="card" style="margin-bottom:14px">
    <div class="eyebrow" style="margin-bottom:8px">Added this run · ${rapidLog.length}</div>
    <div id="rl-items"></div>
    <button class="btn ghost" data-a="done" style="margin-top:8px">Done — clear list</button></div>`);
  const list = card.querySelector('#rl-items');
  rapidLog.slice(0, 12).forEach(r => {
    const row = el(`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-family:var(--mono);font-size:12px">
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>
      <span class="code" style="color:var(--vapor-dim);font-size:10px">${esc(locName(r.loc))}</span>
      <button data-x="${r.id}" aria-label="Remove ${esc(r.name)}" style="width:30px;height:30px;flex:0 0 auto;border:1px solid var(--rime-hi);border-radius:7px;color:var(--vapor)">×</button></div>`);
    row.querySelector('[data-x]').onclick = async () => {
      const cur = S.items.find(x => x.id === r.id);
      if (cur) { cur.deleted = true; await saveItem(cur); }
      rapidLog = rapidLog.filter(x => x.id !== r.id);
      paintRapidList(box);
      toast(`${r.name} removed`);
    };
    list.appendChild(row);
  });
  if (rapidLog.length > 12) list.appendChild(el(`<div class="note" style="padding-top:6px">+${rapidLog.length - 12} more</div>`));
  card.querySelector('[data-a=done]').onclick = () => { rapidLog = []; render(); };
  box.appendChild(card);
}

async function startCam(video, mode) {
  await stopCam();                                  // never leave a prior camera session running
  if ('BarcodeDetector' in window) return startNative(video, mode);
  return startZXing(video, mode);                   // iOS Safari and anything else without it
}

async function startNative(video, mode) {
  try {
    detector = detector || new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream; await video.play();
    setupTorch();
    let last = 0, busy = false;
    const tick = async () => {
      if (!stream) return;
      if (!busy && Date.now() - last > 1100) {
        busy = true;
        try {
          const codes = await detector.detect(video);
          if (codes[0]) { last = Date.now(); await onCode(codes[0].rawValue, mode); }
        } catch (e) {}
        busy = false;
      }
      scanLoop = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { camError(); }
}

/* iOS Safari ships no BarcodeDetector, so on iPhone we drive the camera
   through ZXing instead. Same reticle, same onCode handler downstream —
   only the decoder differs. ZXing owns the stream via decodeFromConstraints;
   we grab a reference so stopCam() and the overlay behave identically. */
async function startZXing(video, mode) {
  try { await loadZXing(); }
  catch (e) {
    const h = document.getElementById('hint');
    if (h) h.innerHTML = `<div class="warn" style="text-align:left">Couldn't load the scanner. If this is the first time on this phone, open the app once <b>with signal</b> so it caches itself — then it scans offline. <b>Photo</b> and <b>Type it in</b> work either way.</div>`;
    return;
  }
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128,
    ]);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    await zxingReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, (result) => {
      if (result) onCode(result.getText(), mode);
    });
    stream = video.srcObject;
    setupTorch();
  } catch (e) { camError(); }
}

function camError() {
  const h = document.getElementById('hint');
  if (h) h.innerHTML =
    `<div class="warn" style="text-align:left">No camera access. It needs HTTPS, and on iPhone you have to tap <b>Allow</b> when Safari asks. You can still use <b>Photo</b> or <b>Type it in</b>.</div>`;
}

async function onCode(code, mode) {
  const dlg = document.getElementById('dlg');
  const now = Date.now();
  if (dlg.open) return;                                            // a sheet is already up — ignore stray reads
  if (code === lastScan.code && now - lastScan.t < 2500) return;   // same barcode, moments apart (ZXing fires per-frame)
  lastScan = { code, t: now };
  if (mode === 'out') {
    const it = S.items.find(i => !i.deleted && i.barcode === code);
    if (!it) { scanFeedback(false); return toast(`Scanned ${code} — not in your inventory`); }
    scanFeedback(true);
    await deplete(it, 'binned');
    return;
  }
  const p = await lookupBarcode(code);
  scanFeedback(true);   // a code was read; known or not, the scan itself worked
  // Rapid: a known product goes straight onto the chosen shelf — no dialog,
  // just the beep and a line in the running list. Unknown codes still must
  // be identified once, so they fall through to the ask-once sheet.
  if (S.cfg.rapid && p) {
    const loc = S.cfg.rapidLoc || defaultLoc(p.cat);
    const packSize = S.catalog.find(c => c.id === code)?.packSize || p.packSize || null;
    const it = await addItem({ name: p.name, brand: p.brand, cat: p.cat, loc, qty: 1, barcode: code, packSize, image: p.image });
    await learnProduct({ ...p, id: code, packSize, lastLoc: loc });
    rapidPush(it);
    return;
  }
  if (p) { confirmAdd(p, code); }
  else { unknownSheet(code); }
}

/* Add to the running rapid tally and repaint it in place — deliberately
   WITHOUT a full render(), which would tear down and restart the camera
   between every scan. Each add still gets its own 6-second undo toast. */
function rapidPush(it) {
  rapidLog = rapidLog.filter(r => r.id !== it.id);
  rapidLog.unshift({ id: it.id, name: it.name, loc: it.loc });
  paintRapidList(document.getElementById('rapidlist'));
  toast(`${it.name} → ${locName(it.loc)}`, async () => {
    const cur = S.items.find(x => x.id === it.id);
    if (cur) { cur.deleted = true; await saveItem(cur); }
    rapidLog = rapidLog.filter(r => r.id !== it.id);
  });
}

function confirmAdd(p, code) {
  const dlg = document.getElementById('dlg');
  const guessLoc = S.catalog.find(c => c.id === code)?.lastLoc || defaultLoc(p.cat);
  dlg.innerHTML = `<div class="eyebrow">${p.source === 'yours' ? 'From your catalog' : 'Open Food Facts'} · ${esc(code)}</div>
    <h1 style="margin:6px 0 14px">${esc(p.name)}</h1>
    <label><span class="lbl">Shelf</span><select id="loc">${S.household.locations.map(l =>
      `<option value="${l.id}" ${l.id === guessLoc ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label>
    <div class="row"><label style="flex:1"><span class="lbl">How many</span><input type="number" id="qty" value="1" min="1"></label>
    <label style="flex:1"><span class="lbl">Pack of (blank = single)</span><input type="number" id="pk" placeholder="40" value="${p.packSize || ''}"></label></div>
    <button class="btn cold" data-a="add">Put it away</button>
    <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
  dlg.querySelector('[data-a=add]').onclick = async () => {
    const loc = dlg.querySelector('#loc').value;
    const packSize = parseInt(dlg.querySelector('#pk').value) || null;
    const n = parseInt(dlg.querySelector('#qty').value) || 1;
    await addItem({ name: p.name, brand: p.brand, cat: p.cat, loc, qty: n, barcode: code, packSize, image: p.image });
    await learnProduct({ ...p, id: code, packSize, lastLoc: loc });
    dlg.close(); render();
    toast(`${p.name} → ${locName(loc)}`);
  };
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  dlg.showModal();
}

const defaultLoc = cat => {
  const L = S.household.locations;
  const s = SHELF[cat] || SHELF.other;
  const want = s[1] && !s[0] && !s[2] ? 'freezer' : s[0] >= (s[2] || 0) ? 'fridge' : 'pantry';
  return (L.find(l => l.kind === want) || L[0]).id;
};

/* The Kirkland path. Costco private label barely exists in public
   databases, so we ask once and never again. Two trips and your
   own catalog covers everything you actually buy. */
function unknownSheet(code) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<div class="eyebrow">Unknown barcode · ${esc(code)}</div>
    <h1 style="margin:6px 0 8px">Never seen this one</h1>
    <p class="note" style="margin:0 0 14px">Not in Open Food Facts — usually store brands like Kirkland. Tell us once and this barcode is yours forever.</p>
    <button class="btn cold" data-a="shoot">📷 Read the label for me</button>
    <div class="eyebrow" style="text-align:center;margin:14px 0 10px">or type it</div>
    <label><span class="lbl">Name</span><input id="nm" placeholder="Kirkland Organic Eggs"></label>
    <label><span class="lbl">What kind of thing</span><select id="cat">${CATS.map(c => `<option value="${c}">${c}</option>`).join('')}</select></label>
    <label><span class="lbl">Shelf</span><select id="loc">${S.household.locations.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
    <label><span class="lbl">Pack of (blank = single)</span><input type="number" id="pk" placeholder="40"></label>
    <button class="btn ghost" data-a="save">Save &amp; remember</button>
    <input type="file" accept="image/*" capture="environment" id="lp" class="hide">`;
  const fileEl = dlg.querySelector('#lp');
  dlg.querySelector('[data-a=shoot]').onclick = () => fileEl.click();
  fileEl.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const btn = dlg.querySelector('[data-a=shoot]');
    btn.innerHTML = `<span class="spin"></span> Reading…`;
    try {
      const { b64, mime } = await toB64(f);
      const schema = { type: 'OBJECT', properties: { name: { type: 'STRING' }, brand: { type: 'STRING' },
        cat: { type: 'STRING' }, packSize: { type: 'INTEGER' } }, required: ['name', 'cat'] };
      const r = await G.gen([{ text: `Read this food package label. Return the product name, brand, best category from this list: ${CATS.join(', ')}, and if it's a multipack, how many units are inside (else omit packSize).` },
        { inline_data: { mime_type: mime, data: b64 } }], schema);
      dlg.querySelector('#nm').value = r.name;
      dlg.querySelector('#cat').value = CATS.includes(r.cat) ? r.cat : 'other';
      if (r.packSize) dlg.querySelector('#pk').value = r.packSize;
      dlg.querySelector('#loc').value = defaultLoc(r.cat);
      btn.textContent = '✓ Got it — check below';
    } catch (err) { btn.textContent = '📷 Try again'; toast(err.message); }
  };
  dlg.querySelector('[data-a=save]').onclick = async () => {
    const name = dlg.querySelector('#nm').value.trim(); if (!name) return;
    const cat = dlg.querySelector('#cat').value, loc = dlg.querySelector('#loc').value;
    const packSize = parseInt(dlg.querySelector('#pk').value) || null;
    await addItem({ name, cat, loc, barcode: code, packSize });
    await learnProduct({ id: code, name, cat, packSize, lastLoc: loc });
    dlg.close(); render();
    toast(`${name} learned — scans instantly next time`);
  };
  dlg.showModal();
}

const toB64 = f => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res({ b64: r.result.split(',')[1], mime: f.type });
  r.readAsDataURL(f);
});

/* Photo flow: groceries on the counter (add) or ingredients laid out
   before cooking (deplete). Same camera, opposite sign. */
async function photoFlow(file) {
  const mode = S.cfg.scanMode === 'out' ? 'deplete' : 'add';
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<h1 style="margin:0 0 12px"><span class="spin"></span> Looking…</h1>
    <p class="note">Matching against the ${S.items.filter(i => !i.deleted).length} things you already have.</p>`;
  dlg.showModal();
  try {
    const { b64, mime } = await toB64(file);
    const found = await visionMatch(b64, mime, mode);
    if (!found.length) { dlg.innerHTML = `<h1 style="margin:0 0 10px">Nothing recognised</h1>
      <p class="note" style="margin-bottom:14px">Try a flatter angle with less overlap, or type it in.</p>
      <button class="btn ghost" onclick="document.getElementById('dlg').close()">Close</button>`; return; }
    dlg.innerHTML = `<div class="eyebrow">${mode === 'add' ? 'Putting away' : 'Using these up'}</div>
      <h1 style="margin:6px 0 6px">Found ${found.length}</h1>
      <p class="note" style="margin:0 0 14px">Untick anything it got wrong.</p>
      ${found.map((f, i) => `<label style="display:flex;gap:10px;align-items:center;margin-bottom:9px;font-family:var(--mono);font-size:13px">
        <input type="checkbox" checked data-i="${i}" style="width:19px;height:19px;flex:0 0 auto">
        ${esc(f.name)} <span style="color:var(--vapor-dim)">×${f.count || 1}</span></label>`).join('')}
      ${mode === 'add' ? `<label style="margin-top:6px"><span class="lbl">Onto which shelf</span><select id="loc">${S.household.locations.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>` : ''}
      <button class="btn cold" data-a="go">${mode === 'add' ? 'Put them away' : 'Deduct them'}</button>
      <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
    dlg.querySelector('[data-a=go]').onclick = async () => {
      const picks = [...dlg.querySelectorAll('input:checked')].map(c => found[+c.dataset.i]);
      if (mode === 'add') {
        const loc = dlg.querySelector('#loc').value;
        const added = [];
        for (const f of picks) added.push(await addItem({ name: f.name, cat: CATS.includes(f.cat) ? f.cat : 'other', loc, qty: f.count || 1, expires: parseExpiry(f.expiry) }));
        toast(`${picks.length} put away in ${locName(loc)}`);
        if (verifyNudge(added)) return;   // risky items to check — nudge takes over the sheet
      } else {
        for (const f of picks) {
          const it = f.id && S.items.find(i => i.id === f.id && !i.deleted);
          if (it) for (let n = 0; n < (f.count || 1); n++) await deplete(it, 'cooked');
        }
        toast(`${picks.length} deducted`);
      }
      dlg.close(); render();
    };
    dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  } catch (e) {
    dlg.innerHTML = `<h1 style="margin:0 0 10px">Couldn't read it</h1><div class="warn" style="margin-bottom:14px">${esc(e.message)}</div>
      <button class="btn ghost" onclick="document.getElementById('dlg').close()">Close</button>`;
  }
}

/* Strategy A: after a bulk import, flag ONLY the high-risk items whose date
   is still a guess (no printed date was read). A few native date pickers,
   pre-filled with the estimate, or one tap to trust them all. This is the
   "reduce 30 chores to 4, and even those are optional" moment. */
function verifyNudge(items) {
  const need = (items || []).filter(i => i && !i.deleted && isHighRisk(i.cat) && !i.dateConfirmed);
  if (!need.length) return false;
  const dlg = document.getElementById('dlg');
  const iso = ts => new Date(ts).toISOString().slice(0, 10);
  dlg.innerHTML = `<div class="eyebrow">Worth a quick check</div>
    <h1 style="margin:6px 0 6px">${need.length} perishable${need.length > 1 ? 's' : ''}</h1>
    <p class="note" style="margin:0 0 14px">These spoil fast and no printed date was visible, so the date below is a guess. Glance at the package and fix any that are off — or just trust them.</p>
    ${need.map((i, k) => `<label style="display:block;margin-bottom:12px">
      <span class="lbl">${esc(i.name)}</span>
      <input type="date" data-k="${k}" value="${iso(i.expires)}"></label>`).join('')}
    <button class="btn cold" data-a="save">Save dates</button>
    <button class="btn ghost" data-a="trust" style="margin-top:8px">Trust the estimates</button>`;
  dlg.querySelector('[data-a=save]').onclick = async () => {
    for (const inp of dlg.querySelectorAll('input[type=date]')) {
      const i = need[+inp.dataset.k];
      const ts = parseExpiry(inp.value);
      if (ts && ts !== i.expires) { i.expires = ts; }
      i.dateConfirmed = true;
      await saveItem(i); learnFromDate(i);
    }
    dlg.close(); render(); toast('Dates set');
  };
  dlg.querySelector('[data-a=trust]').onclick = () => { dlg.close(); render(); };
  if (!dlg.open) dlg.showModal();
  return true;
}

/* Add a batch of receipt items. sel 'auto' sends each to its natural shelf
   by category (milk->fridge, rice->pantry, frozen->freezer); otherwise all
   to the chosen shelf. Each gets its expiry auto-estimated in addItem. */
async function addReceiptItems(items, sel) {
  const added = [];
  for (const f of items) {
    const cat = CATS.includes(f.cat) ? f.cat : 'other';
    const loc = sel === 'auto' ? defaultLoc(cat) : sel;
    added.push(await addItem({ name: f.name, cat, loc, qty: f.count || 1, expires: parseExpiry(f.expiry) }));
  }
  return added;
}

async function receiptFlow(file) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<h1 style="margin:0 0 12px"><span class="spin"></span> Reading receipt…</h1>
    <p class="note">Sharpening the photo and pulling the items off — one photo, the whole trip.</p>`;
  dlg.showModal();
  try {
    let payload;
    try { payload = await prepReceipt(file); }        // sharpen for accuracy; fall back to raw if it fails
    catch (e) { payload = await toB64(file); }
    const found = await visionReceipt(payload.b64, payload.mime);
    if (!found.length) {
      dlg.innerHTML = `<h1 style="margin:0 0 10px">Nothing readable</h1>
        <p class="note" style="margin-bottom:14px">Couldn't pull items off that photo. Lay the receipt flat on a dark surface, fill the frame, and avoid glare — then try again.</p>
        <button class="btn ghost" onclick="document.getElementById('dlg').close()">Close</button>`;
      return;
    }
    const catOpts = sel => CATS.map(c => `<option value="${c}"${c === sel ? ' selected' : ''}>${esc(CAT_LABEL(c))}</option>`).join('');
    dlg.innerHTML = `<div class="eyebrow">From your receipt</div>
      <h1 style="margin:6px 0 6px">Found ${found.length}</h1>
      <p class="note" style="margin:0 0 12px">Check the reads — <b>tap any name to fix a typo</b>, tweak the count, untick non-food. Expiry is set automatically by type.</p>
      <div id="rlist">${found.map((f, i) => `<div class="card" data-row="${i}" style="padding:10px;margin-bottom:8px;display:flex;gap:9px;align-items:center">
        <input type="checkbox" checked data-i="${i}" style="width:20px;height:20px;flex:0 0 auto">
        <div style="flex:1;min-width:0">
          <input class="rnm" data-i="${i}" value="${esc(f.name)}" style="padding:7px 9px;font-size:14px;font-weight:600;margin-bottom:5px">
          <div style="display:flex;gap:6px">
            <select class="rcat" data-i="${i}" style="flex:1;padding:6px 8px;font-size:12px">${catOpts(CATS.includes(f.cat) ? f.cat : 'other')}</select>
            <input class="rqty" data-i="${i}" type="number" min="1" value="${f.count || 1}" style="width:60px;padding:6px 8px;font-size:12px" aria-label="Quantity">
          </div>
        </div></div>`).join('')}</div>
      <label style="margin-top:2px"><span class="lbl">Put them on</span><select id="loc">
        <option value="auto" selected>Auto — by food type</option>
        ${S.household.locations.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
      <button class="btn cold" data-a="go">Add to inventory</button>
      <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
    dlg.querySelector('[data-a=go]').onclick = async () => {
      const picks = [...dlg.querySelectorAll('#rlist input[type=checkbox]:checked')].map(c => {
        const i = +c.dataset.i;
        return {
          name: (dlg.querySelector(`.rnm[data-i="${i}"]`).value || found[i].name).trim(),
          cat: dlg.querySelector(`.rcat[data-i="${i}"]`).value,
          count: parseInt(dlg.querySelector(`.rqty[data-i="${i}"]`).value) || 1,

    };

  } catch (e) {
    dlg.innerHTML = `<h1 style="margin:0 0 10px">Couldn't read it</h1><div class="warn" style="margin-bottom:14px">${esc(e.message)}</div>

/* ---------------- view: catalog ----------------
   The learned product database. Every barcode you scan is remembered here
   forever (learnProduct), so a re-scan is instant and store brands only
   need identifying once. This is the browsable face of that memory —
   it gets bigger and smarter the more the house gets used. */
function viewCatalog(app) {
  const total = S.catalog.length;
  app.appendChild(el(`<p class="note" style="margin:0 0 12px">Everything you've scanned, remembered forever — <b>${total}</b> product${total === 1 ? '' : 's'} and counting. Recognised instantly next time, even offline.</p>`));

  if (!total) {
    app.appendChild(el(`<div class="empty">
      <div class="big">Nothing learned yet</div>
      <div class="sub">Scan a barcode in the Scan tab. Every product you scan lands here — including the Kirkland ones you teach it once.</div></div>`));
    return;
  }

  const sb = el(`<input id="cq" placeholder="Search ${total} known products…" value="${esc(S.cq || '')}"
    style="margin-bottom:12px" autocomplete="off" enterkeyhint="search">`);
  sb.oninput = e => { S.cq = e.target.value; paintCatalog(document.getElementById('catlist')); };
  app.appendChild(sb);

  const box = el(`<div id="catlist"></div>`);
  app.appendChild(box);
  paintCatalog(box);
  if (S.cq) { sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
}

function paintCatalog(box) {
  if (!box) return;
  box.innerHTML = '';
  let list = [...S.catalog].sort((a, b) => (b.learned || 0) - (a.learned || 0));   // newest first
  if (S.cq?.trim()) {
    list = list
      .map(c => ({ c, s: Math.max(fuzzyScore(S.cq, c.name), fuzzyScore(S.cq, c.brand || '') * 0.9) }))
      .filter(x => x.s >= 0.4)
      .sort((a, b) => b.s - a.s)
      .map(x => x.c);
  }
  if (!list.length) {
    return box.appendChild(el(`<div class="empty"><div class="big">No match for "${esc(S.cq)}"</div>
      <div class="sub">It's not in the scan memory yet. Scan it once and it's yours forever.</div></div>`));
  }
  const inStock = c => S.items.some(i => !i.deleted && i.barcode === c.id);
  list.slice(0, 200).forEach(c => {
    const sub = c.brand ? esc(c.brand) : CAT_LABEL(c.cat || 'other');
    const stock = inStock(c)
      ? `<span class="stamp" style="--rail:var(--fresh)">IN STOCK</span>`
      : `<span class="qty" style="color:var(--vapor-dim)">not in the house</span>`;
    const row = el(`<div class="item">
      ${thumbHtml(c)}
      <div class="body" data-a="info" style="cursor:pointer">
        <div class="nm">${esc(c.name)}</div>
        <div class="meta"><span class="qty">${sub}</span>${stock}</div>
      </div>
      <div class="act"><button class="plus" data-a="add" aria-label="Add ${esc(c.name)} to a shelf">＋</button></div>
    </div>`);
    const img = c.image && row.querySelector('.thumb img');
    if (img) img.onerror = () => { img.parentNode.innerHTML = `<span class="ph">${firstLetter(c.name)}</span>`; };
    row.querySelector('[data-a=add]').onclick = () => confirmAdd({ ...c, source: 'yours' }, c.id);   // restock without re-scanning
    row.querySelector('[data-a=info]').onclick = () => catalogSheet(c);
    box.appendChild(row);
  });
  if (list.length > 200) box.appendChild(el(`<div class="note" style="text-align:center;padding:10px">+${list.length - 200} more — keep typing</div>`));
}

function catalogSheet(c) {
  const dlg = document.getElementById('dlg');
  const have = S.items.filter(i => !i.deleted && i.barcode === c.id).length;
  dlg.innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">
      ${bigPicHtml(c)}

        <div class="stamp" style="--rail:${have ? 'var(--fresh)' : 'var(--vapor-dim)'};font-size:12px">${have ? have + ' IN THE HOUSE' : 'NOT IN STOCK'}${c.brand ? ' · ' + esc(c.brand) : ''}</div>
      </div>
    </div>
    <div class="note" style="margin:0 0 14px">Barcode <span class="code">${esc(c.id)}</span> — learned ${c.learned ? new Date(c.learned).toLocaleDateString() : 'a while ago'}.</div>
    <button class="btn cold" data-a="add">＋ Add to a shelf</button>
    <button class="btn ghost" data-a="photo" style="margin-top:8px">📷 Change photo</button>
    <input type="file" accept="image/*" id="cphoto" class="hide">
    <button class="btn ghost" data-a="forget" style="margin-top:8px;color:var(--spoil);border-color:var(--spoil)">Forget this product</button>
    <button class="btn ghost" data-a="close" style="margin-top:8px;border:none;color:var(--vapor)">Close</button>`;
  dlg.querySelector('[data-a=add]').onclick = () => { dlg.close(); confirmAdd({ ...c, source: 'yours' }, c.id); };
  dlg.querySelector('[data-a=photo]').onclick = () => dlg.querySelector('#cphoto').click();
  dlg.querySelector('#cphoto').onchange = e => { const f = e.target.files[0]; if (f) { dlg.close(); setCatalogPhoto(c, f); } };
  dlg.querySelector('[data-a=forget]').onclick = async () => {
    await DB.del('catalog', c.id);
    S.catalog = S.catalog.filter(x => x.id !== c.id);
    dlg.close(); render();
    toast(`Forgot ${c.name}`, async () => { await DB.put('catalog', c); S.catalog.push(c); });
  };
  dlg.querySelector('[data-a=close]').onclick = () => dlg.close();
  dlg.showModal();
}

/* ---------------- family sync setup ---------------- */
const SUPA_SQL = `create table if not exists public.sync (
  household text not null,
  store text not null,
  id text not null,
  data jsonb,
  updated_at timestamptz default now(),
  deleted boolean default false,
  primary key (household, store, id)
);
alter table public.sync enable row level security;
create policy "family access" on public.sync for all using (true) with check (true);
alter publication supabase_realtime add table public.sync;`;

    sc.querySelector('[data-a=resync]').onclick = async () => { await SYNC.pull(); toast('Synced'); };
    sc.querySelector('[data-a=pushon]').onclick = async () => {
      try {
        if (S.cfg.pushOn) { await PUSH.disable(); toast('Notifications off'); }
        else { S.cfg.vapidPublic = sc.querySelector('#vp').value.trim(); await saveCfg(); await PUSH.enable(); toast('Notifications on'); }
      } catch (e) { toast(e.message); }

    };
    sc.querySelector('[data-a=off]').onclick = async () => { S.cfg.householdCode = ''; await saveCfg(); SYNC.chan = null; renderSyncCard(sc); toast('Disconnected — data stays on this phone'); };
    return;
  }
  sc.innerHTML = `
    <div class="note" style="margin:0 0 10px">Share one inventory + shopping list across the family's phones. Free. Your data lives in a private Supabase project <b>you own</b>.</div>
    <div class="warn" style="margin-bottom:12px">Heads-up: this puts your inventory in the cloud (not only on this phone). Only people with your project URL + key + household code can reach it.</div>
    <ol class="note" style="padding-left:18px;margin:0 0 12px">
      <li style="margin-bottom:6px">Make a free project at <b>supabase.com</b> → New project.</li>
      <li style="margin-bottom:6px">Copy the SQL below → Supabase <b>SQL Editor</b> → Run.</li>
      <li>Supabase <b>Project Settings → API</b>: copy the <b>Project URL</b> and <b>anon public</b> key, paste below.</li>
    </ol>
    <button class="btn ghost" data-a="copysql" style="margin-bottom:12px">Copy setup SQL</button>
    <label><span class="lbl">Project URL</span><input id="su" value="${esc(c.supaUrl || '')}" placeholder="https://xxxx.supabase.co"></label>
    <label><span class="lbl">anon public key</span><input id="sk" type="password" value="${esc(c.supaKey || '')}" placeholder="eyJ…"></label>
    <button class="btn cold" data-a="save">Connect</button>

  sc.querySelector('[data-a=copysql]').onclick = () => { navigator.clipboard?.writeText(SUPA_SQL); toast('SQL copied — paste it into Supabase → SQL Editor'); };
  sc.querySelector('[data-a=save]').onclick = async () => {
    const url = sc.querySelector('#su').value.trim().replace(/\/+$/, '');
    const key = sc.querySelector('#sk').value.trim();
    if (!url || !key) return toast('Paste both the Project URL and the key');
    const box = sc.querySelector('#ssx'); box.innerHTML = `<span class="spin"></span>`;
    S.cfg.supaUrl = url; S.cfg.supaKey = key; await saveCfg();
    try {
      SYNC.cli = null; await loadSupabase();
      const { error } = await SYNC.client().from('sync').select('household').limit(1);
      if (error) throw error;
      box.innerHTML = `<div class="note" style="margin-bottom:8px">Connected ✓ Create a new household, or join one with its code.</div>
        <button class="btn cold" data-a="create">Create new household</button>

      box.querySelector('[data-a=create]').onclick = async () => {
        S.cfg.householdCode = (crypto.randomUUID?.() || (uid() + uid())); await saveCfg();
        SYNC.cli = null; await loadSupabase(); await SYNC.pushAll(); SYNC.subscribe();
        renderSyncCard(sc); toast('Household created — sharing on');
      };
      box.querySelector('[data-a=join]').onclick = async () => {
        const code = box.querySelector('#jc').value.trim(); if (!code) return;
        S.cfg.householdCode = code; await saveCfg();
        SYNC.cli = null; await loadSupabase(); await SYNC.pull(); SYNC.subscribe();
        renderSyncCard(sc); toast('Joined household');
      };
    } catch (e) { box.innerHTML = `<div class="warn">${esc(e.message)} — check the URL/key and that you ran the SQL.</div>`; }
  };
}

/* ---------------- view: shopping list ---------------- */
/* "Costco · Greens" — where a thing actually comes from, learned from your
   own trips rather than assumed. */
function storeLabel(c, current = '') {
  const ss = c.stores || {};
  if (current && ss[current]) return storeName(current);
  const ids = Object.keys(ss).sort((a, b) => (ss[b].n || 0) - (ss[a].n || 0));
  return ids.map(storeName).filter(Boolean).slice(0, 2).join(' · ') || 'any store';
}

/* Manage the household's stores. Deliberately plain: a name and an emoji is
   all a store needs to be recognisable at the top of a list. */
function storeSheet() {
  const dlg = document.getElementById('dlg');
  const draw = () => {
    dlg.innerHTML = `<div class="eyebrow">Stores</div><h1 style="margin:6px 0 6px">Where do you shop?</h1>
      <p class="note" style="margin:0 0 14px">Each store gets its own list, and the app remembers which store you buy each thing at.</p>
      ${storeList().map(s => `<div class="row" style="margin-bottom:8px;align-items:center">
        <span style="font-size:22px">${s.emoji || '🏬'}</span>
        <span style="flex:1;font-weight:650">${esc(s.name)}</span>
        <button class="btn ghost" data-rm="${esc(s.id)}" style="width:auto;padding:0 14px">Remove</button></div>`).join('')
        || `<div class="note" style="margin-bottom:14px">No stores yet.</div>`}
      <label style="margin-top:10px"><span class="lbl">Add a store</span>
        <input id="snm" placeholder="Costco, Greens Natural Foods…" autocomplete="off"></label>
      <button class="btn cold" data-a="add">Add store</button>
      <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Done</button>`;
    const go = async () => {
      const v = dlg.querySelector('#snm').value.trim();
      if (!v) return;
      await addStore(v);
      draw();
    };
    dlg.querySelector('[data-a=add]').onclick = go;

/* Searchable history picker, shared by Shop and Plan. Typo-tolerant, because
   the point of a history is that you don't have to remember what you called
   it last time. */
/* `multi` keeps the sheet open so you can add a run of things and see each
   one tick — closing after a single tap is what made this feel like a
   dead button. Picking a meal for one day is genuinely one-and-done. */
function catalogPicker({ kind = CAT_PRODUCT, store = '', onPick, multi = true }) {
  const dlg = document.getElementById('dlg');
  const meal = kind === CAT_MEAL;
  const added = new Set();
  dlg.innerHTML = `<div class="eyebrow">From your history</div>
    <h1 style="margin:6px 0 12px">${meal ? "Meals you've made" : "Things you've bought"}</h1>
    <input id="cpq" placeholder="Search — spelling doesn't have to be perfect" autocomplete="off" style="margin-bottom:12px">
    <div id="cpl"></div>
    <button class="btn ${multi ? 'cold' : 'ghost'}" data-a="c" style="margin-top:12px">Done</button>`;
  const listBox = dlg.querySelector('#cpl');
  const doneBtn = dlg.querySelector('[data-a=c]');
  const count = () => { doneBtn.textContent = added.size ? `Done — ${added.size} added` : 'Done'; };
  const paint = () => {
    const q = dlg.querySelector('#cpq').value.trim();
    const rows = catalogList(kind, { store, q }).slice(0, 24);
    listBox.innerHTML = '';
    if (!rows.length) {
      listBox.appendChild(el(`<div class="empty" style="padding:34px 10px"><div class="big">${q ? 'No match' : 'Nothing yet'}</div>
        <div class="sub">${q ? 'Nothing in your history looks like that.'
          : meal ? 'Meals land here once you plan or cook them.'
                 : 'Things land here once you buy or stock them.'}</div></div>`));
      return;
    }
    const g = el(`<div class="tiles"></div>`);
    rows.forEach(c => g.appendChild(tileEl({
      name: c.name,
      meta: meal ? `${c.count || 0}× made` : `${c.count || 0}× · ${esc(storeLabel(c, store))}`,
      image: c.image,
      emoji: foodEmoji(c.name, c.cat || '') || (meal ? '🍽️' : '🛒'),
      badge: meal ? '' : stockTag(c.name),
      checked: added.has(c.id),
      checkLabel: added.has(c.id) ? 'Added ✓' : 'Add',
      stick: true,
      onCheck: async () => {
        if (added.has(c.id)) return;
        await onPick(c);
        added.add(c.id); count();
        if (!multi) dlg.close();
      },
      onCorner: () => pickPhoto(c, () => paint()), cornerIcon: '📷', cornerLabel: 'Set a photo for',
    })));
    listBox.appendChild(g);
  };
  dlg.querySelector('#cpq').oninput = paint;
  doneBtn.onclick = () => { dlg.close(); render(); };
  count(); paint();
  dlg.showModal();
}

/* ---------------- view: shop ----------------
   A real checklist. What you still need, what your own history says you're
   out of, and what's already in the cart — split per store, because a Costco
   run and a corner-shop run are different errands with different lists. */
function viewShopping(app) {
  const store = S.store || '';
  const stores = storeList();

  const tabs = el(`<div class="chips">
    <button class="chip" data-s="" aria-pressed="${!store}">All stores</button>
    ${stores.map(s => `<button class="chip" data-s="${esc(s.id)}" aria-pressed="${store === s.id}">${s.emoji || '🏬'} ${esc(s.name)}</button>`).join('')}
    <button class="chip" data-a="stores" aria-pressed="false">＋ Store</button></div>`);
  tabs.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.store = b.dataset.s; render(); });
  tabs.querySelector('[data-a=stores]').onclick = () => storeSheet();
  app.appendChild(tabs);

    finally { adding = false; inp.focus(); }

/* One line of the list. Checked items keep their photo and move to Completed
   instead of vanishing, so at the till you can still see what you picked up —
   and mark anything the store simply didn't have. */
function shopTile(s, box, flash = false) {
  const store = S.store || '';
  const known = catalogFind(s.name);
  const meta = s.done
    ? (s.missing ? `<span class="tag out">Store didn't have it</span>` : `<span class="tag have">✓ In the cart</span>`)
    : (stockTag(s.name) || `<span class="tag miss">Not in the house</span>`);
  const t = tileEl({
    name: s.name + (s.qty ? ` ×${s.qty}` : ''),
    meta,
    image: s.image || known?.image || null,
    emoji: foodEmoji(s.name, s.cat || known?.cat || '') || '🛒',
    badge: !store && s.store ? esc(storeName(s.store)) : '',
    checked: !!s.done,
    checkLabel: s.done ? 'Undo' : 'Got it',
    onCheck: async () => {
      if (s.done) { s.done = false; s.missing = false; await saveShopping(s); paintShopping(box); }
      else shoppingToPantry(s, () => paintShopping(box));
    },
    onCorner: async () => { s.deleted = true; await saveShopping(s); paintShopping(box); },
  });
  if (flash) t.classList.add('added');   // so you can see where a new line landed
  return t;
}

function paintShopping(box, flashId = '') {
  box.innerHTML = '';
  const store = S.store || '';
  const mine = S.shopping.filter(s => !s.deleted && (!store || (s.store || '') === store));
  const todo = mine.filter(s => !s.done).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const done = mine.filter(s => s.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  if (todo.length) {
    box.appendChild(el(`<div class="sect"><h3>Need to get</h3><span class="n">${todo.length}</span></div>`));
    const g = el(`<div class="tiles"></div>`);
    todo.forEach(s => g.appendChild(shopTile(s, box, s.id === flashId)));
    box.appendChild(g);
  } else {
    box.appendChild(el(`<div class="empty"><div class="big">${done.length ? 'All done' : 'Nothing on the list'}</div>
      <div class="sub">${done.length ? "Everything here is in the cart."
        : "Add what you need — or pull from what you've bought before."}</div></div>`));
  }

  // Earned from your own buying history: things you get regularly and have
  // none of right now. Stays silent until it genuinely knows something.
  const restock = restockList(store, 6);
  if (restock.length) {
    box.appendChild(el(`<div class="sect"><h3>You're out of these</h3><span class="n">bought before</span></div>`));
    const g = el(`<div class="tiles"></div>`);
    restock.forEach(c => g.appendChild(tileEl({
      name: c.name,
      meta: `${c.count}× · ${esc(storeLabel(c, store))}`,
      image: c.image, emoji: foodEmoji(c.name, c.cat) || '🛒',
      badge: `<span class="tag out">You're out</span>`,
      checkLabel: 'Add to list', stick: true,
      // Tick first, move it a beat later — repainting immediately yanks the
      // tile away before you've seen that anything happened.
      onCheck: async () => { await addToList(c.name, '', store); setTimeout(() => paintShopping(box), 750); },
      onCorner: () => pickPhoto(c, () => paintShopping(box)), cornerIcon: '📷', cornerLabel: 'Set a photo for',
    })));
    box.appendChild(g);
  }

  if (done.length) {
    box.appendChild(el(`<div class="sect"><h3>Completed</h3><span class="n">${done.length}</span></div>`));
    const g = el(`<div class="tiles"></div>`);
    done.forEach(s => g.appendChild(shopTile(s, box)));
    box.appendChild(g);
    const clr = el(`<button class="btn ghost">Clear completed</button>`);
    clr.onclick = async () => { for (const s of done) { s.deleted = true; await saveShopping(s); } paintShopping(box); };
    box.appendChild(clr);
  }
}

/* ---------------- backup ----------------
   Two different things people mean by "back up my app":
     1. My DATA — a JSON file to re-import. Small and mergeable.
     2. THE APP — something you can open and use. Tapping a .json gets you a
        screen of raw text, which is nobody's idea of a restored app.
   So we ship both, and the .html one is a real, working, offline copy. */
const stamp = () => new Date().toISOString().slice(0, 10);
function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const BACKUP_STORES = ['items', 'catalog', 'shopping', 'plan', 'saved', 'log'];
/* Keys stay OUT of the file, so it's safe to email to yourself or leave in a
   shared drive. Re-pasting a key is a minor annoyance; leaking one isn't. */
const CFG_SECRETS = ['geminiKey', 'openaiKey', 'supaKey', 'supaUrl', 'vapidPublic', '_syncq'];

async function backupData() {
  const rows = await Promise.all(BACKUP_STORES.map(s => DB.all(s)));
  const cfg = { ...S.cfg };
  CFG_SECRETS.forEach(k => delete cfg[k]);
  const out = { v: 2, at: Date.now(), household: S.household || null, cfg };
  BACKUP_STORES.forEach((s, i) => (out[s] = rows[i]));
  return out;
}

/* Accepts either export. The .html one carries its data in a script tag.
   Careful: a snapshot contains this app's whole source, and that source
   contains this very pattern — so the FIRST match is the code that looks for
   the payload, not the payload. The real one is appended last, so walk the
   matches backwards and take the first that's genuinely JSON. */
async function readBackup(file) {
  const text = await file.text();
  if (/^\s*[{[]/.test(text)) return JSON.parse(text);
  const all = [...text.matchAll(/<script id="shelflife-restore"[^>]*>([\s\S]*?)<\/script>/gi)];
  for (let i = all.length - 1; i >= 0; i--) {
    try { return JSON.parse(all[i][1]); } catch (e) { /* that one was source, keep looking */ }
  }
  throw new Error('not a backup');
}

/* Merge by id, so a restore never clobbers something newer on this device.
   Keys already on THIS phone win over the (blank) ones in the file. */
async function applyBackup(data) {
  if (!data || typeof data !== 'object') throw new Error('not a backup');
  if (!BACKUP_STORES.some(s => Array.isArray(data[s])) && !data.household) throw new Error('not a backup');
  for (const s of BACKUP_STORES)
    for (const r of (data[s] || [])) if (r && r.id) await DB.put(s, r);
  if (data.household) await DB.put('meta', { id: 'household', ...data.household });
  if (data.cfg) { S.cfg = { ...data.cfg, ...S.cfg }; await saveCfg(); }
  const [items, catalog, shopping, plan, saved, household] = await Promise.all([
    DB.all('items'), DB.all('catalog'), DB.all('shopping'), DB.all('plan'), DB.all('saved'),
    DB.get('meta', 'household')]);
  S.items = items; S.catalog = catalog; S.shopping = shopping; S.plan = plan; S.saved = saved;
  if (household) S.household = household;
  if (S.household && !S.who) S.who = S.household.members?.[0] || null;
  return items.length;
}

/* The whole app, with the data baked in, as one file. The app is a single
   HTML document already, so this is genuinely the entire thing — not a
   pointer to it. */
async function snapshotHTML() {
  const src = await (await fetch('index.html', { cache: 'no-store' })).text();
  const json = JSON.stringify(await backupData()).replace(/</g, '\\u003c');
  const tag = `<script id="shelflife-restore" type="application/json">${json}<\/script>`;
  // Anchor on the LAST close-body tag, and never write that tag literally
  // here: this function's own source ends up inside `src`, so splicing at the
  // first hit buries the payload in the middle of the code instead of at the
  // end of the document. Slice rather than replace() — the JSON can contain
  // "$&" and friends, which replace() would treat as substitutions.
  const close = '<' + '/body>';
  const at = src.lastIndexOf(close);
  return at < 0 ? src + tag : src.slice(0, at) + tag + '\n' + src.slice(at);
}

/* Opening a snapshot: if this copy is empty it just becomes your app. If it
   already has data, never clobber silently — offer it. */
async function loadSnapshotSeed() {
  const node = document.getElementById('shelflife-restore');
  if (!node) return;
  let data; try { data = JSON.parse(node.textContent); } catch (e) { return; }
  const n = (data.items || []).length;
  if (!S.household) { await applyBackup(data); render(); toast(`Backup opened — ${n} items`); return; }
  toast(`This file holds a backup of ${n} items — tap to load it`,
    async () => { await applyBackup(data); render(); });
}

    <input type="file" accept="image/*" id="afr" class="hide">
    <button class="btn ghost" data-a="c" style="border:none;color:var(--vapor)">Cancel</button>`;
  const close = () => dlg.close();
  dlg.querySelector('[data-a=barcode]').onclick = () => { close(); S.cfg.scanMode = 'in'; S.view = 'scan'; render(); };
  dlg.querySelector('[data-a=receipt]').onclick = () => dlg.querySelector('#afr').click();
  dlg.querySelector('#afr').onchange = e => { const f = e.target.files[0]; if (f) { close(); receiptFlow(f); } };
  dlg.querySelector('[data-a=photo]').onclick = () => dlg.querySelector('#afp').click();
  dlg.querySelector('#afp').onchange = e => { const f = e.target.files[0]; if (f) { close(); photoFlow(f); } };
  dlg.querySelector('[data-a=type]').onclick = () => { close(); manualSheet(); };
  dlg.querySelector('[data-a=c]').onclick = close;
  dlg.showModal();
}

/* ---------------- view: PANTRY (what's in the house) ---------------- */
function viewPantry(app) {
  const live = S.items.filter(i => !i.deleted);
  if (!live.length) {
    app.appendChild(el(`<div class="empty" style="padding-top:44px">
      <div style="font-size:58px;margin-bottom:8px">🧺</div>
      <div class="big">Your pantry is empty</div>
      <div class="sub">Add what's in your kitchen — ShelfLife tracks what you have, warns you before it expires, and turns it into meals.</div></div>`));
    const b = el(`<button class="btn cold" style="max-width:320px;margin:16px auto 0">＋ Add your first item</button>`);
    b.onclick = () => addFoodChooser();
    app.appendChild(b);
    return;
  }
  const soon = live.filter(i => freshness(i).left <= 3).sort((a, b) => a.expires - b.expires);
  if (soon.length) {
    const sec = el(`<div class="section" style="margin-bottom:8px"><div class="section-head"><h2>Use soon</h2><button class="more" data-a="allsoon">See all</button></div></div>`);
    const sc = el(`<div class="hscroll"></div>`);
    soon.slice(0, 10).forEach(it => {
      const d = freshness(it).left;
      const col = d <= 0 ? 'var(--spoil)' : d <= 2 ? 'var(--thaw)' : 'var(--fresh)';
      const c = el(`<div class="foodcard"><div class="top">${it.image ? `<img src="${esc(it.image)}" alt="">` : (foodEmoji(it.name, it.cat) || '🍽️')}</div>
        <div class="lo"><div class="fn">${esc(it.name)}</div><div class="fd" style="color:${col}">${daysLabel(d)}</div></div></div>`);
      c.onclick = () => itemSheet(it);
      sc.appendChild(c);
    });
    sec.appendChild(sc);
    app.appendChild(sec);
    sec.querySelector('[data-a=allsoon]').onclick = () => { S.view = 'soon'; render(); };
  }
  viewInv(app);
  pantryHistory(app);
  setTimeout(enrichItemPhotos, 400);   // fill in real product photos in the background
  setTimeout(enrichCatalogPhotos, 900);
}

/* Everything that's ever lived on these shelves and isn't here now. This is
   the same catalog Shop and Plan read — restocking a staple is one tap from
   what you've actually had, instead of retyping it from memory. */
function pantryHistory(app) {
  if (S.q?.trim()) return;                       // searching? show matches, not history
  const gone = catalogList(CAT_PRODUCT)
    .filter(c => stockState(c.name).state === 'out')
    .slice(0, 8);
  if (!gone.length) return;

  const head = el(`<div class="sect"><h3>Had before, not here now</h3><span class="n">${gone.length}</span></div>`);
  app.appendChild(head);
  const g = el(`<div class="tiles"></div>`);
  gone.forEach(c => g.appendChild(tileEl({
    name: c.name,
    meta: `${c.count || 0}× · ${esc(storeLabel(c))}`,
    image: c.image, emoji: foodEmoji(c.name, c.cat) || '🛒',
    checkLabel: 'Add to list', stick: true,
    onCheck: async () => { await addToList(c.name, '', S.store || ''); toast(`${c.name} on the list`); },
    onTap: () => restockSheet(c),
    onCorner: () => pickPhoto(c, () => render()), cornerIcon: '📷', cornerLabel: 'Set a photo for',
  })));
  app.appendChild(g);
}

/* Tapping something in the history: put it straight back on a shelf, or just
   note that you need it. Both paths are one tap from here. */
function restockSheet(c) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<div class="eyebrow">${esc(storeLabel(c))} · bought ${c.count || 0}×</div>
    <h1 style="margin:6px 0 12px">${esc(c.name)}</h1>
    <label><span class="lbl">Shelf</span><select id="rloc2">${S.household.locations.map(l =>
      `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
    <label><span class="lbl">How many</span><input type="number" id="rq" value="1" min="1"></label>
    <button class="btn cold" data-a="stock">✓ Put it back in the pantry</button>
    <button class="btn ghost" data-a="list" style="margin-top:8px">🛒&nbsp;&nbsp;Just add it to the shopping list</button>
    <button class="btn ghost" data-a="photo" style="margin-top:8px">📷&nbsp;&nbsp;Set a photo</button>
    <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
  if (c.lastLoc) dlg.querySelector('#rloc2').value = c.lastLoc;
  dlg.querySelector('[data-a=stock]').onclick = async () => {
    await addItem({ name: c.name, cat: c.cat || guessCat(c.name), loc: dlg.querySelector('#rloc2').value,
      qty: parseInt(dlg.querySelector('#rq').value) || 1, image: c.image || null, packSize: c.packSize || null });
    dlg.close(); render(); toast(`${c.name} back in the pantry`);
  };
  dlg.querySelector('[data-a=list]').onclick = async () => {
    await addToList(c.name, '', S.store || ''); dlg.close(); render(); toast(`${c.name} on the list`);
  };
  dlg.querySelector('[data-a=photo]').onclick = () => { dlg.close(); pickPhoto(c, () => render()); };
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  dlg.showModal();
}

/* ---------------- first-run welcome tour (so a brand-new user gets it) ---------------- */
const WELCOME = [
  { art: '🥗', title: 'Welcome to ShelfLife', sub: 'Your kitchen, organized. Know what you have, what’s expiring, and what to cook — so food stops getting wasted.' },
  { art: '📷', title: 'Add food in seconds', sub: 'Scan a barcode or a whole receipt, snap a photo of a shelf, or type it in. No long forms.' },
  { art: '⏰', title: 'Never waste food again', sub: 'ShelfLife estimates the expiry date for you and shows what to eat first — right on the Pantry screen.' },
  { art: '🍴', title: 'Cook & plan, effortlessly', sub: 'Get recipes from what you already have, then plan the week and send missing items to your shopping list in a tap.' },
];
function welcomeCarousel(onDone) {
  document.getElementById('welcomeOverlay')?.remove();
  let i = 0;
  const ov = el(`<div class="wc-wrap" id="welcomeOverlay">
    <button class="wc-skip">Skip</button>
    <div class="wc-body">
      <div class="wc-art"></div><div class="wc-title"></div><div class="wc-sub"></div>
    </div>
    <div class="wc-dots">${WELCOME.map(() => '<i></i>').join('')}</div>
    <button class="btn cold" id="wcNext">Next</button></div>`);
  const paint = () => {
    ov.querySelector('.wc-art').textContent = WELCOME[i].art;
    ov.querySelector('.wc-title').textContent = WELCOME[i].title;
    ov.querySelector('.wc-sub').textContent = WELCOME[i].sub;
    ov.querySelectorAll('.wc-dots i').forEach((d, n) => d.classList.toggle('on', n === i));
    ov.querySelector('#wcNext').textContent = i === WELCOME.length - 1 ? 'Get started' : 'Next';
  };
  const done = () => { ov.remove(); onDone && onDone(); };
  ov.querySelector('.wc-skip').onclick = done;
  ov.querySelector('#wcNext').onclick = () => { if (i < WELCOME.length - 1) { i++; paint(); } else done(); };
  paint();
  document.body.appendChild(ov);
}

const ICONS = {

};
const TABS = [['plan','Plan'],['shop','Shop'],['pantry','Pantry'],['cook','Cook'],['profile','Profile']];
const TITLES = { plan: 'Meal plan', shop: 'Shopping list', pantry: 'Pantry', cook: 'Cook', profile: 'Profile',
  home: 'ShelfLife', inv: 'Pantry', soon: 'Use soon', scan: 'Add food', cat: 'Catalog', set: 'Settings' };
const VIEWS = { plan: viewPlan, shop: viewShopping, pantry: viewPantry, cook: viewCook, profile: viewProfile,
  home: viewPantry, inv: viewInv, soon: viewSoon, scan: viewScan, cat: viewCatalog, set: viewSet };
// which tab in the bottom bar should read as active for non-tab sub-views
const TAB_OF = { inv: 'pantry', soon: 'pantry', scan: 'pantry', cat: 'profile', set: 'profile', home: 'pantry' };
let welcomed = false;

function render() {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const fab = document.getElementById('fab');
  if (S.view !== 'scan') stopCam();
  app.innerHTML = '';
  fab.classList.add('hide');

  const search = document.getElementById('searchBtn');
  if (!S.household) {
    nav.classList.add('hide'); search.classList.add('hide');
    viewSetup(app);
    if (!welcomed) welcomeCarousel(() => { welcomed = true; });   // first-run tour, over the setup form
    return;
  }
  nav.classList.remove('hide');
  // header search only makes sense on the pantry
  search.classList.toggle('hide', !(S.view === 'pantry' || S.view === 'inv'));

  const soonN = S.items.filter(i => !i.deleted && freshness(i).left <= 3).length;
  document.getElementById('title').textContent = TITLES[S.view] || 'ShelfLife';

  (VIEWS[S.view] || viewPantry)(app);

  // per-screen add button, Cooklist-style
  const fabFor = { pantry: () => addFoodChooser(), inv: () => addFoodChooser(), plan: () => addMealDialog(dayKey(new Date(today()))) };
  if (fabFor[S.view]) { fab.classList.remove('hide'); fab.onclick = fabFor[S.view]; }

  const active = TAB_OF[S.view] || S.view;
  nav.innerHTML = '';
  TABS.forEach(([id, label]) => {
    const b = el(`<button ${active === id ? 'aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>
      <span>${label}${id === 'pantry' && soonN ? ` · ${soonN}` : ''}</span></button>`);
    if (id === 'pantry' && soonN && active !== 'pantry') b.style.color = 'var(--thaw)';
    b.onclick = () => { S.view = id; render(); };
    nav.appendChild(b);
  });
}

(async function boot() {
  await DB.init();
  // Ask the browser NOT to evict our data. On installed PWAs (esp. iOS) this
  // is the difference between "kept" and "wiped after a week unused". Best
  // effort — never blocks boot, and Family sync is still the real backup.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {});
  }
  const [items, catalog, shopping, plan, saved, household, cfg] = await Promise.all([
    DB.all('items'), DB.all('catalog'), DB.all('shopping'), DB.all('plan'), DB.all('saved'), DB.get('meta', 'household'), DB.get('meta', 'cfg')
  ]);
  S.items = items; S.catalog = catalog; S.shopping = shopping; S.plan = plan; S.saved = saved; S.household = household || null; S.cfg = cfg || {};
  if (S.household) S.who = S.household.members.find(m => m.name === S.cfg.who) || S.household.members[0];
  document.getElementById('searchBtn').onclick = () => { S.view = 'pantry'; S.loc = 'all'; S.focusSearch = true; render(); };
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  loadSnapshotSeed();   // opened one of the .html backups? bring its data in
  G.ensureModel();   // silently repair a discontinued Gemini model (e.g. the dead 2.0-flash)
  SYNC.start().then(() => PUSH.dailyCheck());   // pull + subscribe, then maybe ping the family about dying food
})();
</script>
