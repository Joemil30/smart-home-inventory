/* Meal plan — a synced store keyed by day. Each entry: {id, date:'YYYY-MM-DD',
   name, emoji, uses:[], missing:[]}. Assigning a recipe to a day carries its
   ingredient gaps so the week's shopping can be built in one tap. */
async function savePlan(m) {
  m.updatedAt = Date.now();
  await DB.put('plan', m);
  const i = S.plan.findIndex(x => x.id === m.id);
  if (i > -1) S.plan[i] = m; else S.plan.push(m);
  SYNC.push('plan', m.id, m);
}
async function removePlan(id) {
  const m = S.plan.find(x => x.id === id);
  if (!m) return;
  m.deleted = true; m.updatedAt = Date.now();
  await DB.put('plan', m);
  S.plan = S.plan.filter(x => x.id !== id);
  SYNC.push('plan', id, m);
}
async function planMeal(date, { name, emoji = '', uses = [], missing = [], image = null }) {
  const known = catalogMeal(name);
  const m = { id: uid(), date, name: String(name).trim(), emoji, uses, missing,
    image: image || known?.image || null, deleted: false };
  await savePlan(m);
  // Planning something counts as knowing it, but not as having made it —
  // so the record appears in history without inflating the "made N times".
  await recordCatalog({ name: m.name, kind: CAT_MEAL, emoji, image: m.image }, { bump: false });
  return m;
}
const catalogMeal = name => catalogFind(name, CAT_MEAL);

/* Saved recipe library (Module 4) — bookmark a suggestion and keep its full
   data (title, image, steps, ingredients) locally + synced. */
const isSaved = r => S.saved.some(x => !x.deleted && norm(x.name) === norm(r.name));
async function saveRec(rec) {
  rec.updatedAt = Date.now();
  await DB.put('saved', rec);
  const i = S.saved.findIndex(x => x.id === rec.id);
  if (i > -1) S.saved[i] = rec; else S.saved.push(rec);
  SYNC.push('saved', rec.id, rec);
}
async function toggleSaveRecipe(r) {
  const ex = S.saved.find(x => !x.deleted && norm(x.name) === norm(r.name));
  if (ex) {
    ex.deleted = true; ex.updatedAt = Date.now();
    await DB.put('saved', ex); S.saved = S.saved.filter(x => x.id !== ex.id);
    SYNC.push('saved', ex.id, ex);
    toast('Removed from saved');
    return false;
  }
  const rec = { id: uid(), name: r.name, minutes: r.minutes || 0, uses: r.uses || [], missing: r.missing || [],
    rescues: r.rescues || [], steps: r.steps || [], image: r.image || null, deleted: false };
  await saveRec(rec);
  toast(`Saved “${r.name}”`);
  return true;
}
/* Recompute what's missing for a saved recipe against the CURRENT pantry, so
   the library reflects today's stock, not what you had when you saved it. */
function recomputeMissing(r) {
  const live = S.items.filter(i => !i.deleted).map(i => norm(i.name));
  const staples = (S.household?.staples || []).map(norm);
  const have = name => { const q = norm(name); return live.some(x => x.includes(q) || q.includes(x)) || staples.some(x => x.includes(q) || q.includes(x)); };
  return { ...r, missing: (r.uses || []).filter(u => !have(u)) };
}

/* how many of this (by fuzzy name) are actually in the house right now —
   powers the shopping list's "you already have it" guard. */
function itemInStock(name) {
  // fuzzy so a misspelled shopping entry ("chedar") still spots the real
  // item ("Cheddar") in the pantry. Threshold a touch stricter to avoid
  // false "you already have it" positives.
  return S.items.filter(i => !i.deleted && fuzzyHit(name, i.name, 0.55)).length;
}
/* `store` scopes the line to one shop's list ('' = any store). Dedupe is
   per-store: milk on the Costco list and milk on the corner-shop list are
   two real errands, not a double entry. */
async function addToList(name, qty, store = '') {
  const ex = S.shopping.find(s => !s.deleted && !s.done && (s.store || '') === store && norm(s.name) === norm(name));
  if (ex) { toast(`${name} is already on the list`); return ex; }
  const known = catalogFind(name);
  const it = { id: uid(), name: String(name).trim(), qty: qty || '', store,
    image: known?.image || null, cat: known?.cat || '',
    by: S.who?.name || '', done: false, missing: false, deleted: false };
  await saveShopping(it);
  return it;
}

/* Rough category from a plain product name — good enough to seed the expiry
   estimate when converting a shopping item into the pantry. */
function guessCat(name) {
  const n = String(name || '').toLowerCase();
  const map = [
    [/\bmilk\b/, 'dairy-milk'], [/cheese/, 'dairy-cheese-hard'], [/yog[hu]rt/, 'dairy-yogurt'], [/butter/, 'dairy-butter'],
    [/\begg/, 'eggs'], [/chicken|turkey/, 'poultry-raw'], [/beef|pork|steak|lamb|\bmeat\b|sausage|bacon/, 'meat-raw'],
    [/fish|salmon|tuna|shrimp|cod|tilapia/, 'fish-raw'], [/lettuce|spinach|kale|arugula|greens|salad/, 'produce-leafy'],
    [/berr|strawber|blueber|raspber/, 'produce-berry'], [/apple|orange|lemon|lime|citrus|grapefruit/, 'produce-citrus'],
    [/banana/, 'produce-banana'], [/avocado/, 'produce-avocado'], [/carrot|potato|onion|garlic|ginger|beet/, 'produce-root'],
    [/broccoli|pepper|cucumber|tomato|zucchini|celery|cabbage/, 'produce-hardy'], [/bread|bagel|\bbun|roll|baguette/, 'bread'],
    [/tortilla|wrap/, 'tortilla'], [/rice|pasta|noodle|spaghetti|macaroni/, 'dry-pasta-rice'], [/flour|sugar|\boat|grain|quinoa/, 'dry-grain-flour'],
    [/cereal/, 'cereal'], [/chip|cracker|snack|pretzel|popcorn/, 'snack'], [/frozen/, 'frozen-meal'],
    [/\bcan\b|soup|beans?\b|lentil/, 'canned'], [/sauce|salsa|ketchup|jam|jelly/, 'jarred-sauce'], [/oil|vinegar/, 'oil-vinegar'],
    [/coffee|\btea\b/, 'coffee-tea'], [/juice|soda|drink|cola/, 'juice-drink'], [/nut|almond|peanut|cashew|walnut/, 'nuts-seeds'],
  ];
  for (const [re, c] of map) if (re.test(n)) return c;
  return 'other';
}

/* Purchase conversion: a checked-off shopping item can flow straight into the
   pantry (Module 1). Prompt for shelf + count, add it, and clear the line. */
/* Checking something off has three honest outcomes, and the difference
   matters: bought it and shelved it, bought it and didn't bother tracking
   it, or the store was out. Only the first two are purchases — recording a
   miss as a buy would poison the history that Shop reads back to you. */
function shoppingToPantry(s, after) {
  const dlg = document.getElementById('dlg');
  const finish = async () => { dlg.close(); if (after) after(); else render(); };
  const q = (s.qty && /^\d+$/.test(String(s.qty))) ? String(s.qty) : '1';
  dlg.innerHTML = `<div class="eyebrow">Bought it?</div><h1 style="margin:6px 0 10px">${esc(s.name)}</h1>
    <p class="note" style="margin:0 0 14px">Add it to your pantry so it's tracked — expiry is estimated for you.</p>
    <label><span class="lbl">Shelf</span><select id="cloc">${S.household.locations.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
    <label><span class="lbl">How many</span><input type="number" id="cqty" value="${q}" min="1"></label>
    <button class="btn cold" data-a="pantry">✓ Add to pantry</button>
    <button class="btn ghost" data-a="just" style="margin-top:8px">Just check it off</button>
    <button class="btn ghost" data-a="miss" style="margin-top:8px">🚫&nbsp;&nbsp;They didn't have it</button>
    <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Cancel</button>`;
  dlg.querySelector('#cloc').value = s.lastLoc || catalogFind(s.name)?.lastLoc || defaultLoc(guessCat(s.name));
  dlg.querySelector('[data-a=pantry]').onclick = async () => {
    await addItem({ name: s.name, cat: s.cat || guessCat(s.name), loc: dlg.querySelector('#cloc').value,
      qty: parseInt(dlg.querySelector('#cqty').value) || 1, image: s.image || null, store: s.store || '' });
    s.done = true; s.missing = false; s.doneAt = Date.now(); await saveShopping(s);
    finish(); toast(`${s.name} added to your pantry`);
  };
  dlg.querySelector('[data-a=just]').onclick = async () => {
    // Bought but not shelved — still a purchase, still worth remembering,
    // still tagged with the store it came from.
    await recordCatalog({ name: s.name, cat: s.cat || guessCat(s.name), image: s.image || null }, { store: s.store || '' });
    s.done = true; s.missing = false; s.doneAt = Date.now(); await saveShopping(s);
    finish();
  };
  dlg.querySelector('[data-a=miss]').onclick = async () => {
    // Out of stock at the shop. Off the active list so you stop looking for
    // it, but flagged in Completed — and deliberately NOT recorded as a buy.
    s.done = true; s.missing = true; s.doneAt = Date.now(); await saveShopping(s);
    finish(); toast(`Marked — ${storeName(s.store) || 'the store'} didn't have it`);
  };
  dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
  dlg.showModal();
}

async function addItem({ name, cat, loc, qty = 1, barcode = null, packSize = null, brand = '', image = null, expires = null, dateConfirmed = false, store = '' }) {
  const mode = packSize ? 'pack' : unitModeFor(cat);
  const it = {
    id: uid(), name, brand, cat, loc, barcode, image,
    mode,
    qty: mode === 'level' ? null : qty,
    level: mode === 'level' ? 4 : null,
    packSize, unitsLeft: packSize || null,
    opened: false, added: today(),
    expires: expires || estimateExpiry(cat, loc, false),
    dateConfirmed: !!expires || dateConfirmed,   // real printed date -> trusted, not a guess
    by: S.who?.name || '?', deleted: false,
  };
  await saveItem(it);
  await logAction('add', name);
  // Everything that enters the house enters the household's memory, so the
  // next restock can start from "what we actually buy" instead of a blank box.
  await recordCatalog({ name, brand, cat, image, packSize, barcode }, { store, loc });
  if (it.dateConfirmed) learnFromDate(it);   // a real printed date was read at add time
  return it;
}

/* Depletion, the make-or-break. Every path funnels here. */
async function deplete(it, why = 'used') {
  const before = JSON.parse(JSON.stringify(it));
  const undo = async () => { await saveItem(before); };
  if (it.mode === 'level') {
    it.level = Math.max(0, it.level - 1);
    if (it.level === 0) it.deleted = true;
  } else if (it.mode === 'pack') {
    it.unitsLeft = Math.max(0, (it.unitsLeft ?? it.packSize) - 1);
    if (it.unitsLeft === 0) { it.qty -= 1; it.unitsLeft = it.qty > 0 ? it.packSize : 0; }
    if (it.qty <= 0) it.deleted = true;
  } else {
    it.qty -= 1;
    if (it.qty <= 0) it.deleted = true;
  }
  await saveItem(it);
  await logAction(why, it.name);
  toast(`${it.name} — ${it.deleted ? 'all gone' : 'one less'}`, undo);
  return undo;
}

async function markOpened(it) {
  const before = JSON.parse(JSON.stringify(it));
  it.opened = true;
  it.expires = Math.min(it.expires, estimateExpiry(it.cat, it.loc, true));
  await saveItem(it);
  toast(`Opened — clock reset to ${fmtDate(it.expires).replace('EXP ', '')}`, async () => { await saveItem(before); });
}

/* The waste log. The only feature here that saves money instead of
   just organising. Six months of this and you know exactly which
   good intentions you keep throwing away. */
async function tossItem(it) {
  const before = JSON.parse(JSON.stringify(it));
  it.deleted = true; it.wasted = true; it.wastedAt = Date.now();
  await saveItem(it);
  await logAction('wasted', it.name);
  toast(`${it.name} logged as wasted`, async () => { await saveItem(before); });
}

/* ---------------- lookups ---------------- */
async function lookupBarcode(code) {
  const mine = S.catalog.find(c => c.id === code);
  if (mine) return { ...mine, source: 'yours' };
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,categories_tags,quantity,image_front_small_url,image_small_url,image_thumb_url`, { signal: AbortSignal.timeout(6000) });
    const j = await r.json();
    if (j.status === 1 && j.product?.product_name) {
      return { id: code, name: j.product.product_name, brand: (j.product.brands || '').split(',')[0].trim(),
               cat: mapCat((j.product.categories_tags || []).join(' ')),
               image: j.product.image_front_small_url || j.product.image_small_url || j.product.image_thumb_url || null,
               source: 'off' };
    }
  } catch (e) { /* offline or miss — fall through to the ask-once path */ }
  return null;
}

/* Barcode path into the same catalog every other path writes to. Keyed by
   the barcode itself, which is the one truly authoritative id we ever get. */
async function learnProduct(p) {
  return recordCatalog({ ...p, id: p.id, kind: CAT_PRODUCT }, { loc: p.lastLoc || '', bump: false });
}

/* ---------------- AI ----------------
   No model name is hardcoded — Google keeps killing free models (2.0-flash
   went to limit:0). We ask the key what it can do and pick the newest live
   one. Provider-agnostic: Gemini natively, or any OpenAI-compatible endpoint
   (OpenRouter's free models are the no-Google fallback). Same gen(parts,
   schema) signature everywhere; only the internals branch. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* "gemini-3-flash" -> 3, "gemini-2.5-flash" -> 2.5, "gemini-1.5-flash" -> 1.5.
   Newer families dropped the minor version, so a plain \d+\.\d+ match scored
   them 0 and sorted the NEWEST model dead last — which is how this app kept
   defaulting to a discontinued model with no free quota. */
const verNum = id => {
  const m = String(id).match(/gemini-(\d+)(?:[.-](\d+))?/i) || String(id).match(/(\d+)(?:\.(\d+))?/);
  return m ? parseFloat(m[1]) + (m[2] ? parseFloat('0.' + m[2]) : 0) : 0;
};
const retryDelayMs = msg => { const m = String(msg).match(/retry in ([\d.]+)\s*s/i) || String(msg).match(/retryDelay["'\s:=]+([\d.]+)s/i); return m ? Math.ceil(parseFloat(m[1]) * 1000) : null; };
const onlyJson = t => { const s = t.indexOf('{'), a = t.indexOf('['); const st = s < 0 ? a : (a < 0 ? s : Math.min(s, a)); if (st < 0) return t; const e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']')); return e > st ? t.slice(st, e + 1) : t.slice(st); };

const G = {
  provider: () => S.cfg.aiProvider || 'gemini',
  key: () => (G.provider() === 'openai' ? S.cfg.openaiKey : S.cfg.geminiKey) || '',
  model: () => (G.provider() === 'openai' ? S.cfg.openaiModel : S.cfg.geminiModel) || '',
  base: () => (S.cfg.openaiBase || 'https://openrouter.ai/api/v1').replace(/\/+$/, ''),
  setModel: async id => { if (G.provider() === 'openai') S.cfg.openaiModel = id; else S.cfg.geminiModel = id; await saveCfg(); },
  /* known-dead / not-free Gemini models to never auto-pick */
  _dead: id => /gemini-(2\.0-flash|1\.5|1\.0)|-exp-|deprecated|-tuning/i.test(String(id)),

  async models() {
    if (G.provider() === 'openai') {
      const r = await fetch(`${G.base()}/models`, { headers: { Authorization: `Bearer ${G.key()}` } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || `Key rejected (HTTP ${r.status})`);
      return ((await r.json()).data || []).map(m => ({ id: m.id, label: m.id }));
    }
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${G.key()}`);
    if (!r.ok) throw new Error((await r.json()).error?.message || 'Key rejected');
    return (await r.json()).models
      .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
      .filter(m => !/embedding|aqa|imagen|veo/i.test(m.name))
      .map(m => ({ id: m.name.replace('models/', ''), label: m.displayName }));
  },

  /* "limit: 0" means the model exists but grants this key no free quota —
     discontinued, or paid-tier only. It reads like "you're out of tokens",
     but nothing was ever spent. Worth saying plainly in the UI. */
  _zeroQuota: msg => /limit:?\s*0\b|quota_limit_value["'\s:]*["']?0\b/i.test(String(msg)),

  /* Ranked shortlist, best first. Flash carries the free vision tier; Flash-Lite
     is the fallback (lower quality, but the most generous daily allowance). */
  candidates(models) {
    if (G.provider() === 'openai') {
      const free = models.filter(m => /:free/i.test(m.id));
      const vis = free.filter(m => /(vision|-vl|gemini|llava|qwen.*vl|llama.*(vision|scout|maverick)|pixtral|gemma)/i.test(m.id));
      return [...vis, ...free.filter(m => !vis.includes(m)), ...models.filter(m => !free.includes(m))].map(m => m.id);
    }
    const live = models.filter(m => !G._dead(m.id) && !/image|preview|thinking|8b|embedding/i.test(m.id));
    const newest = a => a.sort((x, y) => verNum(y.id) - verNum(x.id));
    const flash = newest(live.filter(m => /flash/i.test(m.id) && !/lite/i.test(m.id)));
    const lite = newest(live.filter(m => /flash/i.test(m.id) && /lite/i.test(m.id)));
    const rest = newest(live.filter(m => !/flash/i.test(m.id)));
    return [...flash, ...lite, ...rest].map(m => m.id);
  },

  pick(models) { return G.candidates(models)[0]; },

  /* The only way to know a model really works is to spend one tiny call on it.
     A model can sit in the /models list and still answer "limit: 0". Better to
     find that out here, in Settings, than halfway through scanning a receipt. */
  async probe(id) {
    try {
      let r;
      if (G.provider() === 'openai') {
        r = await fetch(`${G.base()}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${G.key()}`, 'HTTP-Referer': location.origin, 'X-Title': 'ShelfLife' },
          body: JSON.stringify({ model: id, messages: [{ role: 'user', content: 'hi' }], max_tokens: 1 }),
        });
      } else {
        r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${id}:generateContent?key=${G.key()}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: 'hi' }] }], generationConfig: { maxOutputTokens: 1 } }),
        });
      }
      if (r.ok) return { ok: true };
      const j = await r.json().catch(() => ({}));
      const msg = j.error?.message || `HTTP ${r.status}`;
      return { ok: false, msg, status: r.status, zero: G._zeroQuota(msg) };
    } catch (e) { return { ok: false, msg: e.message || 'network error' }; }
  },

  /* Walk the shortlist, one tiny call each, and settle on the first model that
     actually answers. This is what makes "it hit the limit before I sent
     anything" impossible to reach by accident. */
  async pickWorking(models, onStep) {
    const list = G.candidates(models).slice(0, 6);
    if (!list.length) throw new Error('This key returned no usable models.');
    let last = '';
    for (const id of list) {
      if (onStep) onStep(id);
      const r = await G.probe(id);
      if (r.ok) return id;
      last = r.zero ? `${id} gives this key no free quota.` : r.msg;
    }
    throw new Error(last || 'No model on this key answered.');
  },

  /* Heal a missing or known-dead saved model at boot, with no user action.
     Only fires when the app is already broken, so the probe calls are the cost
     of un-breaking someone rather than a tax on every launch. Once per load. */
  _healed: false,
  async ensureModel() {
    if (G._healed || !G.key()) return;
    if (G.model() && !(G.provider() === 'gemini' && G._dead(G.model()))) return;
    G._healed = true;
    try { const id = await G.pickWorking(await G.models()); if (id) await G.setModel(id); } catch (e) {}
  },

  async gen(parts, jsonSchema) {
    if (!G.key()) throw new Error(`No API key. Setup → paste your ${G.provider() === 'openai' ? 'OpenRouter' : 'Gemini'} key.`);
    if (!G.model()) throw new Error('No model chosen. Setup → Fetch models, pick one.');
    return G.provider() === 'openai' ? G._openai(parts, jsonSchema) : G._gemini(parts, jsonSchema);
  },

  async _fetchRetry(call, tries = 2) {
    for (let i = 0; ; i++) {
      const r = await call();
      if (r.ok) return r.json();
      let j = {}; try { j = await r.json(); } catch (e) {}
      const msg = j.error?.message || `HTTP ${r.status}`;
      if (r.status === 429 && i < tries) {
        const wait = retryDelayMs(msg);
        if (wait && wait <= 6000) { await sleep(wait + 300); continue; }
      }
      if (r.status === 429) {
        // "limit: 0" is not "slow down" — it's "this model will never work on
        // this key". Sending someone off to wait out a cooldown that doesn't
        // exist is how you convince them their free key is worthless.
        if (G._zeroQuota(msg)) throw new Error(
          `${G.model()} gives your key no free quota — it's discontinued or paid-only. Nothing of yours was used up.\n\nSettings → "Check my key & find a model that works".`);
        throw new Error(msg + "\n\nThat's your real daily free quota, now spent. It resets on Google's clock — or Settings → switch model.");
      }
      throw new Error(msg);
    }
  },

  async _gemini(parts, jsonSchema) {
    const body = { contents: [{ parts }] };
    if (jsonSchema) body.generationConfig = { responseMimeType: 'application/json', responseSchema: jsonSchema };
    const j = await G._fetchRetry(() => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${G.model()}:generateContent?key=${G.key()}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }));
    const t = j.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!t) throw new Error('Empty response');
    return jsonSchema ? JSON.parse(t) : t;
  },

  async _openai(parts, jsonSchema) {
    const content = parts.map(p => p.text != null
      ? { type: 'text', text: p.text }
      : { type: 'image_url', image_url: { url: `data:${p.inline_data.mime_type};base64,${p.inline_data.data}` } });
    if (jsonSchema) content.push({ type: 'text', text: 'Respond with ONLY valid minified JSON — no prose, no code fences.' });
    const body = { model: G.model(), messages: [{ role: 'user', content }] };
    if (jsonSchema) body.response_format = { type: 'json_object' };
    const j = await G._fetchRetry(() => fetch(`${G.base()}/chat/completions`,
      { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${G.key()}`, 'HTTP-Referer': location.origin, 'X-Title': 'ShelfLife' }, body: JSON.stringify(body) }));
    const t = j.choices?.[0]?.message?.content;
    if (!t) throw new Error('Empty response');
    return jsonSchema ? JSON.parse(onlyJson(t)) : t;
  },
};

/* ---------------- family cloud sync (Supabase) ----------------
   Local IndexedDB stays the source of truth (works offline). On every
   write we upsert the record to a shared `sync` table keyed by a household
   code; on boot we pull + merge (last-write-wins by updatedAt) and
   subscribe to realtime changes. Nothing here runs until the household
   sets up their own free Supabase project. Keys/cfg stay device-local. */
let supaLoading = null;
function loadSupabase() {
  if (window.supabase) return Promise.resolve();
  if (supaLoading) return supaLoading;
  supaLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'supabase.min.js';
    s.onload = () => res(); s.onerror = () => { supaLoading = null; rej(new Error('sync-load-failed')); };
    document.head.appendChild(s);
  });
  return supaLoading;
}

const SYNC = {
  cli: null, chan: null,
  configured: () => !!(S.cfg.supaUrl && S.cfg.supaKey && S.cfg.householdCode),
  on: () => SYNC.configured() && !!window.supabase,
  code: () => S.cfg.householdCode,
  client() {
    if (!this.cli && S.cfg.supaUrl && S.cfg.supaKey && window.supabase)
      this.cli = window.supabase.createClient(S.cfg.supaUrl, S.cfg.supaKey, { auth: { persistSession: false } });
    return this.cli;
  },
  row(store, id, data) {
    return { household: SYNC.code(), store, id, data,
      updated_at: new Date(data?.updatedAt || Date.now()).toISOString(),
      deleted: !!(data && data.deleted && store === 'catalog') };
  },
  async push(store, id, data) {
    if (!SYNC.on()) return;
    const row = SYNC.row(store, id, data);
    try { const { error } = await SYNC.client().from('sync').upsert(row, { onConflict: 'household,store,id' }); if (error) throw error; }
    catch (e) { SYNC.queue(row); }
  },
  queue(row) {
    const q = S.cfg._syncq || (S.cfg._syncq = []);
    q.push(row); if (q.length > 800) q.splice(0, q.length - 800);
    saveCfg();
  },
  async flush() {
    if (!SYNC.on() || !(S.cfg._syncq || []).length) return;
    const q = S.cfg._syncq; S.cfg._syncq = []; await saveCfg();
    for (const row of q) { try { await SYNC.client().from('sync').upsert(row, { onConflict: 'household,store,id' }); } catch (e) { SYNC.queue(row); } }
  },
  /* apply a remote row locally, last-write-wins. Never calls saveItem/push
     (no echo loop) — writes straight to DB + S. */
  applyRow(r) {
    if (!r || !r.store) return;
    const ts = r.data?.updatedAt || Date.parse(r.updated_at) || 0;
    if (r.store === 'items') {
      const i = S.items.findIndex(x => x.id === r.id);
      if (i > -1 && (S.items[i].updatedAt || 0) >= ts) return;
      DB.put('items', r.data); if (i > -1) S.items[i] = r.data; else S.items.push(r.data);
    } else if (r.store === 'catalog') {
      const i = S.catalog.findIndex(x => x.id === r.id);
      if (r.deleted) { if (i > -1) { S.catalog.splice(i, 1); DB.del('catalog', r.id); } return; }
      if (i > -1 && (S.catalog[i].updatedAt || 0) >= ts) return;
      DB.put('catalog', r.data); if (i > -1) S.catalog[i] = r.data; else S.catalog.push(r.data);
    } else if (r.store === 'shopping') {
      const i = S.shopping.findIndex(x => x.id === r.id);
      if (i > -1 && (S.shopping[i].updatedAt || 0) >= ts) return;
      DB.put('shopping', r.data); if (i > -1) S.shopping[i] = r.data; else S.shopping.push(r.data);
    } else if (r.store === 'plan') {
      const i = S.plan.findIndex(x => x.id === r.id);
      if (r.deleted || r.data?.deleted) { if (i > -1) { S.plan.splice(i, 1); DB.del('plan', r.id); } return; }
      if (i > -1 && (S.plan[i].updatedAt || 0) >= ts) return;
      DB.put('plan', r.data); if (i > -1) S.plan[i] = r.data; else S.plan.push(r.data);
    } else if (r.store === 'saved') {
      const i = S.saved.findIndex(x => x.id === r.id);
      if (r.deleted || r.data?.deleted) { if (i > -1) { S.saved.splice(i, 1); DB.del('saved', r.id); } return; }
      if (i > -1 && (S.saved[i].updatedAt || 0) >= ts) return;
      DB.put('saved', r.data); if (i > -1) S.saved[i] = r.data; else S.saved.push(r.data);
    } else if (r.store === 'meta' && r.id === 'household') {
      if ((S.household?.updatedAt || 0) >= ts) return;
      S.household = r.data; DB.put('meta', r.data);
    }
  },
  async pull() {
    if (!SYNC.on()) return;
    try {
      const { data, error } = await SYNC.client().from('sync').select('*').eq('household', SYNC.code());
      if (error) throw error;
      (data || []).forEach(r => SYNC.applyRow(r));
      render();
    } catch (e) {}
  },
  subscribe() {
    if (!SYNC.on() || SYNC.chan) return;
    try {
      SYNC.chan = SYNC.client()
        .channel('cr-' + SYNC.code())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sync', filter: `household=eq.${SYNC.code()}` },
          p => { if (p.new && p.new.store) { SYNC.applyRow(p.new); render(); } })
        .subscribe();
    } catch (e) {}
  },
  async start() {
    if (!SYNC.configured()) return;
    try { await loadSupabase(); } catch (e) { return; }
    await SYNC.flush(); await SYNC.pull(); SYNC.subscribe();
  },
  /* push everything local up when first joining/creating a household */
  async pushAll() {
    if (!SYNC.on()) return;
    for (const it of S.items) await SYNC.push('items', it.id, it);
    for (const c of S.catalog) await SYNC.push('catalog', c.id, c);
    for (const s of S.shopping) await SYNC.push('shopping', s.id, s);
    for (const m of S.plan) await SYNC.push('plan', m.id, m);
    for (const rec of S.saved) await SYNC.push('saved', rec.id, rec);
    if (S.household) await SYNC.push('meta', 'household', S.household);
  },
};
if (typeof window !== 'undefined') window.addEventListener('online', () => SYNC.flush());

/* ---------------- push notifications (free, via the family's Edge Function) ----
   Any open app can trigger a family-wide ping (no server cron needed):
   whoever opens ShelfLife and sees something dying notifies the other
   phones. Advanced/optional — needs the notify function deployed once. */
function urlB64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s), arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
const PUSH = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  fnUrl: () => S.cfg.supaUrl ? S.cfg.supaUrl.replace(/\/+$/, '') + '/functions/v1/notify' : '',
  deviceId() { if (!S.cfg.deviceId) { S.cfg.deviceId = uid() + uid(); saveCfg(); } return S.cfg.deviceId; },
  async enable() {
    if (!PUSH.supported()) throw new Error("This device doesn't support web push.");
    if (!SYNC.on()) throw new Error('Turn on Family sync first.');
    if (!S.cfg.vapidPublic) throw new Error('Paste your VAPID public key first.');
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('Notifications were blocked.');
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(S.cfg.vapidPublic) });
    await SYNC.client().from('sync').upsert({ household: SYNC.code(), store: 'push', id: PUSH.deviceId(), data: sub.toJSON(), updated_at: new Date().toISOString(), deleted: false }, { onConflict: 'household,store,id' });
    S.cfg.pushOn = true; await saveCfg();
  },
  async disable() {
    try { const s = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch (e) {}
    try { if (SYNC.on()) await SYNC.client().from('sync').update({ deleted: true }).match({ household: SYNC.code(), store: 'push', id: PUSH.deviceId() }); } catch (e) {}
    S.cfg.pushOn = false; await saveCfg();
  },
  async notifyFamily(title, body, tag) {
    if (!SYNC.on() || !PUSH.fnUrl()) return;
    try {
      await fetch(PUSH.fnUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.cfg.supaKey, apikey: S.cfg.supaKey },
        body: JSON.stringify({ household: SYNC.code(), title, body, tag }) });
    } catch (e) {}
  },
  async dailyCheck() {
    if (!SYNC.on() || !S.cfg.pushOn) return;
    const key = new Date().toISOString().slice(0, 10);
    if (S.cfg.lastNotify === key) return;
    const dying = S.items.filter(i => !i.deleted && freshness(i).left <= 2);
    if (!dying.length) return;
    S.cfg.lastNotify = key; await saveCfg();
    const names = [...new Set(dying.map(i => i.name))].slice(0, 3).join(', ');
    await PUSH.notifyFamily('Eat me first', `${dying.length} item${dying.length > 1 ? 's' : ''} dying: ${names}`, 'expiring');
  },
};

/* THE KEY INSIGHT: this is not open-ended food recognition.
   We hand the model your actual inventory and ask "which of these
   do you see?" — constrained matching, not identification.
   Failure mode becomes "picked the wrong onion", not "hallucinated a mango". */
async function visionMatch(b64, mime, mode) {
  const live = S.items.filter(i => !i.deleted);
  const known = live.map(i => `${i.id}|${i.name}${i.brand ? ' (' + i.brand + ')' : ''}`).join('\n');
  const prompt = mode === 'deplete'
    ? `These are ingredients laid out on a counter, about to be cooked.\n\nMy inventory (id|name):\n${known}\n\nReturn ONLY items you can actually see. Match to inventory ids where possible. If you see something not in my inventory, set id to null and give the name. Estimate visible count.`
    : `Identify the food items in this photo (groceries just brought home).\n\nMy existing inventory, for matching known products:\n${known}\n\nFor anything new, name it plainly ("Roma tomatoes", "Ground beef 1lb") and pick the best category from:\n${CATS.join(', ')}\n\nCount what you see.\n\nIf a printed expiration / "best by" / "use by" / "sell by" date is clearly legible on an item, read it and return it in "expiry" as YYYY-MM-DD. If you can't read a date for an item, omit "expiry" — do NOT guess one.`;
  const schema = { type: 'OBJECT', properties: { found: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    id: { type: 'STRING' }, name: { type: 'STRING' }, cat: { type: 'STRING' }, count: { type: 'INTEGER' }, expiry: { type: 'STRING' }
  }, required: ['name', 'count'] } } }, required: ['found'] };
  const out = await G.gen([{ text: prompt }, { inline_data: { mime_type: mime, data: b64 } }], schema);
  return out.found || [];
}

/* Receipt import — the whole shopping trip in ONE model call, which is the
   most quota-friendly way to bulk-add. Expand the cryptic receipt shorthand
   into readable names and tag a category (which is what auto-sets the
   expiry date downstream — no dates ever get typed or photographed). */
async function visionReceipt(b64, mime) {
  const prompt = `You are reading a photo of a grocery store receipt. Work top to bottom, ONE LINE AT A TIME, and extract every food/grocery PRODUCT line.

READING RULES:
- Each product line usually has an item description on the left and a price on the right. Use the price column to tell where one item ends and the next begins.
- Expand receipt shorthand into clear, real product names: "KS ORG WHL MLK" -> "Kirkland Organic Whole Milk", "BNLS CHKN BRST" -> "Boneless Chicken Breast", "GRND BF 93/7" -> "Ground Beef 93/7", "BANANA" -> "Bananas".
- Quantity: if a line shows "2 @ 3.99" or "QTY 3" or a leading count, use that number; otherwise 1. Weighted items (e.g. "0.94 LB") are quantity 1.
- If unsure of a faint character, choose the most likely real grocery product; do not invent items that aren't there.

IGNORE everything that is not a purchasable food/household product: store name/address/phone, date/time, cashier, register, member/account number, subtotal, tax, total, balance, tender, change, cash, credit/debit, card digits, AID/auth, savings, coupons, discounts, loyalty points, and bag/bottle fees.

For each product pick the best category from this list (use "other" if unsure):
${CATS.join(', ')}

If a printed expiration or "best by" date appears for an item, return it in "expiry" as YYYY-MM-DD; otherwise omit it (never guess a date).`;
  const schema = { type: 'OBJECT', properties: { found: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    name: { type: 'STRING' }, cat: { type: 'STRING' }, count: { type: 'INTEGER' }, expiry: { type: 'STRING' }
  }, required: ['name', 'cat'] } } }, required: ['found'] };
  const out = await G.gen([{ text: prompt }, { inline_data: { mime_type: mime, data: b64 } }], schema);
  return out.found || [];
}

async function suggestRecipes() {
  const live = S.items.filter(i => !i.deleted);
  const staples = S.household.staples || [];
  const h = S.household;
  const soon = live.filter(i => freshness(i).left <= 5 && freshness(i).left >= -1);
  const prompt = `You are planning dinner from what's actually in this kitchen right now.

INVENTORY:
${live.map(i => `- ${i.name}${i.brand ? ' (' + i.brand + ')' : ''} [${locName(i.loc)}]`).join('\n')}

ASSUME UNLIMITED (do not ever list these as missing):
${staples.join(', ') || 'salt, pepper, cooking oil, water'}

USE THESE UP FIRST — expiring within days:
${soon.map(i => `- ${i.name} (${freshness(i).label})`).join('\n') || '(nothing urgent)'}

HOUSEHOLD: ${h.people} people${h.allergies?.length ? `. HARD ALLERGIES, never include: ${h.allergies.join(', ')}` : ''}${h.dislikes?.length ? `. Dislikes: ${h.dislikes.join(', ')}` : ''}${h.cookStyle ? `. Weeknight reality: ${h.cookStyle}` : ''}

Give 5 real recipes, ranked: zero-missing first, and among those, whatever burns down the expiring list hardest. Include 1-2 that need just one or two extra items if they're notably better. "missing" = things NOT in inventory and NOT staples. Keep steps terse.`;
  const schema = { type: 'OBJECT', properties: { recipes: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    name: { type: 'STRING' }, minutes: { type: 'INTEGER' },
    uses: { type: 'ARRAY', items: { type: 'STRING' } },
    missing: { type: 'ARRAY', items: { type: 'STRING' } },
    rescues: { type: 'ARRAY', items: { type: 'STRING' } },
    steps: { type: 'ARRAY', items: { type: 'STRING' } }
  }, required: ['name', 'minutes', 'uses', 'missing', 'steps'] } } }, required: ['recipes'] };
  const out = await G.gen([{ text: prompt }], schema);
  const recipes = out.recipes || [];
  // real dish photos, best-effort (free, no key) — never block the recipes on it
  await Promise.all(recipes.map(async r => { try { r.image = await PHOTO.dish(r.name, (r.uses || [])[0]); } catch (e) {} }));
  return recipes;
}

/* Real product & dish photos, from free no-key sources. Open Food Facts for
   groceries, TheMealDB for cooked dishes. Everything degrades to the food
   emoji when offline or unmatched, and the service worker caches the images
   so they still show in the basement. */
const PHOTO = {
  _mem: new Map(),
  async food(name) {
    const key = String(name || '').toLowerCase().trim();
    if (!key) return null;
    if (PHOTO._mem.has('f:' + key)) return PHOTO._mem.get('f:' + key);
    let url = null;
    try {
      const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(name)}&search_simple=1&json=1&page_size=1&fields=image_front_small_url,image_small_url`, { signal: AbortSignal.timeout(5000) });
      const j = await r.json();
      const p = j.products && j.products[0];
      url = (p && (p.image_front_small_url || p.image_small_url)) || null;
    } catch (e) {}
    PHOTO._mem.set('f:' + key, url);
    return url;
  },
  async dish(name, ingredient) {
    try {
      const r = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(name)}`, { signal: AbortSignal.timeout(5000) });
      const j = await r.json();
      if (j.meals && j.meals[0] && j.meals[0].strMealThumb) return j.meals[0].strMealThumb;
    } catch (e) {}
    if (ingredient) {
      try {
        const r = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${encodeURIComponent(String(ingredient).split(' ')[0])}`, { signal: AbortSignal.timeout(5000) });
        const j = await r.json();
        if (j.meals && j.meals[0] && j.meals[0].strMealThumb) return j.meals[0].strMealThumb;
      } catch (e) {}
    }
    return null;
  },
};

/* Quietly give real photos to pantry items that don't have one yet. Opt-out
   via Settings (it does send item names to Open Food Facts). Runs a few at a
   time, remembers what it tried, and never re-fetches. */
let _enriching = false;
async function enrichItemPhotos() {
  if (_enriching || S.cfg.autoPhotos === false || !navigator.onLine) return;
  const todo = S.items.filter(i => !i.deleted && !i.image && !i.photoTried).slice(0, 6);
  if (!todo.length) return;
  _enriching = true;
  let changed = false;
  for (const it of todo) {
    const url = await PHOTO.food(it.brand ? `${it.brand} ${it.name}` : it.name);
    const cur = S.items.find(x => x.id === it.id);
    if (!cur || cur.deleted) continue;
    cur.photoTried = true;
    if (url) { cur.image = url; changed = true; }
    await saveItem(cur);
  }
  _enriching = false;
  if (changed && (S.view === 'pantry' || S.view === 'inv')) render();
}

/* Fill in catalog photos the same quiet way pantry items get them. A history
   you can't recognise at a glance is just a list of words. */
let _catEnriching = false;
async function enrichCatalogPhotos() {
  if (_catEnriching || S.cfg.autoPhotos === false || !navigator.onLine) return;
  const todo = S.catalog.filter(c => !c.deleted && c.name && !c.image && !c.photoTried).slice(0, 6);
  if (!todo.length) return;
  _catEnriching = true;
  let changed = false;
  for (const c of todo) {
    const url = catKind(c) === CAT_MEAL
      ? await PHOTO.dish(c.name)
      : await PHOTO.food(c.brand ? `${c.brand} ${c.name}` : c.name);
    const cur = S.catalog.find(x => x.id === c.id);
    if (!cur) continue;
    cur.photoTried = true;
    if (url) { cur.image = url; changed = true; }
    await DB.put('catalog', cur);
  }
  _catEnriching = false;
  if (changed && ['shop', 'plan', 'pantry', 'cat'].includes(S.view)) render();
}

/* A camera shot is ~4MB; it lands in IndexedDB and syncs to every phone in
   the house. Scale it down hard — nobody needs 12 megapixels to recognise a
   jar of sauce, and the storage is shared. */
function photoURL(file, max = 480) {
  return new Promise(res => {
    const img = new Image();
    const done = v => { try { URL.revokeObjectURL(img.src); } catch (e) {} res(v); };
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * s));
      cv.height = Math.max(1, Math.round(img.height * s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      done(cv.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => done(null);
    img.src = URL.createObjectURL(file);
  });
}

/* Attach your own photo to a catalog record. Because every surface reads the
   same record, a photo set once shows up in Plan, Shop and Pantry at once. */
function pickPhoto(rec, after) {
  const inp = el(`<input type="file" accept="image/*" class="hide">`);
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const url = await photoURL(f);
    if (!url) return toast('Could not read that image');
    await recordCatalog({ id: rec.id, name: rec.name, kind: catKind(rec), image: url }, { bump: false });
    toast('Photo saved');
    if (after) after(url); else render();
  };
  inp.click();
}

/* ---- the tile component ----
   `meta` and `badge` are raw HTML so callers can drop a .tag pill in; `name`
   is always escaped. Every part is optional, so one component covers the
   shopping checklist, the meal picker and the pantry grid without forking. */
function tileEl({ name, meta = '', image = null, emoji = '🍽️', badge = '', checked = false,
                  checkLabel = '', onCheck = null, onTap = null, stick = false, stickLabel = 'Added ✓',
                  onCorner = null, cornerIcon = '×', cornerLabel = 'Remove', sel = false }) {
  const t = el(`<div class="tile${checked ? ' done' : ''}${sel ? ' sel' : ''}">
    <div class="tt"><div class="tn">${esc(name)}</div>${meta ? `<div class="tm">${meta}</div>` : ''}</div>
    <div class="tp">${image
      ? `<img loading="lazy" alt="" src="${esc(image)}" onerror="this.remove()">`
      : `<span class="emoji">${emoji}</span>`}
      ${badge ? `<span class="tb">${badge}</span>` : ''}
      ${onCorner ? `<button class="tx" data-a="rm" aria-label="${esc(cornerLabel)} ${esc(name)}">${cornerIcon}</button>` : ''}</div>
    ${onCheck ? `<button class="tc" data-a="chk"><span class="box">${checked ? '✓' : ''}</span><span class="lb">${esc(checkLabel || (checked ? 'Got it' : 'Check off'))}</span></button>` : ''}
  </div>`);
  if (onTap) {
    t.querySelector('.tt').onclick = onTap;
    t.querySelector('.tp').onclick = onTap;
    t.querySelector('.tt').style.cursor = t.querySelector('.tp').style.cursor = 'pointer';
  }
  const rm = t.querySelector('[data-a=rm]');
  if (rm) rm.onclick = e => { e.stopPropagation(); onCorner(); };
  const ck = t.querySelector('[data-a=chk]');
  if (ck) ck.onclick = async e => {
    e.stopPropagation();
    if (t.dataset.busy) return;                     // double-tap guard
    t.dataset.busy = '1';
    try {
      await onCheck();
      // Confirm it optimistically and STAY confirmed. Repainting the list out
      // from under the finger is why adding felt like nothing happened.
      if (stick) {
        t.classList.add('got');
        const box = ck.querySelector('.box');
        box.textContent = '✓';
        box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
        ck.querySelector('.lb').textContent = stickLabel;
      }
    } finally { delete t.dataset.busy; }
  };
  return t;
}

/* Upload / change a photo. Downscaled to a small JPEG data-URL so 500 of
   them stay tiny in storage and always show offline. */
function downscaleImage(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      try { res(cv.toDataURL('image/jpeg', 0.82)); } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); rej(new Error('Could not read that image')); };
    img.src = URL.createObjectURL(file);
  });
}
/* Receipt pre-processing — this is what makes the reader accurate. Phone
   photos of thermal receipts are big, low-contrast and slightly skewed. We
   scale to a legible size, convert to grayscale and stretch the contrast so
   faint ink becomes crisp black-on-white before the model ever sees it. */
function prepReceipt(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      try {
        const im = ctx.getImageData(0, 0, w, h), d = im.data;
        // 1st pass: grayscale + gather luminance range
        let lo = 255, hi = 0;
        for (let i = 0; i < d.length; i += 4) {
          const g = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) | 0;
          d[i] = d[i + 1] = d[i + 2] = g;
          if (g < lo) lo = g; if (g > hi) hi = g;
        }
        // 2nd pass: contrast stretch (ignore the extreme 2% so specular dots don't skew it)
        const span = Math.max(1, (hi - lo) * 0.96);
        const off = lo + (hi - lo) * 0.02;
        for (let i = 0; i < d.length; i += 4) {
          let v = ((d[i] - off) / span) * 255;
          v = v < 0 ? 0 : v > 255 ? 255 : v;
          d[i] = d[i + 1] = d[i + 2] = v;
        }
        ctx.putImageData(im, 0, 0);
        res({ b64: cv.toDataURL('image/jpeg', 0.9).split(',')[1], mime: 'image/jpeg' });
      } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); rej(new Error('Could not read that image')); };
    img.src = URL.createObjectURL(file);
  });
}

/* The same item as a big tile: name and freshness above, photo below. The
   compact row above still exists behind a toggle — at 500 items a dense list
   genuinely beats a photo grid, so this is a preference, not a replacement. */
function itemTile(it) {
  const f = freshness(it);
  const cls = f.left < 0 ? 'out' : f.left <= 3 ? 'low' : 'have';
  const q = it.mode === 'level' ? LEVELS[it.level]
    : it.mode === 'pack' ? `${it.unitsLeft}/${it.packSize} left`
    : `×${it.qty}`;
  return tileEl({
    name: it.name,
    meta: `<span class="tag ${cls}">${esc(f.label)}</span>`,
    image: it.image, emoji: foodEmoji(it.name, it.cat) || '🍽️',
    badge: esc(q) + (it.opened ? ' · opened' : ''),
    onTap: () => itemSheet(it),
    checkLabel: 'Used one', onCheck: async () => { await deplete(it); render(); },
    onCorner: () => itemSheet(it), cornerIcon: '⋯', cornerLabel: 'Options for',
  });
}

/* Searching for something you don't currently have shouldn't dead-end. If
   you've bought it before, or cooked it before, say so and offer the one
   useful next step — the same typo-tolerant matcher, applied to history. */
function searchHistory(box, q, shown = []) {
  const already = new Set(shown.map(i => canon(i.name)));
  const seen = catalogList(CAT_PRODUCT, { q }).filter(c => !already.has(canon(c.name))).slice(0, 6);
  const meals = catalogList(CAT_MEAL, { q }).slice(0, 4);
  if (!seen.length && !meals.length) return;

  if (seen.length) {
    box.appendChild(el(`<div class="sect"><h3>You've bought this before</h3><span class="n">not in the house</span></div>`));
    const g = el(`<div class="tiles"></div>`);
    seen.forEach(c => g.appendChild(tileEl({
      name: c.name, meta: `${c.count || 0}× · ${esc(storeLabel(c))}`,
      image: c.image, emoji: foodEmoji(c.name, c.cat) || '🛒',
      checkLabel: 'Add to list', stick: true,
      onCheck: async () => { await addToList(c.name, '', S.store || ''); toast(`${c.name} on the list`); },
      onTap: () => restockSheet(c),
    })));
    box.appendChild(g);
  }
  if (meals.length) {
    box.appendChild(el(`<div class="sect"><h3>Meals you've made with this</h3></div>`));
    const g = el(`<div class="tiles"></div>`);
    meals.forEach(c => g.appendChild(tileEl({
      name: c.name, meta: `${c.count || 0}× made`,
      image: c.image, emoji: foodEmoji(c.name, '') || '🍽️',
      checkLabel: 'Plan it', onCheck: () => pickDayForRecipe({ name: c.name, image: c.image, missing: [], uses: [] }),
    })));
    box.appendChild(g);
  }
}

/* Honour the pantry's photos/compact preference in one place. */
function paintRows(box, rows) {
  if (S.cfg.pantryView === 'list') { rows.forEach(i => box.appendChild(itemRow(i))); return; }
  const g = el(`<div class="tiles"></div>`);
  rows.forEach(i => g.appendChild(itemTile(i)));
  box.appendChild(g);
}

/* The inverse of deplete — "I didn't mean to" and "we got more". Mirrors
   deplete's per-mode maths and brings a fully-gone item back to life. */
async function addOne(it) {
  const before = JSON.parse(JSON.stringify(it));
  if (it.mode === 'level') {
    it.level = Math.min(4, (it.level || 0) + 1);
  } else if (it.mode === 'pack') {
    it.unitsLeft = (it.unitsLeft ?? 0) + 1;
    if (it.packSize && it.unitsLeft > it.packSize) { it.qty = (it.qty || 0) + 1; it.unitsLeft = 1; }
    else if (!it.qty || it.qty < 1) it.qty = 1;
  } else {
    it.qty = (it.qty || 0) + 1;
  }
  it.deleted = false; it.wasted = false;
  await saveItem(it);
  await logAction('added one', it.name);
  toast(`${it.name} — one more`, async () => { await saveItem(before); });
}

/* Strategy C: your nose beats the guess. One tap pushes the date out and
   marks it confirmed, so it stops nagging you. */
async function extendItem(it, days) {
  const before = JSON.parse(JSON.stringify(it));
  it.expires = (it.expires || today()) + days * DAY;
  it.dateConfirmed = true;
  await saveItem(it);
  await logAction('still good', it.name);
  toast(`${it.name} — good to ${fmtDate(it.expires).replace('EXP ', '')}`, async () => { await saveItem(before); });
}

    <button class="btn ghost" data-a="close" style="margin-top:6px;border:none;color:var(--vapor)">Cancel</button>`;
  dlg.querySelectorAll('[data-l]').forEach(b => b.onclick = async () => {
    const before = JSON.parse(JSON.stringify(it));
    it.loc = b.dataset.l;

    toast(`Moved to ${locName(it.loc)} · ${fmtDate(it.expires).replace('EXP ','')}`, async () => { await saveItem(before); });
  });
  dlg.querySelector('[data-a=close]').onclick = () => dlg.close();

}

function dateSheet(it) {

    <p class="note" style="margin:0 0 14px">We guessed <b>${fmtDate(it.expires).replace('EXP ','')}</b> from the category and shelf. Only change it if you actually disagree.</p>

/* ---------------- view: inventory ---------------- */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

/* ---------------- smart search ----------------
   The things that make Google's search box feel smart, done locally so
   it's instant and offline: forgive typos (edit distance), ignore
   plurals (stemming), and understand common grocery synonyms
   ("pop"→soda, "scallions"→green onion, "aubergine"→eggplant). */
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// singular/plural + common endings so "tomatoes"=="tomato", "eggs"=="egg"
function stem(w) {
  if (w.length <= 3) return w;
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ves')) return w.slice(0, -3) + 'f';
  if (w.endsWith('oes')) return w.slice(0, -2);
  if (/(ches|shes|sses|xes|zes)$/.test(w)) return w.slice(0, -2);
  if (w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us') && !w.endsWith('is')) return w.slice(0, -1);
  return w;
}
// grocery synonyms — each group collapses to its first term
const SYN = [
  ['soda', 'pop', 'soft drink', 'cola'], ['scallion', 'green onion', 'spring onion'],
  ['cilantro', 'coriander'], ['eggplant', 'aubergine'], ['zucchini', 'courgette'],
  ['chickpea', 'garbanzo'], ['shrimp', 'prawn', 'prawns'], ['arugula', 'rocket'],
  ['bell pepper', 'capsicum', 'sweet pepper'], ['ground beef', 'minced beef', 'beef mince', 'hamburger meat'],
  ['powdered sugar', 'confectioners sugar', 'icing sugar'], ['sparkling water', 'seltzer', 'club soda', 'soda water'],
  ['green bean', 'string bean'], ['tomato sauce', 'marinara', 'pasta sauce'], ['peanut butter', 'pb'],
  ['soy sauce', 'shoyu'], ['corn', 'maize'], ['garbanzo bean', 'chickpea'], ['heavy cream', 'double cream'],
  ['ground turkey', 'minced turkey'], ['bell peppers', 'peppers'], ['oatmeal', 'porridge', 'oats'],
];
// normalise -> stem every word -> collapse synonym phrases to their canonical
// form, so "green onions" and "scallions" and "scallion" all become one thing.
// Memoised: the same item names get canonicalised on every list render, so
// caching keeps search + the shopping in-stock badge instant even with 500 items.
const _canonCache = new Map();
function canon(s) {
  const key = String(s ?? '');
  const hit = _canonCache.get(key);
  if (hit !== undefined) return hit;
  const stemmed = arr => arr.split(' ').filter(Boolean).map(stem).join(' ');
  let t = ' ' + stemmed(norm(key)) + ' ';
  for (const g of SYN) {
    const target = ' ' + stemmed(g[0]) + ' ';
    for (let k = 1; k < g.length; k++) t = t.split(' ' + stemmed(g[k]) + ' ').join(target);
  }
  t = t.trim();
  if (_canonCache.size > 3000) _canonCache.clear();
  _canonCache.set(key, t);
  return t;
}
// how close two single (already stemmed) words are, 0..1
function wordScore(q, w) {
  if (q === w) return 1;
  if (w.startsWith(q) || q.startsWith(w)) return 0.92;
  if (w.includes(q) || q.includes(w)) return 0.8;
  if (q[0] !== w[0]) return 0;                       // typos almost always keep the first letter
  const tol = q.length <= 4 ? 1 : q.length <= 7 ? 2 : 3;
  const d = editDistance(q, w);
  return d <= tol ? 1 - d / Math.max(q.length, w.length) : 0;
}
// overall relevance of a query against a piece of text, 0..1
function fuzzyScore(query, text) {
  const q = canon(query), t = canon(text);
  if (!q) return 1;
  if (t === q) return 1;
  if ((' ' + t + ' ').includes(' ' + q + ' ')) return 0.95;
  if (t.includes(q)) return 0.88;
  const qtok = q.split(' ').filter(Boolean).map(stem);
  const ttok = t.split(' ').filter(Boolean).map(stem);
  if (!qtok.length || !ttok.length) return 0;
  let total = 0;
  for (const qt of qtok) {
    let best = 0;
    for (const tt of ttok) best = Math.max(best, wordScore(qt, tt));
    if (best === 0) return 0;                         // this query word matched nothing
    total += best;
  }
  return (total / qtok.length) * 0.9;
}
const fuzzyHit = (query, text, min = 0.45) => fuzzyScore(query, text) >= min;

/* ================================================================
   THE CATALOG — one memory for the whole house
   ================================================================
   Plan, Shop and Pantry are three views onto the same question: what
   have we had before, and where did it come from? Groceries and meals
   both land here. Barcoded things key by barcode; everything else keys
   by CANONICAL name, so a typed "chicken thighs", a scanned pack and a
   receipt line collapse into one memory instead of three near-copies.
   That's what makes "add from what you've bought before" possible at
   all — without it the history is just noise. */
const CAT_PRODUCT = 'product', CAT_MEAL = 'meal';
const catKind = c => c.kind || CAT_PRODUCT;          // records predate `kind`
const catId = (name, barcode, kind = CAT_PRODUCT) =>
  barcode ? String(barcode) : (kind === CAT_MEAL ? 'm:' : 'n:') + canon(name);

/* Upsert and bump. `store` is where it came from, `loc` which shelf it
   went to — both remembered so the next buy can pre-fill them. Pass
   bump:false to enrich a record (a photo, a category) without claiming
   it was bought again. */
async function recordCatalog(p, opt = {}) {
  const { store = '', loc = '', at = Date.now(), bump = true } = opt;
  if (!p || !p.name) return null;
  const kind = p.kind || CAT_PRODUCT;
  const id = p.id || catId(p.name, p.barcode, kind);
  const prev = S.catalog.find(c => c.id === id) || {};
  const rec = {
    ...prev, id, kind,
    name: p.name || prev.name || '',
    brand: p.brand ?? prev.brand ?? '',
    cat: p.cat || prev.cat || '',
    emoji: p.emoji || prev.emoji || '',
    image: p.image || prev.image || null,
    packSize: p.packSize ?? prev.packSize ?? null,
    lastLoc: loc || p.lastLoc || prev.lastLoc || null,
    count: (prev.count || 0) + (bump ? 1 : 0),
    first: prev.first || at,
    last: bump ? at : (prev.last || at),
    learned: prev.learned || at,
    deleted: false,
    updatedAt: Date.now(),
  };
  if (store) {
    const s = { ...(prev.stores || {}) };
    s[store] = { n: ((s[store] && s[store].n) || 0) + (bump ? 1 : 0), last: at };
    rec.stores = s;
  }
  await DB.put('catalog', rec);
  const i = S.catalog.findIndex(c => c.id === id);
  if (i > -1) S.catalog[i] = rec; else S.catalog.push(rec);
  SYNC.push('catalog', id, rec);
  return rec;
}

/* History for a surface, most useful first: recent floats above frequent,
   and a search query outranks both. */
function catalogList(kind, { store = '', q = '' } = {}) {
  let list = S.catalog.filter(c => !c.deleted && catKind(c) === kind && c.name);
  if (store) list = list.filter(c => c.stores && c.stores[store]);
  if (q) list = list.filter(c => fuzzyHit(q, `${c.name} ${c.brand || ''}`, 0.45));
  return list.sort((a, b) =>
    (q ? fuzzyScore(q, b.name) - fuzzyScore(q, a.name) : 0) ||
    (b.last || 0) - (a.last || 0) ||
    (b.count || 0) - (a.count || 0));
}

/* Fuzzy, so "chedar" still finds the Cheddar you've bought twenty times. */
const catalogFind = (name, kind = CAT_PRODUCT) =>
  S.catalog.find(c => !c.deleted && catKind(c) === kind && c.id === catId(name, null, kind)) ||
  S.catalog.find(c => !c.deleted && catKind(c) === kind && fuzzyHit(name, c.name, 0.6));

/* What the pantry says about something, for the badge that sits right on
   the shopping line. Four states worth telling apart:
     have — it's in the house, don't rebuy
     low  — in the house but nearly gone
     out  — you've bought this before and there is none left
     new  — never seen it; say nothing rather than guess */
function stockState(name) {
  const hits = S.items.filter(i => !i.deleted && fuzzyHit(name, i.name, 0.55));
  if (!hits.length) return { state: catalogFind(name) ? 'out' : 'new', n: 0 };
  const low = hits.every(i => i.mode === 'level' ? (i.level || 0) <= 1 : (i.qty || 0) <= 1);
  return { state: low ? 'low' : 'have', n: hits.length };
}

/* Bought before, none in the house now, not already on the list. The
   "you're out of this" shortlist — earned from your own history, so it
   stays quiet until it actually knows something. */
function restockList(store = '', max = 12) {
  return catalogList(CAT_PRODUCT, { store })
    .filter(c => (c.count || 0) >= 2 && stockState(c.name).state === 'out')
    .filter(c => !S.shopping.some(s => !s.deleted && !s.done && fuzzyHit(s.name, c.name, 0.6)))
    .slice(0, max);
}

/* Stores belong to the household, not to a global list — "Greens Natural
   Foods" means nothing to anyone else's copy of this app. */
const storeList = () => (S.household?.stores || []);
const storeOf = id => storeList().find(s => s.id === id) || null;
const storeName = id => storeOf(id)?.name || '';
async function addStore(name, emoji = '🏬') {
  const n = String(name || '').trim();
  if (!n || !S.household) return null;
  const ex = storeList().find(s => norm(s.name) === norm(n));
  if (ex) return ex;
  const s = { id: uid(), name: n, emoji };
  S.household.stores = [...storeList(), s];
  await saveHousehold();
  return s;
}
async function removeStore(id) {
  if (!S.household) return;
  S.household.stores = storeList().filter(s => s.id !== id);
  // Orphaned list lines fall back to "any store" rather than vanishing.
  for (const s of S.shopping.filter(x => x.store === id)) { s.store = ''; await saveShopping(s); }
  await saveHousehold();
}

/* Restock hints, learned rather than assumed.
   The pantries hold DIFFERENT food — downstairs is not overflow of
   upstairs. So "you have it there, go get it" is only true for things
   that have genuinely lived on both shelves before. We keep depleted
   items forever, so that history is already here. Silent until it has
   evidence, which is the right cold-start behaviour. */
function restockHints(locId) {
  const live = S.items.filter(i => !i.deleted);
  const hereNow  = new Set(live.filter(i => i.loc === locId).map(i => norm(i.name)));
  const everHere = new Set(S.items.filter(i => i.loc === locId).map(i => norm(i.name)));
  const out = [], seen = new Set();
  for (const i of live) {
    const n = norm(i.name);
    if (i.loc === locId || hereNow.has(n) || seen.has(n)) continue;
    if (!everHere.has(n)) continue;   // never lived here — that's just different food
    seen.add(n); out.push(i);
  }
  return out;
}

const CAT_LABEL = c => c.replace(/-/g, ' ');

function viewInv(app) {
  const live = S.items.filter(i => !i.deleted);

  const chips = el(`<div class="chips"></div>`);
  const mk = (id, label) => {
    const b = el(`<button class="chip" aria-pressed="${S.loc === id}">${esc(label)}</button>`);
    b.onclick = () => { S.loc = id; S.q = ''; render(); };
    return b;
  };
  chips.appendChild(mk('all', `All (${live.length})`));
  S.household.locations.forEach(l =>
    chips.appendChild(mk(l.id, `${l.name} (${live.filter(i => i.loc === l.id).length})`)));
  app.appendChild(chips);

  /* Expiration-status filter (Module 2) — counts respect the shelf filter. */
  const scoped = S.loc === 'all' ? live : live.filter(i => i.loc === S.loc);
  const st = S.status || 'all';
  const statusChips = el(`<div class="chips"></div>`);
  const stat = (id, label) => {
    const b = el(`<button class="chip" aria-pressed="${st === id}">${label}</button>`);
    b.onclick = () => { S.status = id; render(); };
    return b;
  };
  const cnt = f => scoped.filter(f).length;
  statusChips.appendChild(stat('all', 'Any date'));
  statusChips.appendChild(stat('expired', `🔴 Expired (${cnt(i => freshness(i).left < 0)})`));
  statusChips.appendChild(stat('soon', `🟡 Soon (${cnt(i => { const l = freshness(i).left; return l >= 0 && l <= 3; })})`));
  statusChips.appendChild(stat('fresh', `🟢 Fresh (${cnt(i => freshness(i).left > 3)})`));
  app.appendChild(statusChips);

  /* At 500 items search isn't a nicety, it's the primary way in. The
     photos/compact switch rides alongside it rather than taking a third row
     of chips — you have to get past this chrome before you can see any food. */
  const grid = S.cfg.pantryView !== 'list';
  const swap = grid ? 'Switch to a compact list' : 'Switch to photos';
  const srow = el(`<div class="row" style="margin-bottom:12px">
    <input id="q" placeholder="Search ${live.length} items…" value="${esc(S.q || '')}" style="flex:1" autocomplete="off" enterkeyhint="search">
    <button class="btn ghost" data-a="vt" title="${swap}" aria-label="${swap}"
      style="width:auto;padding:0 15px;font-size:18px">${grid ? '☰' : '▦'}</button></div>`);
  const sb = srow.querySelector('#q');
  sb.oninput = e => {
    S.q = e.target.value;
    const box = document.getElementById('results');
    if (box) paintList(box);
  };
  srow.querySelector('[data-a=vt]').onclick = async () => {
    S.cfg.pantryView = grid ? 'list' : 'grid'; await saveCfg(); render();
  };
  app.appendChild(srow);

  const box = el(`<div id="results"></div>`);
  app.appendChild(box);
  paintList(box);
  if (S.q || S.focusSearch) { sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
  S.focusSearch = false;
}

function paintList(box) {
  box.innerHTML = '';
  let live = S.items.filter(i => !i.deleted);
  if (S.loc !== 'all') live = live.filter(i => i.loc === S.loc);
  const st = S.status || 'all';
  if (st !== 'all') live = live.filter(i => { const l = freshness(i).left; return st === 'expired' ? l < 0 : st === 'soon' ? (l >= 0 && l <= 3) : l > 3; });

  /* searching: fuzzy (typo-tolerant), ranked by match quality then expiry, capped */
  if (S.q?.trim()) {
    const hits = live
      .map(i => ({ i, s: Math.max(fuzzyScore(S.q, i.name), fuzzyScore(S.q, i.brand || '') * 0.9) }))
      .filter(x => x.s >= 0.4)
      .sort((a, b) => b.s - a.s || a.i.expires - b.i.expires)
      .map(x => x.i);
    if (!hits.length) {
      box.appendChild(el(`<div class="empty">
        <div class="big">No match for "${esc(S.q)}"</div>
        <div class="sub">Nothing in the house by that name. If it really is here, the inventory has drifted — scan it in.</div></div>`));
      return searchHistory(box, S.q);
    }
    paintRows(box, hits.slice(0, 60));
    if (hits.length > 60) box.appendChild(el(`<div class="note" style="text-align:center;padding:10px">
      +${hits.length - 60} more — keep typing</div>`));
    searchHistory(box, S.q, hits);
    return;
  }

  if (!live.length) return box.appendChild(el(`<div class="empty">
    <div class="big">Nothing on this shelf</div>
    <div class="sub">Scan tab → photograph the whole shelf at once. That's how you fill 500 slots without losing a weekend.</div></div>`));

  if (S.loc !== 'all') {
    const hints = restockHints(S.loc);
    if (hints.length) {
      const names = [...new Set(hints.map(i => i.name))].slice(0, 3);
      box.appendChild(el(`<div class="card" style="border-color:var(--rime-hi)">
        <div class="eyebrow" style="margin-bottom:5px">Usually lives here — currently elsewhere</div>
        <div class="note">${esc(names.join(' · '))}${hints.length > 3 ? ` +${hints.length - 3}` : ''}</div></div>`));
    }
  }

  /* Grouped, collapsed, and built only when opened. 500 rows of DOM
     rendered eagerly on every tap is what makes an app feel like mud. */
  const groups = {};
  const key = i => S.loc === 'all' ? i.loc : i.cat;
  live.forEach(i => (groups[key(i)] ||= []).push(i));
  const label = k => S.loc === 'all' ? locName(k) : CAT_LABEL(k);
  const openAll = live.length <= 25;
  const gkey = k => S.loc + ':' + k;

  Object.entries(groups)
    .sort((a, b) => Math.min(...a[1].map(i => i.expires)) - Math.min(...b[1].map(i => i.expires)))
    .forEach(([k, list]) => {
      list.sort((a, b) => a.expires - b.expires);
      const worst = freshness(list[0]);
      const urgent = list.filter(i => freshness(i).left <= 3).length;
      const d = el(`<details ${openAll || S.open.has(gkey(k)) ? 'open' : ''} style="margin-bottom:6px">
        <summary style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
          padding:11px 12px;background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r)">
          <span style="width:4px;height:17px;border-radius:2px;background:${urgent ? worst.rail : 'var(--rime-hi)'}"></span>
          <span class="code" style="font-size:12px;flex:1">${esc(label(k))}</span>
          ${urgent ? `<span class="code" style="font-size:10px;color:${worst.rail}">${urgent} DYING</span>` : ''}
          <span class="code" style="font-size:11px;color:var(--vapor-dim)">${list.length}</span>
        </summary>
        <div class="grp" style="padding-top:6px"></div></details>`);
      const body = d.querySelector('.grp');
      const build = () => { if (d.dataset.built) return; paintRows(body, list); d.dataset.built = '1'; };
      d.addEventListener('toggle', () => {
        d.open ? S.open.add(gkey(k)) : S.open.delete(gkey(k));
        if (d.open) build();
      });
      if (d.open) build();
      box.appendChild(d);
    });
}

/* ---------------- view: expiring ---------------- */
/* ---------------- voice: trash / eat / add ----------------
   The hardest habit is REMOVING food as you eat it. A mic button lets
   anyone say "finished the milk" walking past the fridge. Free (Web
   Speech API). Graceful when unsupported (older iOS just won't show it). */
const cleanWords = s => String(s || '').toLowerCase().replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
const VOICE_STOP = new Set('threw throw thrown toss tossed tossing chuck chucked binned bin spoiled rotten rotted moldy mould expired trash bad old gross nasty away out the a an some our my your we i of is are was were all gone empty no more used up finished finish ate eaten eat eating using use drank drink drinking add need needs buy get got to on shopping list please can you just it that this and'.split(' '));
function parseVoice(text) {
  const raw = cleanWords(text);
  if (!raw) return null;
  const toss = /\b(threw|throw|thrown|toss|tossed|chucked?|binned|spoiled|rotten|rotted|moldy|mould|expired|trash)\b/.test(raw);
  const eat = /\b(finished|finish|ate|eaten|eat|used|drank|drink|gone|empty|no more|out of|used up)\b/.test(raw);
  const list = /\b(add|need|needs|buy|get|got)\b/.test(raw) && /\b(list|shopping|store)\b/.test(raw);
  const name = raw.split(' ').filter(w => w && !VOICE_STOP.has(w)).join(' ').trim();
  if (!name) return null;
  if (list) return { action: 'list', name };
  if (toss) return { action: 'toss', name };
  if (eat) return { action: 'eat', name };
  return null;   // no clear verb — don't guess a destructive action
}
async function handleVoice(text) {
  const p = parseVoice(text);
  if (!p) return toast(`Didn't catch that — try "finished the milk" or "add eggs to the list"`);
  if (p.action === 'list') { await addToList(p.name.replace(/\b\w/, c => c.toUpperCase())); render(); return; }
  const q = p.name;
  // Speech-to-text mangles product names constantly ("yoghurt", "yogurt",
  // "yo-gurt"), so fall back to the same typo-tolerant matching the rest of
  // the app uses rather than giving up on an exact substring.
  let hits = S.items.filter(i => !i.deleted && (norm(i.name).includes(q) || q.includes(norm(i.name))));
  if (!hits.length) hits = S.items.filter(i => !i.deleted && fuzzyHit(q, i.name, 0.55));
  if (!hits.length) return toast(`No "${p.name}" in the house`);
  const it = hits.sort((a, b) => a.expires - b.expires)[0];
  if (p.action === 'toss') await tossItem(it); else await deplete(it, 'voice');
  render();
}
function voiceButton() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const idle = '🎤 Say "finished the milk"';
  const b = el(`<button class="btn ghost" style="margin-bottom:12px">${idle}</button>`);
  b.onclick = () => {
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    b.textContent = '🎤 Listening…'; b.disabled = true;
    rec.onresult = e => { b.disabled = false; b.textContent = idle; handleVoice(e.results[0][0].transcript); };
    rec.onerror = () => { b.disabled = false; b.textContent = '🎤 mic blocked — tap to retry'; };
    rec.onend = () => { b.disabled = false; if (b.textContent === '🎤 Listening…') b.textContent = idle; };
    try { rec.start(); } catch (e) { b.disabled = false; }
  };
  return b;
}

function viewSoon(app) {
  const vb = voiceButton();
  if (vb) app.appendChild(vb);
  const live = S.items.filter(i => !i.deleted);
  const soon = live.filter(i => freshness(i).left <= 7).sort((a, b) => a.expires - b.expires);
  const wasted = S.items.filter(i => i.wasted);

  /* Food scorecard — the family motivator. Rescued = eaten/used before it
     went bad; wasted = logged as thrown out; streak = days since the last
     waste. All computed from the log we already keep. */
  const rescued = S.items.filter(i => i.deleted && !i.wasted).length;
  const wastedN = wasted.length;
  const rescuedPct = (rescued + wastedN) ? Math.round(rescued / (rescued + wastedN) * 100) : null;
  const lastWaste = wasted.reduce((m, i) => Math.max(m, i.wastedAt || 0), 0);
  const streak = lastWaste ? Math.floor((Date.now() - lastWaste) / DAY) : null;
  if (rescued + wastedN > 0) {
    app.appendChild(el(`<div class="card">
      <div class="eyebrow" style="margin-bottom:10px">Food scorecard</div>
      <div style="display:flex;text-align:center">
        <div style="flex:1"><div class="code" style="font-size:23px;color:var(--fresh)">${rescued}</div><div class="tag">RESCUED</div></div>
        <div style="flex:1"><div class="code" style="font-size:23px;color:var(--spoil)">${wastedN}</div><div class="tag">WASTED</div></div>
        <div style="flex:1"><div class="code" style="font-size:23px">${streak !== null ? '🔥' + streak : '✨'}</div><div class="tag">${streak !== null ? 'DAY STREAK' : 'ZERO WASTE'}</div></div>
      </div>
      ${rescuedPct !== null ? `<div class="note" style="text-align:center;margin-top:11px">You've eaten <b>${rescuedPct}%</b> of what came in before it went bad.</div>` : ''}
    </div>`));
  }

  if (!soon.length) {
    app.appendChild(el(`<div class="empty"><div class="big">Nothing dying</div>
      <div class="sub">Everything in the house has more than a week. Enjoy it.</div></div>`));
  } else {
    const dead = soon.filter(i => freshness(i).left < 0);
    if (dead.length) app.appendChild(el(`<div class="card" style="border-color:var(--spoil)">
      <div class="eyebrow" style="color:var(--spoil);margin-bottom:5px">Past date</div>
      <div class="note">${dead.length} item${dead.length > 1 ? 's' : ''}. Check them — the date is a guess, your nose isn't. Tap <b>⋯ → Threw it out</b> so the waste log learns.</div></div>`));
    app.appendChild(el(`<h2 style="margin:14px 0 8px">Eat me first</h2>`));
    soon.forEach(i => app.appendChild(itemRow(i)));
  }

  if (wasted.length) {
    const counts = {};
    wasted.forEach(i => counts[i.name] = (counts[i.name] || 0) + 1);
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    app.appendChild(el(`<h2 style="margin:26px 0 8px">Waste log · ${wasted.length} total</h2>`));
    app.appendChild(el(`<div class="card"><div class="note">${top.map(([n, c]) =>
      `${esc(n)} <span class="code" style="color:${c > 2 ? 'var(--spoil)' : 'var(--vapor-dim)'}">×${c}</span>`).join('<br>')}
      ${top.some(t => t[1] > 2) ? `<div class="warn" style="margin-top:12px">You keep buying things you don't eat. Buy half as much of the ×3s.</div>` : ''}
      </div></div>`));
  }
}

/* ---------------- home dashboard ---------------- */
const greetWord = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysLabel = n => n < 0 ? 'Expired' : n === 0 ? 'Today' : n === 1 ? '1 day' : `${n} days`;

  } else if (live.length) {
