<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfLife">
<title>ShelfLife</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS uses this PNG for the Add-to-Home-Screen icon; it ignores the SVG in the manifest. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ============================================================
   SHELFLIFE — design system
   A clean, modern consumer app. One fresh-green brand colour on a
   soft, green-tinted white. Sans-serif for everything human; the
   mono face is kept only for dates, quantities and codes, where the
   tabular look reads like real packaging. Green is both the brand
   AND the "fresh/good" state — on purpose, the app IS freshness.
   Freshness signal stays a traffic light: green fresh, amber soon,
   red past. Soft elevation, generous radii, consistent spacing.
   ============================================================ */
:root{
  --void:#F7F9F7;       /* app background — clean near-white */
  --fog:#EEF2EE;        /* subtle fill — chips, thumbnails, wells */
  --shelf:#FFFFFF;      /* card surface */
  --rime:#E5ECE5;       /* hairline borders, dividers */
  --rime-hi:#D2DBD2;    /* stronger border */
  --frost:#14211A;      /* primary text — near-black green */
  --vapor:#55655B;      /* secondary text */
  --vapor-dim:#88968C;  /* tertiary text */

  --cold:#12A150;       /* BRAND green — primary actions, active nav, focus */
  --cold-2:#0C7D3C;     /* deeper green — gradients, pressed */
  --cold-soft:#E1F4E8;  /* green tint — soft fills, selected */
  --ink:#FFFFFF;        /* text that sits ON the green accent */
  --chill:#12A150;      /* good — success, nothing-missing */
  --thaw:#E2851F;       /* eat soon — amber */
  --thaw-soft:#FBEEDA;
  --spoil:#DE453D;      /* past date — red */
  --spoil-soft:#FBE5E4;
  --fresh:#2E8B57;      /* fresh — calm green (fresh rails) */

  --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;

  --pad:16px;
  --r:18px;             /* cards */
  --r-sm:12px;          /* buttons, inputs, small tiles */
  --nav-h:66px;
  --shadow-sm:0 1px 2px rgba(18,50,30,.06);
  --shadow:0 1px 2px rgba(18,50,30,.05),0 6px 20px rgba(18,50,30,.06);
  --shadow-lg:0 10px 34px rgba(18,50,30,.12);
  --shadow-fab:0 8px 22px rgba(18,161,80,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--frost);font-family:var(--sans);
  overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:16px;background:var(--shelf);color:var(--frost);
  border:1.5px solid var(--rime-hi);border-radius:var(--r-sm);padding:12px 13px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cold)}
button:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
::placeholder{color:var(--vapor-dim)}

/* ---- type ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--vapor-dim);font-weight:600}
.code{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:16px;font-weight:750;letter-spacing:-.01em;margin:0;color:var(--frost)}
h3{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
a{color:var(--cold);text-decoration:none}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:rgba(247,249,247,.85);backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid var(--rime);padding:calc(env(safe-area-inset-top) + 11px) var(--pad) 11px;
  display:flex;align-items:center;gap:9px}
header #title{font-size:20px;font-weight:800;letter-spacing:-.03em}
header .who{display:flex;align-items:center;gap:6px;font-size:18px;
  background:var(--shelf);border:1px solid var(--rime-hi);border-radius:999px;padding:4px 10px}
header #searchBtn{margin-left:auto}
header #searchBtn,header #cartBtn,header #setBtn{font-size:16px;background:var(--shelf);border:1px solid var(--rime);
  border-radius:999px;width:39px;height:39px;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
header #searchBtn:active,header #cartBtn:active,header #setBtn:active{background:var(--fog)}
main{padding:var(--pad);max-width:660px;margin:0 auto}

/* ---- bottom nav, with a raised centre Scan button ---- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--rime);display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--vapor-dim);font-size:10px;font-weight:650;letter-spacing:.01em}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button[aria-current="page"]{color:var(--cold)}
nav button.fab svg{width:auto;height:24px;stroke:#fff;stroke-width:1.9;box-sizing:content-box;padding:13px;
  background:linear-gradient(160deg,var(--cold),var(--cold-2));border-radius:50%;box-shadow:var(--shadow-fab);
  margin-top:-20px;border:4px solid var(--void)}
nav button.fab{color:var(--cold)}
nav button.fab[aria-current="page"] svg{filter:brightness(1.05)}

/* ---- item row: photo, name, freshness rail + date stamp ---- */
.item{position:relative;display:flex;align-items:center;gap:12px;background:var(--shelf);
  border:1px solid var(--rime);border-radius:var(--r);padding:11px 12px 11px 18px;margin-bottom:9px;
  overflow:hidden;box-shadow:var(--shadow-sm)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail,var(--vapor-dim))}
.item .thumb{width:48px;height:48px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:var(--fog);
  border:1px solid var(--rime);display:grid;place-items:center}
.item .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item .thumb .ph{font-size:18px;font-weight:700;color:var(--vapor-dim);text-transform:uppercase}
.item .thumb .emoji{font-size:26px;line-height:1}
.item .body{flex:1;min-width:0}
.item .nm{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;gap:8px;align-items:baseline;margin-top:3px}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--rail,var(--vapor));font-weight:600;text-transform:uppercase}
.qty{font-family:var(--mono);font-size:11px;color:var(--vapor);white-space:nowrap}
.item .act{display:flex;gap:6px;flex-shrink:0}
.item .act button{width:35px;height:35px;border:1px solid var(--rime-hi);border-radius:10px;
  display:grid;place-items:center;color:var(--vapor);font-size:17px;line-height:1;background:var(--shelf)}
.item .act button:active{background:var(--fog)}
.item .act button.plus{color:var(--cold);border-color:var(--cold);background:var(--cold-soft)}

.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:5px;height:12px;border-radius:2px;background:var(--rime-hi)}
.pips i.on{background:var(--rail,var(--cold))}

/* ---- cards & buttons ---- */
.card{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);padding:16px;margin-bottom:11px;box-shadow:var(--shadow-sm)}
.btn{background:linear-gradient(160deg,var(--cold),var(--cold-2));color:var(--ink);border-radius:var(--r-sm);padding:14px 16px;
  font-size:14.5px;font-weight:750;letter-spacing:-.01em;width:100%;display:block;text-align:center;transition:transform .08s,filter .12s;box-shadow:0 4px 14px rgba(47,224,122,.2)}
.btn.ghost{background:var(--shelf);color:var(--frost);border:1.5px solid var(--rime-hi);box-shadow:none}
.btn.cold{background:linear-gradient(160deg,var(--cold),var(--cold-2));color:var(--ink);box-shadow:0 4px 14px rgba(47,224,122,.22)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:10px;width:auto}
.btn:active{transform:translateY(1px)}
.btn.cold:active{filter:brightness(.96)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:9px}
label{display:block;margin-bottom:15px}
label .lbl{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--vapor);display:block;margin-bottom:7px}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--rime-hi);color:var(--vapor);white-space:nowrap;background:var(--shelf)}
.chip[aria-pressed="true"]{background:var(--cold);color:var(--ink);border-color:var(--cold)}

.empty{text-align:center;padding:60px 20px;color:var(--vapor-dim)}
.empty .big{font-size:16px;font-weight:700;color:var(--frost);margin-bottom:6px}
.empty .sub{font-size:13.5px;line-height:1.5;max-width:34ch;margin:0 auto}

/* ---- home dashboard ---- */
.greet{margin:2px 0 16px}
.greet .hi{font-size:24px;font-weight:800;letter-spacing:-.03em}
.greet .dt{font-size:13px;color:var(--vapor);font-weight:600;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);padding:14px 12px;text-align:center;box-shadow:var(--shadow-sm)}
.stat .num{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat .lbl{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--vapor-dim);margin-top:6px}
.section{margin-bottom:24px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 11px}
.section-head .more{font-size:13px;font-weight:650;color:var(--cold)}
.hscroll{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px}
.hscroll::-webkit-scrollbar{display:none}
.foodcard{flex:0 0 118px;background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.foodcard .top{height:80px;display:grid;place-items:center;background:var(--fog);font-size:38px}
.foodcard .top img{width:100%;height:100%;object-fit:cover}
.foodcard .lo{padding:9px 10px 11px}
.foodcard .fn{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.foodcard .fd{font-family:var(--mono);font-size:10.5px;font-weight:600;margin-top:3px;letter-spacing:.03em}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);padding:14px 6px 11px;
  display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
.qa button:active{background:var(--fog)}
.qa .qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--cold-soft);font-size:20px}
.qa .ql{font-size:11px;font-weight:650;color:var(--frost);letter-spacing:-.01em}

/* ---- pills (missing / uses) ---- */
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;margin:0 5px 5px 0;
  background:var(--fog);color:var(--vapor)}
.pill.miss{background:var(--thaw-soft);color:var(--thaw)}
.pill.ok{background:var(--cold-soft);color:var(--cold)}

/* ---- recipe cards ---- */
.recipe-card{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.recipe-card .banner{height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;
  background:linear-gradient(150deg,var(--cold-soft),var(--shelf));position:relative}
.recipe-card .banner.photo{background-size:cover;background-position:center;background-repeat:no-repeat}
.recipe-card .banner .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:var(--shadow-sm)}
.recipe-card .banner .badge.ok{color:var(--cold-2)}
.recipe-card .banner .badge.miss{color:#9a5a10}
.recipe-card .rc-body{padding:14px 15px 15px}
.recipe-card .rc-body h3{margin-bottom:4px}
.recipe-card .rc-meta{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--vapor-dim);letter-spacing:.03em;margin-bottom:10px}
.recipe-card .rc-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---- tiles: the app's main visual unit ----
   Name on TOP, big photo underneath. A 48px thumbnail beside a line of text
   makes you read the app; a large photo lets you recognise it. Two up on a
   phone is the sweet spot — big enough to identify at a glance, dense enough
   that a real shopping list doesn't turn into a mile of scrolling. */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.tiles.one{grid-template-columns:1fr}
.tile{position:relative;background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;text-align:left;width:100%}
.tile .tt{padding:11px 12px 9px}
.tile .tn{font-size:15px;font-weight:750;letter-spacing:-.015em;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Reserve two lines in the grid so a wrapping name doesn't shove its photo
   out of line with the tile beside it. */
.tiles:not(.one) .tile .tn{min-height:2.5em}
.tile .tm{font-size:10.5px;letter-spacing:.04em;color:var(--vapor);margin-top:5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 4:3, not square: a square photo in a two-up grid makes each tile ~430px
   tall, so a real shopping list turns into a mile of scrolling. This keeps
   the photo big enough to recognise while fitting ~3 rows on a phone. */
.tile .tp{position:relative;aspect-ratio:4/3;background:var(--fog);display:grid;place-items:center;overflow:hidden}
.tiles.one .tp{aspect-ratio:16/9}
.tile .tp img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tp .emoji{font-size:46px;line-height:1}
.tiles.one .tp .emoji{font-size:64px}
.tile .tb{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:750;padding:5px 9px;
  border-radius:999px;background:rgba(255,255,255,.95);box-shadow:var(--shadow-sm);letter-spacing:.02em}
.tile .tc{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--rime);
  font-size:13.5px;font-weight:700;color:var(--vapor);background:var(--shelf);width:100%}
.tile .tc .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--rime-hi);
  display:grid;place-items:center;color:#fff;font-size:14px;flex:0 0 auto;background:var(--shelf)}
.tile .tc:active{background:var(--fog)}
.tile.done{opacity:.6}
.tile.done .tn{text-decoration:line-through;color:var(--vapor)}
.tile.done .tc .box{background:var(--fresh);border-color:var(--fresh)}
.tile.sel{border-color:var(--cold);box-shadow:0 0 0 3px var(--cold-soft)}
/* "got" = just added, still wanted. Distinct from "done" (crossed off): a
   thing you just put ON your list shouldn't render as struck through. */
.tile.got{border-color:var(--fresh)}
.tile.got .tc{color:var(--fresh)}
.tile.got .tc .box{background:var(--fresh);border-color:var(--fresh)}

/* A tap that quietly succeeds reads as a tap that did nothing. */
@keyframes tpop{0%{transform:scale(.55);opacity:.3}55%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.tile .tc .box.pop{animation:tpop .34s cubic-bezier(.2,.9,.3,1.35)}
@keyframes tflash{from{background:var(--cold-soft)}to{background:var(--shelf)}}
.tile.added{animation:tflash .9s ease-out}
@media (prefers-reduced-motion:reduce){.tile .tc .box.pop,.tile.added{animation:none}}
.tile .tx{position:absolute;top:8px;right:8px;width:29px;height:29px;border-radius:999px;
  background:rgba(255,255,255,.95);box-shadow:var(--shadow-sm);display:grid;place-items:center;
  font-size:16px;color:var(--vapor);line-height:1}

/* status tags — the "you're out of this" signal, read at a glance */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:750;
  padding:4px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.tag.have{background:#E8F3EC;color:#1B6E42}
.tag.low{background:#FDF0DC;color:#8A5A12}
.tag.out{background:#FBE9E9;color:#9B2C2C}
.tag.miss{background:#EDEFED;color:#5C6A5C}

/* section headings, so Completed reads as a place rather than a leftover */
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sect h3{font-size:15px;font-weight:800;letter-spacing:-.015em}
.sect .n{font-family:var(--mono);font-size:11px;color:var(--vapor);font-weight:600}

/* ---- meal planner ---- */
.day{background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.day.today{border-color:var(--cold);box-shadow:0 0 0 3px var(--cold-soft)}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.day .dh .dw{font-size:15px;font-weight:750;letter-spacing:-.01em}
.day .dh .dw small{font-weight:600;color:var(--vapor);font-size:12px;margin-left:6px}
.day .dh .badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cold);background:var(--cold-soft);padding:3px 8px;border-radius:999px}
.meal{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rime)}
.meal:first-child{border-top:none}
.meal .mi{font-size:20px}
.meal .mn{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .mx{width:30px;height:30px;border:1px solid var(--rime-hi);border-radius:9px;color:var(--vapor);display:grid;place-items:center}
.day .addmeal{width:100%;margin-top:8px;padding:10px;border:1.5px dashed var(--rime-hi);border-radius:var(--r-sm);
  color:var(--vapor);font-size:13px;font-weight:650;background:var(--void)}
.day .addmeal:active{background:var(--fog)}

/* scanner */
#scanwrap{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;margin-bottom:12px;box-shadow:var(--shadow)}
#video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:16% 10%;border:2px solid rgba(18,161,80,.7);border-radius:10px;pointer-events:none}
.reticle::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--cold);
  box-shadow:0 0 12px var(--cold);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%,100%{top:6%}50%{top:94%}}
.reticle{transition:background .12s ease,border-color .12s ease}
.reticle.hit{border-color:var(--chill);background:rgba(18,161,80,.2)}
.reticle.miss{border-color:var(--spoil);background:rgba(222,69,61,.2)}
.torchbtn{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;
  background:rgba(10,20,15,.5);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;
  font-size:18px;backdrop-filter:blur(6px);z-index:2}
.torchbtn[aria-pressed="true"]{background:var(--cold)}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none}*{transition:none!important}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px);z-index:60;
  background:var(--frost);color:#fff;font-size:13px;font-weight:650;
  padding:13px 17px;border-radius:999px;display:flex;align-items:center;gap:13px;max-width:calc(100vw - 32px);
  box-shadow:var(--shadow-lg)}
.toast button{color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.02em;
  background:var(--cold);padding:6px 11px;border-radius:8px}

dialog{border:none;background:var(--shelf);color:var(--frost);border-radius:22px;
  padding:20px;width:min(470px,calc(100vw - 24px));max-height:88dvh;overflow:auto;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(10,25,16,.44);backdrop-filter:blur(3px)}

.recipe{position:relative;background:var(--shelf);border:1px solid var(--rime);border-radius:var(--r);
  padding:14px 14px 14px 17px;margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.recipe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail,var(--rime-hi))}
.recipe h3{font-size:15px;margin:0 0 5px;font-weight:700}
.gap{font-size:12.5px;font-weight:600;color:var(--thaw)}
.gap.none{color:var(--chill)}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--vapor-dim);letter-spacing:.04em;font-weight:600}
.spin{width:15px;height:15px;border:2px solid rgba(6,20,12,.3);border-top-color:var(--ink);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
.btn.ghost .spin,.note .spin{border-color:var(--rime-hi);border-top-color:var(--cold)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- floating add button (per screen, bottom-right) ---- */

  width:58px;height:58px;border-radius:50%;background:linear-gradient(160deg,var(--cold),var(--cold-2));
  color:#fff;font-size:30px;font-weight:400;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow-fab)}

/* ---- profile hub (Cooklist-style rows) ---- */

.prow .plink{color:var(--cold);font-weight:700;font-size:13px}

/* ---- section header with count + chevron (pantry categories) ---- */

/* ---- onboarding welcome carousel ---- */
.wc-wrap{position:fixed;inset:0;z-index:80;background:var(--void);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px)}

  display:grid;place-items:center;font-size:72px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--rime)}

<body>

<header>
  <h1 id="title">ShelfLife</h1>
  <button id="searchBtn" class="hide" aria-label="Search your pantry">🔎</button>
</header>

<main id="app"></main>

<button id="fab" class="fab-add hide" aria-label="Add food"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav id="nav"></nav>

<dialog id="dlg"></dialog>

<script>
/* ================================================================
   COLD ROOM — household food inventory
   Local-first. Works offline (your basement freezer has bad wifi).
   Optional cloud sync is a drop-in, not a dependency.
   ================================================================ */

/* ---------------- storage: tiny IndexedDB wrapper ---------------- */
const DB = (() => {
  let db;
  const STORES = ['items','catalog','recipes','meta','log','shopping','plan','saved'];
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('coldroom', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode = 'readonly') => db.transaction(store, mode).objectStore(store);
  const p = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
  return {
    async init() { await open(); },
    get: (s, id) => p(tx(s).get(id)),
    all: (s) => p(tx(s).getAll()),
    put: (s, v) => p(tx(s, 'readwrite').put(v)),
    del: (s, id) => p(tx(s, 'readwrite').delete(id)),
  };
})();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 86400000;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };

/* ---------------- shelf life: category x location-kind ----------------
   The whole point: you never type an expiry date. Ever.
   Days are deliberately conservative-but-real, not the printed
   "best by" date, which is a marketing artifact, not a safety line. */
const SHELF = {
  //                      fridge  freezer  pantry
  'dairy-milk':          [   7,     90,      0 ],
  'dairy-cheese-hard':   [  35,    180,      0 ],
  'dairy-cheese-soft':   [  10,     60,      0 ],
  'dairy-yogurt':        [  21,     60,      0 ],
  'dairy-butter':        [  60,    270,      0 ],
  'eggs':                [  28,      0,      0 ],
  'meat-raw':            [   2,    180,      0 ],
  'poultry-raw':         [   2,    270,      0 ],
  'fish-raw':            [   2,    180,      0 ],
  'deli-meat':           [   5,     60,      0 ],
  'leftovers':           [   4,     90,      0 ],
  'produce-leafy':       [   6,     30,      2 ],
  'produce-berry':       [   5,    300,      1 ],
  'produce-hardy':       [  21,    240,     10 ],
  'produce-root':        [  40,    300,     60 ],
  'produce-citrus':      [  28,    120,     10 ],
  'produce-banana':      [   7,     90,      4 ],
  'produce-avocado':     [   7,     90,      3 ],
  'herbs-fresh':         [   7,    120,      0 ],
  'bread':               [  10,     90,      4 ],
  'tortilla':            [  30,    180,      7 ],
  'frozen-meal':         [   0,    240,      0 ],
  'frozen-veg':          [   0,    300,      0 ],
  'ice-cream':           [   0,     90,      0 ],
  'canned':              [ 400,      0,    730 ],
  'jarred-sauce':        [  10,      0,    540 ],
  'condiment':           [ 180,      0,    365 ],
  'dry-pasta-rice':      [   0,      0,    720 ],
  'dry-grain-flour':     [ 365,    365,    240 ],
  'snack':               [   0,      0,     90 ],
  'cereal':              [   0,      0,    180 ],
  'baking':              [   0,      0,    540 ],
  'oil-vinegar':         [   0,      0,    365 ],
  'coffee-tea':          [   0,      0,    240 ],
  'juice-drink':         [  10,    180,    270 ],
  'nuts-seeds':          [ 180,    365,     90 ],
  'spice':               [   0,      0,   1000 ],
  'other':               [  14,    180,    180 ],
};
const KIND_IDX = { fridge: 0, freezer: 1, pantry: 2 };

/* Once opened, the clock changes completely. Unopened sour cream
   lasts weeks; opened lasts ten days. This is where most waste hides. */
const OPENED_DAYS = {
  'dairy-milk':7,'dairy-cheese-hard':21,'dairy-cheese-soft':7,'dairy-yogurt':7,
  'deli-meat':4,'jarred-sauce':7,'juice-drink':7,'condiment':120,'canned':3,
  'bread':7,'produce-leafy':3,'nuts-seeds':60,'coffee-tea':30,
};

/* count = discrete things you can literally count.
   level = bulk things nobody weighs (milk, flour, oil).
   pack  = Costco's fault. A container holding N units. */
const UNIT_MODE = {
  'dairy-milk':'level','oil-vinegar':'level','dry-grain-flour':'level','dry-pasta-rice':'level',
  'condiment':'level','jarred-sauce':'level','juice-drink':'level','coffee-tea':'level',
  'cereal':'level','baking':'level','spice':'level','nuts-seeds':'level',
  'produce-leafy':'level','herbs-fresh':'level','dry-grain':'level',
};
const unitModeFor = cat => UNIT_MODE[cat] || 'count';

/* Map Open Food Facts' sprawling category tags onto our small vocabulary.
   Order matters — first hit wins, so specific before general. */
const OFF_MAP = [
  [/ice-?cream|frozen-desserts/,'ice-cream'],
  [/frozen-vegetab|frozen-fruit/,'frozen-veg'],
  [/frozen-meals|pizza|ready-meal/,'frozen-meal'],
  [/milks?$|milk-|dairy-drink/,'dairy-milk'],
  [/yogh?urt|yaourt/,'dairy-yogurt'],
  [/butter|margarin/,'dairy-butter'],
  [/hard-cheese|parmes|cheddar|gouda/,'dairy-cheese-hard'],
  [/cheese|fromage/,'dairy-cheese-soft'],
  [/eggs?$/,'eggs'],
  [/poultry|chicken|turkey/,'poultry-raw'],
  [/fish|seafood|salmon|tuna|shrimp/,'fish-raw'],
  [/deli|charcuter|ham$|salami|bacon/,'deli-meat'],
  [/meats?$|beef|pork|lamb/,'meat-raw'],
  [/breads?|baguette|bagel|bun/,'bread'],
  [/tortilla|wrap/,'tortilla'],
  [/canned|tinned|preserve/,'canned'],
  [/sauce|salsa|pesto|ketchup/,'jarred-sauce'],
  [/condiment|mustard|mayonn|dressing/,'condiment'],
  [/pastas?|rice|noodle|couscous/,'dry-pasta-rice'],
  [/flour|baking/,'baking'],
  [/cereal|granola|oat/,'cereal'],
  [/oils?$|vinegar|olive-oil/,'oil-vinegar'],
  [/coffee|teas?$|infusion/,'coffee-tea'],
  [/juice|soda|water|beverage|drink/,'juice-drink'],
  [/nuts|seeds|almond|peanut/,'nuts-seeds'],
  [/spice|herb|seasoning/,'spice'],
  [/snack|chips|crisps|biscuit|cookie|candy|chocolate|bar/,'snack'],
  [/salad|lettuce|spinach|greens|kale/,'produce-leafy'],
  [/berr|strawb|blueb|raspb/,'produce-berry'],
  [/banana/,'produce-banana'],
  [/avocado/,'produce-avocado'],
  [/citrus|orange|lemon|lime|grapefruit/,'produce-citrus'],
  [/potato|onion|carrot|garlic|root/,'produce-root'],
  [/vegetab|fruits?$|produce/,'produce-hardy'],
];
/* Test each tag separately, not the joined blob — otherwise an
   $-anchored pattern like /milks?$/ never fires, because the string
   it's handed is "en:milks,en:dairies" and only the last tag can win.
   Patterns loop outer so the specific-before-general ordering holds. */
const mapCat = tags => {
  const list = String(tags || '').toLowerCase()
    .split(/[,\s]+/).map(t => t.replace(/^[a-z]{2}:/, '')).filter(Boolean);
  for (const [re, cat] of OFF_MAP) if (list.some(t => re.test(t))) return cat;
  return 'other';
};

const CATS = Object.keys(SHELF);

/* ---------------- state ---------------- */
let S = { items: [], catalog: [], recipes: [], shopping: [], plan: [], saved: [], household: null, cfg: {}, view: 'pantry', loc: 'all', who: null, q: '', cq: '', open: new Set() };

const kindOf = id => (S.household?.locations.find(l => l.id === id)?.kind) || 'pantry';

function baseDays(cat, kind) {
  let d = (SHELF[cat] || SHELF.other)[KIND_IDX[kind]];
  if (!d) d = (SHELF[cat] || SHELF.other)[2] || 14;   // wrong-shelf fallback
  return d;
}
/* Per-store learning: a bounded offset per category, learned from the real
   dates the family confirms, shared across phones via the household record. */
const learnedOffset = cat => { const v = S.household?.learn?.[cat]; return typeof v === 'number' ? Math.max(-14, Math.min(30, v)) : 0; };
function estimateExpiry(cat, locId, opened) {
  const kind = kindOf(locId);
  let d = Math.max(1, baseDays(cat, kind) + learnedOffset(cat));
  if (opened && OPENED_DAYS[cat]) d = Math.min(d, OPENED_DAYS[cat]);
  return today() + d * DAY;
}
/* Learn from a genuinely-confirmed date (typed, scanned, or read off a
   photo) — never from a relative "still good" bump. Heavily clamped so a
   bad reading can't corrupt the estimates. */
async function learnFromDate(it) {
  if (!it || !it.dateConfirmed || !S.household) return;
  const base = baseDays(it.cat, kindOf(it.loc));
  const observed = Math.round((it.expires - (it.added || today())) / DAY);
  if (observed < 0 || observed > 1200) return;
  const delta = observed - base;
  if (Math.abs(delta) > 60) return;                   // ignore wild outliers
  const learn = S.household.learn || (S.household.learn = {});
  learn[it.cat] = Math.max(-14, Math.min(30, Math.round(0.5 * (learn[it.cat] || 0) + 0.5 * delta)));
  await saveHousehold();
}

/* The few categories where the PRINTED date really matters and the guess
   can be badly wrong (milk bought today might be 4 days or 14). These are
   the only items we ever nudge the user to verify — everything else, the
   category estimate is plenty. */
const HIGH_RISK = new Set(['dairy-milk','dairy-cheese-soft','dairy-yogurt','meat-raw','poultry-raw','fish-raw','deli-meat','produce-leafy','produce-berry','leftovers']);
const isHighRisk = cat => HIGH_RISK.has(cat);

/* Parse a date the vision model spotted on a package ("2026-08-12"), and
   only trust it if it lands in a sane window — guards against misreads. */
function parseExpiry(s) {
  if (!s) return null;
  const t = Date.parse(String(s).trim());
  if (isNaN(t)) return null;
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const now = today();
  if (d.getTime() < now - 7 * DAY || d.getTime() > now + 1095 * DAY) return null;
  return d.getTime();
}

/* ---------------- free on-device date OCR (Tesseract) ----------------
   "Video for the expiration dates" — read the printed date with ZERO API
   calls, offline, unlimited. Vendored + lazy-loaded (~a few MB, cached
   after first use). Its sweet spot is exactly this: digits and dates. */
const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
function ymd(y, mo, d) {
  mo = +mo; d = +d; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return parseExpiry(`${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
}
/* Pull a date out of OCR'd (or any) text across the formats packages use. */
function extractDate(text) {
  const t = String(text || '').toUpperCase().replace(/[^\w\/.\-: ]/g, ' ');
  let m;
  if ((m = t.match(/\b(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/))) return ymd(m[1], m[2], m[3]);          // YYYY-MM-DD
  if ((m = t.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return ymd(y, m[1], m[2]); } // MM/DD/YYYY (US)
  if ((m = t.match(/\b(\d{1,2})\s*([A-Z]{3})[A-Z]*\s*(20\d{2}|\d{2})\b/))) { const mo = MONTHS[m[2].toLowerCase()]; if (mo) return ymd(m[3].length === 2 ? '20' + m[3] : m[3], mo, m[1]); } // DD MON YYYY
  if ((m = t.match(/\b([A-Z]{3})[A-Z]*\s*(\d{1,2})\s*,?\s*(20\d{2}|\d{2})\b/))) { const mo = MONTHS[m[1].toLowerCase()]; if (mo) return ymd(m[3].length === 2 ? '20' + m[3] : m[3], mo, m[2]); } // MON DD YYYY
  return null;
}
const tessUrl = p => new URL('tess/' + p, location.href).href;
let tessWorker = null, tessLibLoading = null;
function loadTessLib() {
  if (window.Tesseract) return Promise.resolve();
  if (tessLibLoading) return tessLibLoading;
  tessLibLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = tessUrl('tesseract.min.js');
    s.onload = () => res(); s.onerror = () => { tessLibLoading = null; rej(new Error('date reader failed to load')); };
    document.head.appendChild(s);
  });
  return tessLibLoading;
}
async function getTessWorker() {
  await loadTessLib();
  if (!tessWorker) {
    tessWorker = await Tesseract.createWorker('eng', 1, {
      workerPath: tessUrl('worker.min.js'),
      corePath: tessUrl(''),
      langPath: tessUrl(''),
      gzip: true,
    });
    await tessWorker.setParameters({ tessedit_char_whitelist: '0123456789/.:- ABCDEFGHIJKLMNOPQRSTUVWXYZ' });
  }
  return tessWorker;
}
async function ocrDate(imageUrl) {
  const w = await getTessWorker();
  const { data } = await w.recognize(imageUrl);
  return { text: data.text || '', date: extractDate(data.text) };
}
async function scanDateForItem(it, file) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<h1 style="margin:0 0 12px"><span class="spin"></span> Reading the date…</h1>
    <p class="note">On-device — no internet, no AI limits. The first scan loads the reader (a few MB, cached after).</p>`;
  dlg.showModal();
  try {
    const { b64, mime } = await toB64(file);
    const { date, text } = await ocrDate(`data:${mime};base64,${b64}`);
    if (date) {
      it.expires = date; it.dateConfirmed = true; await saveItem(it); learnFromDate(it);
      dlg.close(); render();
      toast(`${it.name} — good until ${fmtDate(date).replace('EXP ', '')}`);
    } else {
      dlg.innerHTML = `<h1 style="margin:0 0 10px">Couldn't find a date</h1>
        <p class="note" style="margin-bottom:12px">Read: "${esc((text || '').trim().slice(0, 80))}". Try a closer, flatter shot of just the date — or type it.</p>
        <button class="btn ghost" data-a="type">Type the date</button>
        <button class="btn ghost" data-a="c" style="margin-top:8px;border:none;color:var(--vapor)">Close</button>`;
      dlg.querySelector('[data-a=type]').onclick = () => { dlg.close(); dateSheet(it); };
      dlg.querySelector('[data-a=c]').onclick = () => dlg.close();
    }
  } catch (e) {
    dlg.innerHTML = `<h1 style="margin:0 0 10px">Scanner didn't load</h1>
      <div class="warn" style="margin-bottom:12px">${esc(e.message)}. If this is your first time offline, open the app once with signal so it caches.</div>
      <button class="btn ghost" onclick="document.getElementById('dlg').close()">Close</button>`;
  }
}

/* Live "video" date reader: point the camera at the printed Best-By and it
   reads frames continuously until a date locks — no shutter, no AI, no limits.
   Runs its OWN camera stream so it never collides with the barcode scanner's.
   OCR is slow (~1-2s/frame), so we crop tight to the reticle and scan frames
   one at a time in sequence rather than at animation speed. */
async function liveDateScan(it) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<h1 style="margin:0 0 10px;font-size:17px">Point at the date</h1>
    <div id="dscanwrap" style="position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;margin-bottom:10px">
      <video id="dvid" playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>
      <div style="position:absolute;inset:34% 12%;border:2px solid rgba(21,154,85,.85);border-radius:8px;pointer-events:none"></div>
    </div>
    <div class="note" id="dhint" style="text-align:center;margin-bottom:12px"><span class="spin"></span> Warming up the reader…</div>
    <button class="btn ghost" data-a="type" style="margin-bottom:8px">Type it instead</button>
    <button class="btn ghost" data-a="cancel" style="border:none;color:var(--vapor)">Cancel</button>`;
  dlg.showModal();

  const video = dlg.querySelector('#dvid');
  const hint = dlg.querySelector('#dhint');
  let localStream = null, running = true, worker = null;

  const cleanup = () => { running = false; try { localStream?.getTracks().forEach(t => t.stop()); } catch (e) {} localStream = null; };
  dlg.querySelector('[data-a=cancel]').onclick = () => { cleanup(); dlg.close(); };
  dlg.querySelector('[data-a=type]').onclick = () => { cleanup(); dlg.close(); dateSheet(it); };
  dlg.addEventListener('close', cleanup, { once: true });   // closing via backdrop/esc also releases the camera

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = localStream; await video.play();
    worker = await getTessWorker();                 // first time downloads ~9MB, then cached
  } catch (e) {
    if (!running) return;
    hint.innerHTML = `<div class="warn" style="text-align:left">${esc(e.message || 'Camera or reader unavailable')}. Use “Type it instead”, or the photo scanner from the item menu.</div>`;
    return;
  }
  if (!running) return;
  hint.innerHTML = 'Hold steady over the date — it reads on its own.';

  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let misses = 0;
  while (running && dlg.open) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) { await sleep(120); continue; }
    // crop to the reticle band (inset 34%/12%) — just the date, upscaled for legibility
    const cx = vw * 0.12, cy = vh * 0.34, cw = vw * 0.76, ch = vh * 0.32, scale = 2;
    cv.width = cw * scale; cv.height = ch * scale;
    ctx.drawImage(video, cx, cy, cw, ch, 0, 0, cv.width, cv.height);
    let date = null, text = '';
    try { const { data } = await worker.recognize(cv); text = data.text || ''; date = extractDate(text); } catch (e) {}
    if (!running || !dlg.open) break;
    if (date) {
      cleanup();
      it.expires = date; it.dateConfirmed = true; await saveItem(it); learnFromDate(it);
      dlg.close(); render();
      toast(`${it.name} — good until ${fmtDate(date).replace('EXP ', '')}`);
      return;
    }
    misses++;
    const seen = (text || '').replace(/\s+/g, ' ').trim().slice(0, 28);
    hint.innerHTML = misses > 4 && seen
      ? `Reading… “${esc(seen)}” <span class="note">— closer / flatter helps</span>`
      : 'Hold steady over the date — it reads on its own.';
    await sleep(60);
  }
}

/* Freshness as temperature. Fresh things are cold. Dying things warm up.
   This is the single idea the whole interface is built on. */
function freshness(item) {
  const left = Math.round((item.expires - today()) / DAY);
  const span = Math.max(1, Math.round((item.expires - item.added) / DAY));
  const frac = left / span;
  let rail, label;
  if (left < 0)        { rail = 'var(--spoil)'; label = `EXPIRED ${-left}D`; }
  else if (left === 0) { rail = 'var(--spoil)'; label = 'TODAY'; }
  else if (left <= 2)  { rail = 'var(--spoil)'; label = `${left}D LEFT`; }
  else if (left <= 5 || frac < .18) { rail = 'var(--thaw)'; label = `${left}D LEFT`; }
  else                 { rail = 'var(--fresh)'; label = fmtDate(item.expires); }  // fresh stays quiet
  return { left, rail, label };
}
const fmtDate = ts => { const d = new Date(ts); return `EXP ${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; };
const LEVELS = ['out','low','half','most','full'];

/* ---------------- toast + undo ----------------
   Nothing destructive is ever one tap. A kid will nuke the freezer
   by accident on day three; this is the seatbelt. */
let toastT;
function toast(msg, undo) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span></span>`;
  el.firstChild.textContent = msg;
  if (undo) {
    const b = document.createElement('button');
    b.textContent = 'UNDO';
    b.onclick = async () => { await undo(); el.remove(); render(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), undo ? 8000 : 2800);   // longer window to catch an accidental tap
}

async function logAction(action, detail) {
  await DB.put('log', { id: uid(), ts: Date.now(), who: S.who?.name || '?', action, detail });
}

/* ---------------- item mutations ---------------- */
async function saveItem(it) {
  it.updatedAt = Date.now();
  await DB.put('items', it);
  const i = S.items.findIndex(x => x.id === it.id);
  if (i > -1) S.items[i] = it; else S.items.push(it);
  SYNC.push('items', it.id, it);
}

/* Shopping list — a synced store of its own. */
async function saveShopping(it) {
  it.updatedAt = Date.now();
  await DB.put('shopping', it);
  const i = S.shopping.findIndex(x => x.id === it.id);
  if (i > -1) S.shopping[i] = it; else S.shopping.push(it);

}
async function saveHousehold() {
  S.household.id = 'household';
