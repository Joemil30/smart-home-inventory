name: Deploy Stocked to GitHub Pages

# Publishes the app to GitHub Pages on every push to the default branch.
# configure-pages (enablement: true) turns Pages on automatically the first
# time this runs on a public repo — no manual Settings toggle needed.
# workflow_dispatch lets it be re-run by hand from the Actions tab.
on:
  push:
    branches: [claude/cold-room-pwa-mpph5h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables it if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (repo root — the app is static)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
