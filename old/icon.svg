<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Same bowl+check as the live icon, deliberately desaturated and banded
       so the two are distinguishable at home-screen size. If both icons look
       alike, a side-by-side comparison is useless the moment you close one. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2318"/>
      <stop offset="1" stop-color="#12100A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M170 186 L232 248 L348 132" fill="none" stroke="#B98A3E"
        stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 276 H406 A150 150 0 0 1 106 276 Z" fill="#B98A3E"/>
  <rect x="0" y="392" width="512" height="86" fill="#8A5A12"/>
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif"
        font-size="54" font-weight="700" fill="#fff" letter-spacing="6">JUL 29</text>
</svg>
